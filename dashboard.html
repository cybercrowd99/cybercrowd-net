<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elastic Dashboard</title>
<link rel="stylesheet" href="dashboard.css">
</head>

<body>

<div id="dashboard" data-tier="free" data-state="expanded">

    <div class="header">
        <div class="label">DASHBOARD</div>
        <button data-action="dock-toggle" style="background:none;border:none;color:#0ff;cursor:pointer;font-size:12px;">DOCK</button>
    </div>

    <div class="core">
        <!-- free tier items -->
    </div>

    <div class="member">
        <!-- member tier items -->
    </div>

    <div class="creator">
        <!-- creator tier items -->
    </div>

    <div class="dock">
        <!-- dock zone -->
    </div>

</div>

<script type="module" src="dashboard.js"></script>

</body>
</html>
