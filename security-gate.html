<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cybercrowd Security Gate</title>

<style>

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background: #050505;
    color: white;

    font-family: Arial, sans-serif;
}

#stage {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 24px;
    box-sizing: border-box;

    background:
    radial-gradient(
        circle at center,
        rgba(0,255,255,0.10),
        transparent 42%
    ),
    #050505;
}

#gate {
    width: 92%;
    max-width: 520px;

    background: rgba(12,12,12,0.92);

    border:
    1px solid rgba(0,255,255,0.42);

    border-radius: 22px;

    padding: 28px;

    box-shadow:
    0 0 28px rgba(0,255,255,0.18);

    box-sizing: border-box;
}

h1 {
    color: #00ffff;

    margin-top: 0;

    letter-spacing: 3px;

    text-align: center;
}

p {
    opacity: 0.86;

    line-height: 1.55;

    text-align: center;
}

.statusBox {
    margin-top: 18px;

    padding: 16px;

    border-radius: 14px;

    background: #151515;

    border:
    1px solid rgba(0,255,170,0.45);
}

.label {
    color: #00ffaa;

    font-size: 12px;

    letter-spacing: 2px;

    margin-bottom: 6px;
}

.value {
    font-size: 18px;
}

.field {
    margin-top: 18px;
}

input[type="email"] {
    width: 100%;

    padding: 15px;

    border-radius: 14px;

    border:
    1px solid rgba(0,255,255,0.30);

    background:
    rgba(255,255,255,0.04);

    color: white;

    font-size: 16px;

    box-sizing: border-box;
}

input[type="email"]:focus {
    outline: none;

    border:
    1px solid rgba(0,255,255,0.75);

    box-shadow:
    0 0 14px rgba(0,255,255,0.22);
}

#humanRow {
    margin-top: 18px;

    display: flex;

    align-items: center;

    gap: 12px;

    padding: 14px;

    border-radius: 14px;

    background:
    rgba(0,255,255,0.05);

    border:
    1px solid rgba(0,255,255,0.22);
}

#humanCheck {
    width: 22px;
    height: 22px;

    cursor: pointer;
}

#humanText {
    line-height: 1.5;

    opacity: 0.86;
}

button {
    width: 100%;

    margin-top: 14px;

    padding: 16px;

    border: none;

    border-radius: 16px;

    background:
    linear-gradient(
        90deg,
        #00ffff,
        #00ffaa
    );

    color: black;

    font-weight: bold;

    font-size: 16px;

    letter-spacing: 2px;

    cursor: pointer;
}

button:hover {
    box-shadow:
    0 0 22px rgba(0,255,255,0.28);
}

#message {
    margin-top: 16px;

    min-height: 20px;

    color: #00ffaa;

    text-align: center;

    letter-spacing: 2px;

    font-size: 12px;
}

#footer {
    margin-top: 24px;

    text-align: center;

    opacity: 0.42;

    font-size: 11px;

    letter-spacing: 2px;
}

</style>
</head>

<body>

<div id="stage">

<div id="gate">

<h1>
SECURITY GATE
</h1>

<p>
Free entry requires a verified continuity identity.
Enter your email and confirm human access to continue.
</p>

<div class="statusBox">

<div class="label">
GATE STATUS
</div>

<div class="value" id="gateStatus">
WAITING
</div>

</div>

<div class="field">

<div class="label">
EMAIL
</div>

<input
id="emailInput"
type="email"
placeholder="you@example.com"
autocomplete="email">

</div>

<div id="humanRow">

<input
id="humanCheck"
type="checkbox">

<div id="humanText">
I am human and request free Cybercrowd entry.
</div>

</div>

<button id="verifyBtn">
VERIFY FREE ENTRY
</button>

<div id="message">
READY
</div>

<div id="footer">
CYBERCROWD SECURITY GATE V2
</div>

</div>

</div>

<script>

const emailInput =
document.getElementById(
'emailInput'
);

const humanCheck =
document.getElementById(
'humanCheck'
);

const verifyBtn =
document.getElementById(
'verifyBtn'
);

const gateStatus =
document.getElementById(
'gateStatus'
);

const message =
document.getElementById(
'message'
);

function validEmail(value) {

    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
}

function saveVerifiedSession(email) {

    const session = {

        verified: true,

        email: email,

        created: Date.now(),

        route: 'security-gate.html',

        next: 'page2.html'

    };

    localStorage.setItem(
        'cc_verified_email',
        email
    );

    localStorage.setItem(
        'cc_verified_session',
        JSON.stringify(session)
    );
}

function grantAccess(email) {

    saveVerifiedSession(email);

    gateStatus.innerText =
    'VERIFIED';

    message.innerText =
    'ACCESS GRANTED';

    verifyBtn.innerText =
    'ENTERING';

    setTimeout(function() {

        window.location.href =
        'page2.html';

    }, 900);
}

verifyBtn.addEventListener(
'click',
function() {

    const email =
    emailInput.value.trim().toLowerCase();

    if (!validEmail(email)) {

        gateStatus.innerText =
        'BLOCKED';

        message.innerText =
        'VALID EMAIL REQUIRED';

        return;
    }

    if (!humanCheck.checked) {

        gateStatus.innerText =
        'BLOCKED';

        message.innerText =
        'HUMAN CHECK REQUIRED';

        return;
    }

    gateStatus.innerText =
    'VERIFYING';

    message.innerText =
    'FREE ENTRY VERIFIED';

    grantAccess(email);
}
);

const existingSession =
localStorage.getItem(
'cc_verified_session'
);

if (existingSession) {

    try {

        const parsed =
        JSON.parse(existingSession);

        if (parsed && parsed.verified === true) {

            gateStatus.innerText =
            'VERIFIED';

            message.innerText =
            'RETURNING VERIFIED SESSION';

            verifyBtn.innerText =
            'CONTINUE TO PAGE2';

            verifyBtn.addEventListener(
            'click',
            function() {

                window.location.href =
                'page2.html';
            },
            { once: true }
            );
        }

    } catch (error) {

        localStorage.removeItem(
            'cc_verified_session'
        );
    }
}

</script>

</body>
</html>
