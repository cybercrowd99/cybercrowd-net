<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CyberCrowd Verification</title>

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;

    background:#04070c;

    color:white;

    font-family:Arial,Helvetica,sans-serif;
}

#bg{
    position:fixed;
    inset:0;

    background:
    radial-gradient(
        circle at center,
        rgba(0,255,255,.08),
        transparent 42%
    ),
    linear-gradient(
        to bottom,
        #020406,
        #071018
    );
}

#wrap{
    position:relative;
    z-index:5;

    width:100%;
    height:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;
    box-sizing:border-box;
}

#panel{

    width:100%;
    max-width:540px;

    border-radius:24px;

    background:
    rgba(0,0,0,.74);

    border:
    1px solid rgba(0,255,255,.22);

    padding:34px;

    box-sizing:border-box;

    backdrop-filter:blur(8px);

    box-shadow:
    0 0 34px rgba(0,255,255,.08);
}

#title{
    text-align:center;

    color:#00ffff;

    font-size:34px;

    letter-spacing:5px;

    margin-bottom:18px;
}

#sub{
    text-align:center;

    opacity:.78;

    line-height:1.8;

    margin-bottom:28px;
}

#emailBox{

    border-radius:18px;

    border:
    1px solid rgba(0,255,255,.16);

    background:
    rgba(0,255,255,.04);

    padding:18px;

    margin-bottom:24px;

    text-align:center;

    line-height:1.7;
}

#email{
    color:#00ffaa;
    word-break:break-word;
}

#verifyBtn{

    width:100%;

    padding:16px;

    border:none;

    border-radius:18px;

    background:
    linear-gradient(
        90deg,
        #00ffff,
        #00ffaa
    );

    color:black;

    font-weight:bold;

    font-size:16px;

    cursor:pointer;

    transition:
    transform .2s ease,
    box-shadow .2s ease;
}

#verifyBtn:hover{

    transform:scale(1.02);

    box-shadow:
    0 0 20px rgba(0,255,255,.24);
}

#footer{
    margin-top:24px;

    text-align:center;

    opacity:.46;

    font-size:11px;

    letter-spacing:2px;
}

</style>
</head>

<body>

<div id="bg"></div>

<div id="wrap">

<div id="panel">

<div id="title">
VERIFY
</div>

<div id="sub">
Continuity verification email sent.<br>
Check your inbox to continue ecosystem access.
</div>

<div id="emailBox">

Verification pending for:

<div id="email">
loading...
</div>

</div>

<button id="verifyBtn">
CONTINUE
</button>

<div id="footer">
CYBERCROWD VERIFY PAGE V1
</div>

</div>

</div>

<script>

const email =
localStorage.getItem(
'cc_pending_verify'
);

document
.getElementById('email')
.innerText =
email || 'No pending verification';

document
.getElementById('verifyBtn')
.addEventListener(
'click',
function(){

alert(
'Verification routing layer connects here.'
);

});

</script>

</body>
</html>
