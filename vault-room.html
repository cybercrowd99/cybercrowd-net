<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CyberCrowd Vault</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #vault-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background-image: url('/assets/vault/vault-room.jpg');
      background-size: cover;
      background-position: center;
    }

    /* Poster Wall */
    #poster-wall {
      position: absolute;
      top: 20%;
      left: 10%;
      width: 80%;
      height: 50%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .poster-slot {
      border: 2px solid #b8860b;
      background: rgba(0,0,0,0.4);
      cursor: pointer;
      transition: 0.2s;
    }

    .poster-slot:hover {
      background: rgba(255,215,0,0.2);
    }

    /* Treasury Frame */
    #treasury-frame {
      position: absolute;
      bottom: 5%;
      right: 5%;
      width: 300px;
      height: 200px;
      background: rgba(0,0,0,0.6);
      border: 2px solid #b8860b;
      padding: 15px;
    }

    .hidden {
      display: none;
    }

    /* Upgrade Modal */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.7);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: #111;
      padding: 20px;
      border: 2px solid #b8860b;
      width: 300px;
      text-align: center;
    }

    .modal-actions button {
      margin: 10px;
      padding: 10px 20px;
      background: #b8860b;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div id="vault-container">

    <!-- POSTER SLOTS -->
    <div id="poster-wall">
      <div class="poster-slot" data-slot="1"></div>
      <div class="poster-slot" data-slot="2"></div>
      <div class="poster-slot" data-slot="3"></div>
      <div class="poster-slot" data-slot="4"></div>
    </div>
    
    <!-- PLAQUES -->
<div id="plaque-row" style="position:absolute; bottom:10%; left:10%; display:flex; gap:20px;">
  <a class="plaque about" href="about.html" style="color:#fff; text-decoration:none;">About</a>
  <a class="plaque contents" href="rules_regulations.html" style="color:#fff; text-decoration:none;">Contents</a>
  <a class="plaque register pass-through" href="/public/create-account.html"style="color:#fff; text-decoration:none;">JOIN</a>
</div>

    <!-- TREASURY FRAME -->
    <div id="treasury-frame" class="treasury hidden">
      <h2>Treasury</h2>
      <div class="treasury-content">
        <p>Your balances and allowances will appear here.</p>
      </div>
    </div>

    <!-- UPGRADE MODAL -->
    <div id="upgrade-modal" class="modal hidden">
      <div class="modal-content">
        <h2>Member privilege</h2>
        <p>This feature is for Members only.<br>Upgrade to unlock posting and treasury access.</p>
        <div class="modal-actions">
          <button id="upgradeButton">Upgrade</button>
          <button id="closeUpgradeModal">Close</button>
        </div>
      </div>
    </div>

  </div>

  <!-- SESSION GATE -->
  <script type="module">
  import { ensureSession } from "./session-inspector.js";
  ensureSession();
  </script>

  <!-- MEMBER GATE LOGIC -->
  <script>
    window.USER_TIER = window.USER_TIER || 'free';

    const posterSlots = document.querySelectorAll('.poster-slot');
    const upgradeModal = document.getElementById('upgrade-modal');
    const closeUpgradeModal = document.getElementById('closeUpgradeModal');
    const upgradeButton = document.getElementById('upgradeButton');

    posterSlots.forEach(slot => {
      slot.addEventListener('click', () => {
        const slotId = slot.getAttribute('data-slot');

        if (window.USER_TIER === 'member' || window.USER_TIER === 'creator') {
          window.location.href = '/profile/poster?slot=' + slotId;
        } else {
          upgradeModal.classList.remove('hidden');
        }
      });
    });

    closeUpgradeModal.addEventListener('click', () => {
      upgradeModal.classList.add('hidden');
    });

    upgradeButton.addEventListener('click', () => {
      window.location.href = '/upgrade/member';
    });
  </script>

</body>
</html>
