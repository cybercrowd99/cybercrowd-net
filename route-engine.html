<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cybercrowd Route Engine</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
}

#stage {
    min-height: 100vh;
    padding: 24px;
    box-sizing: border-box;
    background:
    radial-gradient(circle at center, rgba(0,255,255,0.10), transparent 42%),
    #050505;
}

#title {
    color: #00ffff;
    font-size: 34px;
    letter-spacing: 4px;
    text-align: center;
}

#subtitle {
    text-align: center;
    opacity: 0.72;
    margin-top: 8px;
    margin-bottom: 28px;
}

#grid {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;
}

.panel {
    background: rgba(12,12,12,0.92);
    border: 1px solid rgba(0,255,255,0.35);
    border-radius: 22px;
    padding: 22px;
    box-shadow: 0 0 24px rgba(0,255,255,0.14);
}

h2 {
    color: #00ffff;
    margin-top: 0;
}

.routeButton {
    width: 100%;
    margin-top: 12px;
    padding: 14px;
    border: 1px solid rgba(0,255,255,0.35);
    border-radius: 14px;
    background: rgba(0,255,255,0.07);
    color: white;
    font-weight: bold;
    cursor: pointer;
    text-align: left;
}

.routeButton:hover {
    background: rgba(0,255,255,0.16);
    box-shadow: 0 0 16px rgba(0,255,255,0.20);
}

.statBox {
    margin-top: 12px;
    padding: 14px;
    border-radius: 14px;
    background: #111;
    border: 1px solid rgba(0,255,170,0.35);
}

.label {
    color: #00ffaa;
    font-size: 12px;
    letter-spacing: 1px;
}

.value {
    margin-top: 6px;
    line-height: 1.5;
}

#suggestion {
    margin-top: 16px;
    padding: 16px;
    border-radius: 16px;
    background: #151515;
    border: 1px solid rgba(255,170,0,0.55);
    line-height: 1.5;
}

.clearBtn {
    width: 100%;
    margin-top: 18px;
    padding: 13px;
    border: none;
    border-radius: 12px;
    background: #333;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

@media (max-width: 820px) {
    #grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div id="stage">

<div id="title">ROUTE ENGINE</div>

<div id="subtitle">
curiosity → exploration → progression
</div>

<div id="grid">

<div class="panel">

<h2>Touch Routes</h2>

<button class="routeButton" onclick="touchRoute('Sandbox Cursor', 'tool')">
Sandbox Cursor
</button>

<button class="routeButton" onclick="touchRoute('Atomic Cricket', 'creator')">
Atomic Cricket
</button>

<button class="routeButton" onclick="touchRoute('Observer Broadcast', 'creator')">
Observer Broadcast
</button>

<button class="routeButton" onclick="touchRoute('Multi-Cam', 'creator')">
Multi-Cam
</button>

<button class="routeButton" onclick="touchRoute('CueberCare', 'care')">
CueberCare
</button>

<button class="routeButton" onclick="touchRoute('CyberMinistries', 'care')">
CyberMinistries
</button>

<button class="routeButton" onclick="touchRoute('Profile Room', 'identity')">
Profile Room
</button>

<button class="routeButton" onclick="touchRoute('FlowRail', 'utility')">
FlowRail
</button>

<button class="clearBtn" onclick="clearEngine()">
CLEAR ROUTE ENGINE
</button>

</div>

<div class="panel">

<h2>Route Behavior</h2>

<div class="statBox">
    <div class="label">LAST ROUTE TOUCHED</div>
    <div class="value" id="lastRoute">None</div>
</div>

<div class="statBox">
    <div class="label">TOTAL ROUTE TOUCHES</div>
    <div class="value" id="totalTouches">0</div>
</div>

<div class="statBox">
    <div class="label">DOMINANT INTEREST</div>
    <div class="value" id="dominantInterest">None</div>
</div>

<div class="statBox">
    <div class="label">RECENT ROUTE TRAIL</div>
    <div class="value" id="recentTrail">None</div>
</div>

<div id="suggestion">
Touch routes to let Cybercrowd detect curiosity without breaking flow.
</div>

</div>

</div>

</div>

<script>
const storageKey = "cybercrowd_route_engine_v1";

function blankEngine() {
    return {
        lastRoute: "None",
        totalTouches: 0,
        recentTrail: [],
        interest: {
            creator: 0,
            care: 0,
            identity: 0,
            utility: 0,
            tool: 0
        }
    };
}

function getEngine() {
    const raw = localStorage.getItem(storageKey);

    if (!raw) {
        return blankEngine();
    }

    return JSON.parse(raw);
}

function saveEngine(engine) {
    localStorage.setItem(storageKey, JSON.stringify(engine));
}

function touchRoute(routeName, category) {
    const engine = getEngine();

    engine.lastRoute = routeName;
    engine.totalTouches = engine.totalTouches + 1;

    engine.recentTrail.unshift(routeName);
    engine.recentTrail = engine.recentTrail.slice(0, 7);

    if (engine.interest[category] !== undefined) {
        engine.interest[category] = engine.interest[category] + 1;
    }

    saveEngine(engine);
    renderEngine();
}

function clearEngine() {
    localStorage.removeItem(storageKey);
    renderEngine();
}

function getDominantInterest(engine) {
    let winner = "None";
    let winnerValue = 0;

    Object.keys(engine.interest).forEach((key) => {
        if (engine.interest[key] > winnerValue) {
            winner = key;
            winnerValue = engine.interest[key];
        }
    });

    if (winnerValue === 0) {
        return "None";
    }

    return winner;
}

function buildSuggestion(engine, dominant) {
    if (engine.totalTouches === 0) {
        return "Touch routes to let Cybercrowd detect curiosity without breaking flow.";
    }

    if (engine.totalTouches < 4) {
        return "Cybercrowd is reading the route trail. Keep exploring. No pressure.";
    }

    if (dominant === "creator") {
        return "You are showing strong creator-route interest. Later, this can unlock a 7-day creator trial prompt.";
    }

    if (dominant === "care") {
        return "You are showing community-care interest. Later, this can suggest CueberCare or CyberMinistries routes.";
    }

    if (dominant === "identity") {
        return "You are showing profile-room interest. Later, this can suggest room customization tools and card stacks.";
    }

    if (dominant === "utility") {
        return "You are showing utility-layer interest. Later, this can suggest FlowRail tools and awareness modules.";
    }

    if (dominant === "tool") {
        return "You are showing sandbox-tool interest. Later, this can suggest Magic Cursor and object-transfer labs.";
    }

    return "Cybercrowd remembers the trail and builds progression from curiosity.";
}

function renderEngine() {
    const engine = getEngine();

    const dominant = getDominantInterest(engine);

    document.getElementById("lastRoute").textContent =
    engine.lastRoute;

    document.getElementById("totalTouches").textContent =
    engine.totalTouches;

    document.getElementById("dominantInterest").textContent =
    dominant;

    if (engine.recentTrail.length === 0) {
        document.getElementById("recentTrail").textContent =
        "None";
    } else {
        document.getElementById("recentTrail").textContent =
        engine.recentTrail.join(" → ");
    }

    document.getElementById("suggestion").innerHTML =
    buildSuggestion(engine, dominant);
}

renderEngine();
</script>

</body>
</html>
