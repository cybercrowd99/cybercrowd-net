<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>CyberCrowd // Member Entry</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
    }

    .member-entry-surface {
      position: relative;

      width: min(100vw, 150vh);
      aspect-ratio: 3 / 2;

      flex: 0 0 auto;

      background-image:
        url("https://pub-081cb3c244be4e09b5e76012567a0b0a.r2.dev/Registry-Image/IDENTITY-LANDING-PAGE.png");

      background-position: center;
      background-repeat: no-repeat;
      background-size: 100% 100%;
    }

    .member-entry-target {
      position: absolute;

      top: 22%;
      left: 6.5%;

      width: 29%;
      height: 38%;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    #member-email {
      width: 86%;

      border: 0;
      border-bottom:
        1px solid rgba(126, 247, 255, 0.55);

      outline: 0;

      padding:
        0.55rem 0.25rem;

      background: transparent;

      color: #e6fdff;

      text-align: center;

      font-size:
        clamp(11px, 1.25vw, 19px);

      letter-spacing: 0.04em;

      caret-color: #9afaff;

      text-shadow:
        0 0 5px rgba(126, 247, 255, 0.9),
        0 0 11px rgba(0, 220, 255, 0.55);
    }

    #member-email::placeholder {
      color:
        rgba(220, 252, 255, 0.48);
    }

    #registrant-hologram {
      position: absolute;

      inset: 0;

      display: none;

      align-items: center;
      justify-content: center;

      pointer-events: none;
    }

    #registrant-hologram.active {
      display: flex;
    }

    #registrant-hologram svg {
      width: 48%;
      height: 48%;

      overflow: visible;

      filter:
        drop-shadow(0 0 4px rgba(255, 255, 255, 0.95))
        drop-shadow(0 0 10px rgba(0, 229, 255, 0.95))
        drop-shadow(0 0 24px rgba(0, 229, 255, 0.6));

      animation:
        hologram-form 650ms ease-out forwards;
    }

    .holo-ring,
    .holo-check {
      fill: none;

      stroke: #bffcff;

      stroke-width: 3;

      stroke-linecap: round;
      stroke-linejoin: round;

      vector-effect:
        non-scaling-stroke;
    }

    .holo-ring {
      stroke-dasharray: 300;
      stroke-dashoffset: 300;

      animation:
        draw-ring 620ms ease-out forwards;
    }

    .holo-check {
      stroke-dasharray: 120;
      stroke-dashoffset: 120;

      animation:
        draw-check 420ms 430ms ease-out forwards;
    }

    @keyframes hologram-form {
      0% {
        opacity: 0;
        transform:
          scale(0.72);
        filter:
          blur(9px);
      }

      55% {
        opacity: 1;
      }

      100% {
        opacity: 1;
        transform:
          scale(1);
        filter:
          blur(0);
      }
    }

    @keyframes draw-ring {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes draw-check {
      to {
        stroke-dashoffset: 0;
      }
    }
  </style>
</head>

<body>

  <main
    class="member-entry-surface"
    aria-label="CyberCrowd Member Entry"
  >

    <section
      class="member-entry-target"
      aria-label="Member identity search"
    >

      <input
        id="member-email"
        type="email"
        inputmode="email"
        autocomplete="email"
        placeholder="youname@email.com"
        aria-label="Registered CyberCrowd email"
      />

      <div
        id="registrant-hologram"
        aria-label="Known CyberCrowd registrant"
      >
        <svg
          viewBox="0 0 120 120"
          aria-hidden="true"
        >
          <circle
            class="holo-ring"
            cx="60"
            cy="60"
            r="42"
          />

          <path
            class="holo-check"
            d="M38 61 L53 76 L83 43"
          />
        </svg>
      </div>

    </section>

  </main>

  <script>
    const emailInput =
      document.getElementById(
        "member-email"
      );

    const hologram =
      document.getElementById(
        "registrant-hologram"
      );

    emailInput.addEventListener(
      "keydown",
      async function (event) {

        if (event.key !== "Enter") {
          return;
        }

        event.preventDefault();

        const email =
          String(
            emailInput.value || ""
          )
            .trim()
            .toLowerCase();

        if (!email) {
          return;
        }

        emailInput.disabled = true;

        try {
          const response =
            await fetch(
              "/api/auth/returning-email-match",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify({
                    email
                  })
              }
            );

          const result =
            await response
              .json()
              .catch(() => null);

          const knownRegistrant =
            response.ok &&
            result?.success === true &&
            result?.matched === true &&
            Boolean(
              result?.identity_active_id
            );

          if (!knownRegistrant) {
            emailInput.disabled = false;
            emailInput.select();

            return;
          }

          emailInput.remove();

          hologram.classList.add(
            "active"
          );

        } catch {
          emailInput.disabled = false;
          emailInput.focus();
        }
      }
    );

    emailInput.focus();
  </script>

</body>
</html>
