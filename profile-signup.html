<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CyberCrowd Sign In</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

  <style>
    :root {
      --gold: #d4af37;
      --gold-dark: #7a5f24;
      --cyan: #00ffff;
      --cream: #f8f3e7;
      --muted: rgba(248, 243, 231, 0.68);
      --panel: rgba(0, 0, 0, 0.76);
      --line: rgba(212, 175, 55, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(0,255,255,0.12), transparent 32%),
        radial-gradient(circle at bottom, rgba(212,175,55,0.12), transparent 36%),
        #000;
      color: var(--cream);
      font-family: "Segoe UI", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
    }

    .signin-card {
      width: min(430px, 100%);
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--panel);
      box-shadow:
        0 0 28px rgba(0,255,255,0.08),
        0 0 34px rgba(212,175,55,0.10);
      padding: 30px;
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-mark {
      color: var(--cyan);
      font-size: 0.76rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      color: var(--gold);
      font-size: 2.35rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .subtext {
      margin: 12px 0 0;
      color: var(--muted);
      line-height: 1.45;
      font-size: 0.95rem;
    }

    label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin: 18px 0 8px;
      color: var(--cream);
      font-size: 0.92rem;
      font-weight: 700;
    }

    label a {
      color: var(--muted);
      font-weight: 500;
      text-decoration: none;
    }

    label a:hover {
      color: var(--cyan);
    }

    input {
      width: 100%;
      border: 1px solid rgba(212,175,55,0.30);
      border-radius: 12px;
      background: rgba(255,255,255,0.06);
      color: var(--cream);
      padding: 14px 15px;
      font-size: 1rem;
      outline: none;
    }

    input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(0,255,255,0.10);
    }

    .human-title {
      margin: 22px 0 10px;
      color: var(--cream);
      font-weight: 700;
    }

    .human-box {
      border: 1px solid rgba(212,175,55,0.26);
      border-radius: 14px;
      background: rgba(255,255,255,0.04);
      padding: 14px;
      min-height: 84px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button {
      width: 100%;
      margin-top: 22px;
      border: 2px solid var(--gold);
      border-radius: 999px;
      background: linear-gradient(145deg, #b08d3a, var(--gold-dark));
      color: var(--cream);
      padding: 14px 22px;
      font-size: 0.96rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.48;
      cursor: not-allowed;
    }

    .signup-line {
      margin-top: 24px;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .signup-line a {
      color: var(--cream);
      font-weight: 700;
      text-decoration: none;
    }

    .signup-line a:hover {
      color: var(--cyan);
    }

    .status {
      display: none;
      margin-top: 18px;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1px solid rgba(0,255,255,0.22);
      background: rgba(0,255,255,0.06);
      color: var(--muted);
      line-height: 1.45;
      font-size: 0.92rem;
    }

    .status.error {
      border-color: rgba(255,90,90,0.45);
      background: rgba(255,90,90,0.08);
      color: #ffd6d6;
    }

    .honeypot {
      position: absolute;
      left: -9999px;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <main class="signin-card">
    <div class="brand">
      <div class="brand-mark">cybercrowd.net</div>
      <h1>Sign In</h1>
      <p class="subtext">
        Complete the human check, then request your secured CyberCrowd token lane.
      </p>
    </div>

    <form id="cybercrowdSigninForm">
      <label for="email">
        <span>Email</span>
        <a href="mailto:support@cybercrowd.net">Forgot email?</a>
      </label>
      <input id="email" name="email" type="email" autocomplete="email" required />

      <label for="password">
        <span>Password</span>
        <a href="/verify-success.html">Forgot password?</a>
      </label>
      <input id="password" name="password" type="password" autocomplete="current-password" />

      <input class="honeypot" id="website" name="website" type="text" tabindex="-1" autocomplete="off" />

      <div class="human-title">Let us know you are human</div>

      <div class="human-box">
        <div
          class="cf-turnstile"
          data-sitekey="0x4AAAAAADfQngkepKNH0eUJ"
          data-callback="onHumanVerified"
          data-expired-callback="onHumanExpired"
          data-error-callback="onHumanExpired"
          data-theme="dark">
        </div>
      </div>

      <button id="signinButton" type="submit" disabled>Sign In</button>

      <div class="signup-line">
        Don’t have an account?
        <a href="/profile-signup.html">Sign up</a>
      </div>

      <div class="status" id="statusBox"></div>
    </form>
  </main>

  <script>
    const SIGNIN_ENDPOINT = "/api/auth/signup";

    const form = document.getElementById("cybercrowdSigninForm");
    const statusBox = document.getElementById("statusBox");
    const signinButton = document.getElementById("signinButton");

    let humanToken = "";

    window.onHumanVerified = function (token) {
      humanToken = token || "";
      signinButton.disabled = !humanToken;
      showStatus("Human check complete. You may now request your CyberCrowd token.", "");
    };

    window.onHumanExpired = function () {
      humanToken = "";
      signinButton.disabled = true;
      showStatus("Human check expired. Complete it again before signing in.", "error");
    };

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const formData = new FormData(form);

      const payload = {
        email: String(formData.get("email") || "").trim(),
        password: String(formData.get("password") || ""),
        website: String(formData.get("website") || "").trim(),
        humanToken: humanToken,
        tokenPurpose: "cybercrowd-signin",
        domain: "cybercrowd.net"
      };

      if (!payload.email || !payload.email.includes("@")) {
        showStatus("Enter a valid email address before signing in.", "error");
        return;
      }

      if (!payload.humanToken) {
        showStatus("Complete the human check before signing in.", "error");
        return;
      }

      signinButton.disabled = true;
      signinButton.textContent = "Checking...";
      showStatus("Checking human token and requesting CyberCrowd token lane.", "");

      try {
        const response = await fetch(SIGNIN_ENDPOINT, {
          method: "POST",
          headers: {
            "content-type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        let result = null;

        try {
          result = await response.json();
        } catch (jsonError) {
          result = null;
        }

        if (!response.ok) {
          const message =
            result && result.error
              ? result.error
              : "Sign in request failed. Check the API, token verifier, KV bindings, and email sender.";

          throw new Error(message);
        }

        showStatus("CyberCrowd token lane requested. Check your email to continue.", "");

        form.reset();
        humanToken = "";

        if (window.turnstile) {
          window.turnstile.reset();
        }
      } catch (error) {
        showStatus(
          "Sign in did not complete: " + String(error && error.message ? error.message : error),
          "error"
        );
      } finally {
        signinButton.disabled = !humanToken;
        signinButton.textContent = "Sign In";
      }
    });

    function showStatus(message, type) {
      statusBox.textContent = message;
      statusBox.className = "status " + (type || "");
      statusBox.style.display = "block";
    }
  </script>
</body>
</html>
