<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <title>PixelPrix | Clean-Up Adventure</title>

  <style>
    :root {
      --bg: #05060a;
      --gold: #ffd34d;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-width: 320px;
      min-height: 100%;
      margin: 0;
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    body {
      min-height: 100svh;
      min-height: 100dvh;
    }

    .pixelprix-enter {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100svh;
      height: 100dvh;
      min-height: 100%;
      background:
        url("https://pub-081cb3c244be4e09b5e76012567a0b0a.r2.dev/PixelPrix.png")
        center / cover
        no-repeat;
      text-decoration: none;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .pixelprix-enter:focus-visible {
      outline: 5px solid var(--gold);
      outline-offset: -10px;
    }

    .screen-reader-text {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>

<body>
  <a
    class="pixelprix-enter"
    id="pixelprix-enter"
    href="pixelprix-game.html"
    aria-label="Play PixelPrix">
    <span class="screen-reader-text">Play PixelPrix</span>
  </a>

  <script>
    (function () {
      "use strict";

      const enter = document.getElementById("pixelprix-enter");

      function prepareGameDefaults() {
        try {
          if (!localStorage.getItem("pixelprixRobotVoice")) {
            localStorage.setItem("pixelprixRobotVoice", "female");
          }

          if (!localStorage.getItem("pixelprixTreasureCount")) {
            localStorage.setItem("pixelprixTreasureCount", "5");
          }

          localStorage.setItem("pixelprixGuide", "robot");
        } catch (error) {}
      }

      enter.addEventListener("pointerdown", prepareGameDefaults);
      enter.addEventListener("touchstart", prepareGameDefaults, { passive: true });
      enter.addEventListener("click", prepareGameDefaults);
    })();
  </script>
</body>
</html>
