<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Your Profile</title>
  <style>
    body {
      background:#000;
      color:#fff;
      font-family:Arial, sans-serif;
      margin:0;
      padding:0;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }
    #profile-box {
      width:350px;
      padding:20px;
      background:#111;
      border:2px solid #b8860b;
    }
    input, button {
      width:100%;
      padding:10px;
      margin-top:10px;
      background:#222;
      color:#fff;
      border:1px solid #b8860b;
    }
    button {
      background:#b8860b;
      cursor:pointer;
    }
  </style>
</head>

<body>
  <div id="profile-box">
    <h2>Create Your Profile</h2>

    <label>Display Name</label>
    <input type="text" id="displayName" placeholder="Enter your name">

    <label>Avatar URL</label>
    <input type="text" id="avatarUrl" placeholder="Paste image URL">

    <button id="saveProfile">Save Profile</button>
  </div>

  <script>
    document.getElementById('saveProfile').addEventListener('click', () => {
      const name = document.getElementById('displayName').value;
      const avatar = document.getElementById('avatarUrl').value;

      if (!name) {
        alert("Display name required");
        return;
      }

      localStorage.setItem('cc_profile_name', name);
      localStorage.setItem('cc_profile_avatar', avatar);

      window.location.href = '/vault-room.html';
    });
  </script>
</body>
</html>
