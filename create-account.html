<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>CyberCrowd Entry</title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <script
    src="https://challenges.cloudflare.com/turnstile/v0/api.js"
    async
    defer
  ></script>
</head>

<body>
  <img
    class="background-photo"
    src="https://pub-081cb3c244be4e09b5e76012567a0b0a.r2.dev/image-4.png"
    alt=""
  />

  <main
    class="page"
    id="entryPage"
    aria-label="CyberCrowd entry window"
  >
    <section
      class="glass-plaque"
      aria-labelledby="entry-title"
    >
      <div
        class="seal-wrapper"
        aria-hidden="false"
      >
        <div
          class="seal-ring"
          aria-hidden="true"
        ></div>

        <img
          class="seal"
          src="https://pub-081cb3c244be4e09b5e76012567a0b0a.r2.dev/1780664884427.png"
          alt="CyberCrowd Seal"
        />
      </div>

      <h1
        id="entry-title"
        class="title"
      >
        CyberCrowd Entry
      </h1>

      <div class="welcome">
        Welcome to CyberCrowd
      </div>

      <form
        class="entry-form"
        id="entryForm"
      >
        <input
          class="email-field"
          id="email"
          name="email"
          type="email"
          placeholder="Enter your email here"
          autocomplete="email"
          required
        />

        <div
          class="turnstile-slot"
          id="turnstileSlot"
        ></div>

        <button
          class="send-button"
          id="sendButton"
          type="submit"
        >
          Send
        </button>

        <div
          class="status"
          id="status"
          aria-live="polite"
        ></div>
      </form>
    </section>

    <a
      class="member-strap"
      href="login.html"
      aria-label="Already a member"
    >
      Already a Member
    </a>
  </main>

  <div
    class="check-email-overlay"
    id="checkEmailOverlay"
    role="status"
    aria-live="polite"
    aria-labelledby="checkEmailTitle"
    aria-hidden="true"
  >
    <div
      class="check-email-stage"
      id="checkEmailStage"
    >
      <div
        class="check-email-slab"
        aria-hidden="true"
      ></div>

      <div
        class="sparkle-glint"
        aria-hidden="true"
      ></div>

      <div class="floating-email-words">
        <div class="floating-email-inner">
          <h2 id="checkEmailTitle">
            Check Your Email
          </h2>

          <p>
            CyberCrowd sent your entry link.
          </p>

          <p>
            Open your email and press the link to continue.
          </p>

          <div class="hurry-back">
            Hurry Back
          </div>
        </div>
      </div>
    </div>
  </div>

  <audio
    id="checkEmailWhoosh"
    preload="auto"
  >
    <source
      src="https://pub-660d879738134ba990d1708d015ec763.r2.dev/whooshing-email-sent_1.1s%20teaser.mp3"
      type="audio/mpeg"
    />
  </audio>

  <link
    rel="stylesheet"
    href="create-account.css"
  />

  <script src="create-account.js"></script>

  <script
    type="module"
    src="create-account-entry.js"
  ></script>
</body>
</html>
