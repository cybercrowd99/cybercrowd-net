<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Create Your Account | CyberCrowd</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --glass-card: rgba(238, 248, 242, 0.34);
      --glass-edge: rgba(214, 242, 232, 0.78);
      --glass-shine: rgba(255, 255, 255, 0.42);
      --ink: #2a2118;
      --soft-ink: rgba(42, 33, 24, 0.76);
      --gold-top: #e9c979;
      --gold-bottom: #9b7131;
      --gold-border: rgba(82, 53, 20, 0.76);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #050505;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      display: grid;
      place-items: center;
      position: relative;
    }

    .background-photo {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 0;
      user-select: none;
      pointer-events: none;
    }

    .page {
      position: relative;
      z-index: 2;
      width: min(92vw, 520px);
      display: grid;
      justify-items: center;
      gap: 24px;
    }

    /* NEW PLAQUE */
    .glass-plaque {
      position: relative;
      width: 100%;
      padding: 44px 34px 42px;
      display: grid;
      justify-items: center;
      align-content: start;
      border: 2px solid var(--glass-edge);
      border-radius: 24px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.46), rgba(255, 255, 255, 0.12)),
        var(--glass-card);
      backdrop-filter: blur(7px) saturate(1.08);
      -webkit-backdrop-filter: blur(7px) saturate(1.08);
      box-shadow:
        0 26px 70px rgba(0, 0, 0, 0.34),
        inset 0 0 0 1px rgba(255, 255, 255, 0.52),
        inset 0 0 30px rgba(255, 255, 255, 0.18);
      overflow: hidden;
    }

    .glass-plaque::before {
      content: "";
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(255, 255, 255, 0.48);
      border-radius: 18px;
      pointer-events: none;
      z-index: 8;
    }

    .glass-plaque::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 55%;
      height: 38%;
      background: linear-gradient(135deg, var(--glass-shine), transparent 64%);
      pointer-events: none;
      z-index: 9;
    }

    .seal {
      width: 160px;
      height: 160px;
      object-fit: cover;
      margin-bottom: 24px;
      border-radius: 50%;
      box-shadow:
        inset 0 0 24px rgba(255, 255, 255, 0.24),
        inset 0 0 0 1px rgba(255, 255, 255, 0.42),
        0 14px 28px rgba(0, 0, 0, 0.28);
    }

    .title {
      margin: 0;
      color: var(--ink);
      font-size: clamp(2rem, 6vw, 3.05rem);
      line-height: 1;
      font-weight: 500;
      letter-spacing: 0.10em;
      text-align: center;
      text-transform: uppercase;
      z-index: 2;
    }

    .welcome {
      margin: 23px 0 34px;
      color: var(--soft-ink);
      font-size: clamp(1rem, 3vw, 1.45rem);
      font-weight: 500;
      letter-spacing: 0.12em;
      text-align: center;
      text-transform: uppercase;
      z-index: 2;
    }

    .email-field {
      width: min(100%, 390px);
      height: 58px;
      padding: 0 24px;
      border: 2px solid rgba(54, 39, 24, 0.78);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.28);
      color: var(--ink);
      font-size: clamp(1.05rem, 3vw, 1.35rem);
      text-align: center;
      outline: none;
      box-shadow:
        inset 0 0 10px rgba(0, 0, 0, 0.12),
        0 0 14px rgba(255, 255, 255, 0.18);
      z-index: 2;
    }

    .send-button {
      width: min(100%, 320px);
      height: 66px;
      margin-top: 36px;
      border: 2px solid var(--gold-border);
      border-radius: 999px;
      background: linear-gradient(180deg, var(--gold-top), var(--gold-bottom));
      color: #2a1b0b;
      font-size: clamp(1.6rem, 5vw, 2.3rem);
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, 0.45),
        inset 0 -5px 10px rgba(92, 55, 16, 0.28),
        0 10px 18px rgba(0, 0, 0, 0.18);
      cursor: default;
      z-index: 2;
    }

    .member-strap {
      min-width: min(88vw, 360px);
      min-height: 68px;
      padding: 16px 34px;
      border: 2px solid rgba(54, 39, 24, 0.74);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.28);
      color: var(--ink);
      display: grid;
      place-items: center;
      font-size: clamp(1rem, 3vw, 1.35rem);
      letter-spacing: 0.10em;
      text-align: center;
      text-transform: uppercase;
      box-shadow:
        0 14px 38px rgba(0, 0, 0, 0.18),
        inset 0 0 16px rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
      user-select: none;
      pointer-events: none;
      z-index: 3;
    }

    @media (max-width: 560px) {
      body {
        overflow-y: auto;
        padding: 24px 0;
      }

      .glass-card {
        min-height: 520px;
        padding: 38px 22px 36px;
      }

      .emblem-circle {
        width: min(72vw, 210px);
        margin-bottom: 22px;
      }
    }
  </style>
</head>

<body>
  <img
    class="background-photo"
    src="https://pub-081cb3c244be4e09b5e76012567a0b0a.r2.dev/image-4.png"
    alt=""
  />

  <main class="page" aria-label="CyberCrowd create account visual door">

    <!-- NEW PLAQUE -->
    <section class="glass-plaque">
      <img class="seal" src="YOUR-SEAL.png" alt="">
      <h1 class="title">Create Your Account</h1>
      <div class="welcome">Welcome to CyberCrowd</div>
      <input class="email-field" type="email" placeholder="Enter your email here" />
      <button class="send-button" type="button">Send</button>
    </section>

    <div class="member-strap" aria-label="Already a member">
      Already a Member
    </div>
  </main>
</body>
</html>
