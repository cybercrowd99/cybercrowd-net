<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>Create Your Account | CyberCrowd</title>

  <link
    rel="stylesheet"
    href="create-account.css"
  />
</head>

<body>
  <img
    class="background-photo"
    src="https://pub-081cb3c244be4e09b5e76012567a0b0a.r2.dev/image-4.png"
    alt=""
    aria-hidden="true"
  />

  <main
    class="page"
    aria-label="Create Your Account"
  >
    <section
      class="glass-plaque"
      aria-label="CyberCrowd create account room"
    >
      <div
        class="seal-wrapper"
        aria-label="CyberCrowd Seal"
      >
        <div
          class="seal-ring"
          aria-hidden="true"
        ></div>

        <img
          class="seal"
          src="https://pub-081cb3c244be4e09b5e76012567a0b0a.r2.dev/1780664884427.png"
          alt="CyberCrowd Seal"
        />
      </div>

      <h1 class="title">
        Create Your Account
      </h1>

      <div class="welcome">
        Welcome to CyberCrowd
      </div>

      <div
        id="entryForm"
        class="entry-form"
      >
        <input
          id="email"
          class="email-field"
          name="email"
          type="email"
          autocomplete="email"
          autocapitalize="none"
          spellcheck="false"
          placeholder="Add Your Email"
          aria-label="Email address"
        />

        <div
          id="turnstile-one"
          class="turnstile-slot"
          aria-label="First human verification"
        ></div>

        <div
          id="turnstile-two"
          class="turnstile-slot"
          aria-label="Second human verification"
        ></div>

        <button
          id="sendButton"
          class="send-button"
          type="button"
          disabled
          aria-disabled="true"
        >
          Send
        </button>

        <div
          id="status"
          class="status"
          aria-live="polite"
        ></div>
      </div>
    </section>

    <div
      class="member-strap"
      aria-label="Member access"
    >
      Member Access
    </div>
  </main>

  <div
    id="checkEmailOverlay"
    class="check-email-overlay"
    aria-hidden="true"
  >
    <div class="check-email-stage">
      <div
        class="check-email-slab"
        aria-hidden="true"
      ></div>

      <div class="floating-email-words">
        <div class="floating-email-inner">
          <h2>
            Check Your Email
          </h2>

          <p>
            Your CyberCrowd verification email is on its way.
          </p>

          <div class="hurry-back">
            Hurry Back
          </div>
        </div>
      </div>

      <div
        class="sparkle-glint"
        aria-hidden="true"
      ></div>
    </div>
  </div>

  <audio
    id="checkEmailWhoosh"
    preload="auto"
  >
    <source
      src="https://pub-660d879738134ba990d1708d015ec763.r2.dev/whooshing-email-sent_1.1s%20teaser.mp3"
      type="audio/mpeg"
    />
  </audio>

  <script
    src="https://challenges.cloudflare.com/turnstile/v0/api.js"
    async
    defer
  ></script>

  <script
    type="module"
    src="./turnstile-one-ui.js"
  ></script>

  <script
    src="./entry-flow-controller.js"
  ></script>
</body>
</html>
