<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Create An Account | CyberCrowd</title>

  <script
    src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"
    async
    defer
  ></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --wall-x: 0px;
      --wall-y: 0px;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    .create-account-stage {
      position: relative;
      width: 100%;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      isolation: isolate;
      background: #000;
    }

    .account-back-wall {
      position: absolute;
      inset: -12%;
      z-index: 0;
      background-image: url("https://pub-081cb3c244be4e09b5e76012567a0b0a.r2.dev/image-4.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transform: translate3d(var(--wall-x), var(--wall-y), 0) scale(1.14);
      transition: transform 120ms ease-out;
      will-change: transform;
      pointer-events: none;
    }

    .account-glass-window {
      position: relative;
      z-index: 2;
      width: min(74vw, 360px);
      aspect-ratio: 1 / 1.18;
      border-radius: 14px;

      background:
        linear-gradient(
          145deg,
          rgba(12, 22, 22, 0.34),
          rgba(4, 8, 8, 0.18)
        );

      border: 1px solid rgba(180, 245, 232, 0.42);

      backdrop-filter: blur(4px) saturate(120%);
      -webkit-backdrop-filter: blur(4px) saturate(120%);

      box-shadow:
        0 24px 70px rgba(0, 0, 0, 0.68),
        inset 0 1px 0 rgba(255, 255, 255, 0.18),
        inset 0 -1px 0 rgba(0, 0, 0, 0.52),
        0 0 18px rgba(160, 255, 235, 0.13);

      overflow: hidden;
    }

    .account-glass-window::before {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: 13px;
      border: 1px solid rgba(220, 255, 248, 0.12);
      pointer-events: none;
    }

    .account-glass-window::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 18%, rgba(255, 255, 255, 0.08), transparent 32%),
        linear-gradient(120deg, transparent 0%, rgba(255, 255, 255, 0.045) 46%, transparent 58%);
      pointer-events: none;
    }

    #turnstile-one {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: grid;
      place-items: center;
    }

    @media (max-width: 640px) {
      .account-glass-window {
        width: min(78vw, 330px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .account-back-wall {
        transition: none;
        transform: scale(1.14);
      }
    }

    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .account-glass-window {
        background: rgba(18, 24, 24, 0.66);
      }
    }
  </style>
</head>

<body>
  <main class="create-account-stage" aria-label="Create An Account">
    <div class="account-back-wall" aria-hidden="true"></div>

    <section class="account-glass-window" aria-label="Create An Account glass window">
      <div id="turnstile-one"></div>
    </section>
  </main>

  <script>
    (function () {
      const root = document.documentElement;
      const maxShift = 18;

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function setWallShift(x, y) {
        root.style.setProperty("--wall-x", x + "px");
        root.style.setProperty("--wall-y", y + "px");
      }

      function renderTurnstileOne() {
        if (!window.turnstile) {
          window.setTimeout(renderTurnstileOne, 50);
          return;
        }

        window.turnstile.render("#turnstile-one", {
          sitekey: "0x4AAAAAACvkecVo2F3hpb1r",
          appearance: "always"
        });
      }

      window.addEventListener("mousemove", function (event) {
        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;

        const x = ((event.clientX - centerX) / centerX) * maxShift;
        const y = ((event.clientY - centerY) / centerY) * maxShift;

        setWallShift(x, y);
      });

      window.addEventListener("deviceorientation", function (event) {
        const gamma = event.gamma || 0;
        const beta = event.beta || 0;

        const x = clamp(gamma * 0.7, -maxShift, maxShift);
        const y = clamp(beta * 0.25, -maxShift, maxShift);

        setWallShift(x, y);
      });

      renderTurnstileOne();
    })();
  </script>
</body>
</html>
