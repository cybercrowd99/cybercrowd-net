<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CyberCrowd Entry</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

  <style>
    :root {
      --glass-card: rgba(238, 248, 242, 0.28);
      --glass-edge: rgba(214, 242, 232, 0.78);
      --glass-shine: rgba(255, 255, 255, 0.42);
      --ink: #2a2118;
      --soft-ink: rgba(42, 33, 24, 0.76);
      --gold-top: #e9c979;
      --gold-bottom: #9b7131;
      --gold-border: rgba(82, 53, 20, 0.76);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #050505;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      display: grid;
      place-items: center;
      position: relative;
      padding: 24px;
    }

    .background-photo {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 0;
      user-select: none;
      pointer-events: none;
    }

    .page {
      position: relative;
      z-index: 2;
      width: min(92vw, 520px);
      display: grid;
      justify-items: center;
      gap: 24px;
    }

    .glass-plaque {
      position: relative;
      width: 100%;
      padding: 44px 34px 42px;
      display: grid;
      justify-items: center;
      align-content: start;
      border: 2px solid var(--glass-edge);
      border-radius: 24px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.42), rgba(255, 255, 255, 0.10)),
        var(--glass-card);
      backdrop-filter: blur(4px) saturate(1.08);
      -webkit-backdrop-filter: blur(4px) saturate(1.08);
      box-shadow:
        0 26px 70px rgba(0, 0, 0, 0.34),
        inset 0 0 0 1px rgba(255, 255, 255, 0.52),
        inset 0 0 30px rgba(255, 255, 255, 0.18);
      overflow: hidden;
    }

    .glass-plaque::before {
      content: "";
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(255, 255, 255, 0.48);
      border-radius: 18px;
      pointer-events: none;
      z-index: 8;
    }

    .glass-plaque::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 55%;
      height: 38%;
      background: linear-gradient(135deg, var(--glass-shine), transparent 64%);
      pointer-events: none;
      z-index: 9;
    }

    .seal-wrapper {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      position: relative;
      display: grid;
      place-items: center;
      margin-bottom: 24px;
      z-index: 12;
    }

    .seal-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.04);
      border: 2px solid rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(6px) saturate(1.02);
      -webkit-backdrop-filter: blur(6px) saturate(1.02);
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.45),
        inset 0 0 18px rgba(255, 255, 255, 0.12);
      transform: scale(1.06);
      z-index: 1;
      pointer-events: none;
    }

    .seal {
      width: 140px;
      height: 140px;
      object-fit: cover;
      border-radius: 50%;
      display: block;
      position: relative;
      z-index: 2;
      box-shadow:
        inset 0 0 24px rgba(255, 255, 255, 0.24),
        inset 0 0 0 1px rgba(255, 255, 255, 0.42),
        0 14px 28px rgba(0, 0, 0, 0.28);
      background-color: transparent;
    }

    .title {
      margin: 0;
      color: var(--ink);
      font-size: clamp(2rem, 6vw, 3.05rem);
      line-height: 1;
      font-weight: 500;
      letter-spacing: 0.10em;
      text-align: center;
      text-transform: uppercase;
      z-index: 12;
    }

    .welcome {
      margin: 23px 0 34px;
      color: var(--soft-ink);
      font-size: clamp(1rem, 3vw, 1.45rem);
      font-weight: 500;
      letter-spacing: 0.12em;
      text-align: center;
      text-transform: uppercase;
      z-index: 12;
    }

    .entry-form {
      width: 100%;
      display: grid;
      justify-items: center;
      z-index: 12;
    }

    .email-field {
      width: min(100%, 390px);
      height: 58px;
      padding: 0 24px;
      border: 2px solid rgba(54, 39, 24, 0.78);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.30);
      color: var(--ink);
      font-size: clamp(1.05rem, 3vw, 1.35rem);
      text-align: center;
      outline: none;
      box-shadow:
        inset 0 0 10px rgba(0, 0, 0, 0.12),
        0 0 14px rgba(255, 255, 255, 0.18);
    }

    .email-field::placeholder {
      color: rgba(42, 33, 24, 0.68);
    }

    .turnstile-slot {
      width: min(100%, 390px);
      min-height: 70px;
      margin-top: 22px;
      display: none;
      place-items: center;
    }

    .send-button {
      width: min(100%, 320px);
      height: 66px;
      margin-top: 28px;
      border: 2px solid var(--gold-border);
      border-radius: 999px;
      background: linear-gradient(180deg, var(--gold-top), var(--gold-bottom));
      color: #2a1b0b;
      font-size: clamp(1.6rem, 5vw, 2.3rem);
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, 0.45),
        inset 0 -5px 10px rgba(92, 55, 16, 0.28),
        0 10px 18px rgba(0, 0, 0, 0.18);
      cursor: pointer;
    }

    .send-button[disabled] {
      opacity: 0.65;
      cursor: wait;
    }

    .member-strap {
      min-width: min(88vw, 360px);
      min-height: 68px;
      padding: 16px 34px;
      border: 2px solid rgba(54, 39, 24, 0.74);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.28);
      color: var(--ink);
      display: grid;
      place-items: center;
      font-size: clamp(1rem, 3vw, 1.35rem);
      letter-spacing: 0.10em;
      text-align: center;
      text-transform: uppercase;
      text-decoration: none;
      box-shadow:
        0 14px 38px rgba(0, 0, 0, 0.18),
        inset 0 0 16px rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      user-select: none;
      z-index: 3;
    }

    .status {
      min-height: 22px;
      margin-top: 18px;
      color: var(--ink);
      font-size: 0.95rem;
      text-align: center;
      letter-spacing: 0.04em;
    }

    @media (max-width: 560px) {
      body {
        overflow-y: auto;
        padding: 24px 0;
      }

      .glass-plaque {
        padding: 38px 22px 36px;
      }

      .seal-wrapper {
        width: 140px;
        height: 140px;
      }

      .seal {
        width: 120px;
        height: 120px;
      }
    }
  </style>
</head>

<body>
  <img
    class="background-photo"
    src="https://pub-081cb3c244be4e09b5e76012567a0b0a.r2.dev/image-4.png"
    alt=""
  />

  <main class="page" aria-label="CyberCrowd entry window">
    <section class="glass-plaque" aria-labelledby="entry-title">
      <div class="seal-wrapper" aria-hidden="false">
        <div class="seal-ring" aria-hidden="true"></div>
        <img
          class="seal"
          src="https://pub-081cb3c244be4e09b5e76012567a0b0a.r2.dev/1780664884427.png"
          alt="CyberCrowd Seal"
        />
      </div>

      <h1 id="entry-title" class="title">CyberCrowd Entry</h1>
      <div class="welcome">Welcome to CyberCrowd</div>

      <form class="entry-form" id="entryForm">
        <input
          class="email-field"
          id="email"
          name="email"
          type="email"
          placeholder="Enter your email here"
          autocomplete="email"
          required
        />

        <div class="turnstile-slot" id="turnstileSlot"></div>

        <button class="send-button" id="sendButton" type="submit">Send</button>
        <div class="status" id="status" aria-live="polite"></div>
      </form>
    </section>

    <a class="member-strap" href="login.html" aria-label="Already a member">
      Already a Member
    </a>
  </main>

  <script>
    const form = document.getElementById("entryForm");
    const emailInput = document.getElementById("email");
    const sendButton = document.getElementById("sendButton");
    const statusText = document.getElementById("status");
    const turnstileSlot = document.getElementById("turnstileSlot");

    let humanToken = "";
    let widgetId = null;
    let gateVisible = false;

    function isValidEmail(value) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
    }

    function setStatus(text) {
      statusText.textContent = text;
    }

    function lockButton(text) {
      sendButton.disabled = true;
      sendButton.textContent = text;
    }

    function unlockButton() {
      sendButton.disabled = false;
      sendButton.textContent = "Send";
    }

    function renderHumanGate() {
      if (!window.turnstile) {
        setStatus("Human gate loading. Press Send again in a moment.");
        unlockButton();
        return;
      }

      turnstileSlot.style.display = "grid";
      gateVisible = true;

      if (widgetId !== null) {
        window.turnstile.remove(widgetId);
        widgetId = null;
      }

      widgetId = window.turnstile.render("#turnstileSlot", {
        sitekey: "71674985-37da-4da4-997d-aca0fb499793",
        callback: function (token) {
          humanToken = token;
          sendEntry();
        },
        "expired-callback": function () {
          humanToken = "";
          setStatus("Human gate expired. Press Send again.");
          unlockButton();
        },
        "error-callback": function () {
          humanToken = "";
          setStatus("Human gate failed. Press Send again.");
          unlockButton();
        }
      });
    }

    async function sendEntry() {
      const email = emailInput.value.trim();

      if (!isValidEmail(email)) {
        setStatus("Please enter a valid email.");
        emailInput.focus();
        unlockButton();
        return;
      }

      if (!humanToken) {
        lockButton("Check");
        setStatus("Complete the human gate.");

        if (!gateVisible) {
          renderHumanGate();
        } else {
          unlockButton();
        }

        return;
      }

      lockButton("Sending");
      setStatus("Preparing your CyberCrowd entry.");

      try {
        const response = await fetch("/api/auth/send-verification", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email: email,
            turnstileToken: humanToken
          })
        });

        const data = await response.json().catch(function () {
          return {};
        });

        if (!response.ok || data.success !== true) {
          throw new Error(data.error || "Entry request failed.");
        }

        sessionStorage.setItem("cybercrowd_entry_email", email);
        window.location.href = "email-sent.html";
      } catch (error) {
        humanToken = "";

        if (window.turnstile && widgetId !== null) {
          window.turnstile.reset(widgetId);
        }

        setStatus(error.message || "Entry request failed.");
        unlockButton();
      }
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      sendEntry();
    });
  </script>
</body>
</html>
