<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CyberCrowd Entry</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

  <style>
    :root {
      --glass-card: rgba(238, 248, 242, 0.28);
      --glass-edge: rgba(214, 242, 232, 0.78);
      --glass-shine: rgba(255, 255, 255, 0.42);
      --ink: #2a2118;
      --soft-ink: rgba(42, 33, 24, 0.76);
      --gold-top: #e9c979;
      --gold-bottom: #9b7131;
      --gold-border: rgba(82, 53, 20, 0.76);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #050505;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      display: grid;
      place-items: center;
      position: relative;
      padding: 24px;
    }

    .background-photo {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 0;
      user-select: none;
      pointer-events: none;
    }

    .page {
      position: relative;
      z-index: 2;
      width: min(92vw, 520px);
      display: grid;
      justify-items: center;
      gap: 24px;
      transform-origin: center center;
      transition:
        transform 720ms cubic-bezier(0.2, 0.85, 0.22, 1),
        opacity 720ms ease,
        filter 720ms ease;
      will-change: transform, opacity, filter;
    }

    body.check-email-open .page {
      transform:
        perspective(900px)
        translateY(24px)
        scale(0.90)
        rotateX(8deg);
      opacity: 0.56;
      filter: blur(1.2px) saturate(0.88);
    }

    .glass-plaque {
      position: relative;
      width: 100%;
      padding: 44px 34px 42px;
      display: grid;
      justify-items: center;
      align-content: start;
      border: 2px solid var(--glass-edge);
      border-radius: 24px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.42), rgba(255, 255, 255, 0.10)),
        var(--glass-card);
      backdrop-filter: blur(4px) saturate(1.08);
      -webkit-backdrop-filter: blur(4px) saturate(1.08);
      box-shadow:
        0 26px 70px rgba(0, 0, 0, 0.34),
        inset 0 0 0 1px rgba(255, 255, 255, 0.52),
        inset 0 0 30px rgba(255, 255, 255, 0.18);
      overflow: hidden;
      perspective: 900px;
      transform: translateY(-2px) rotateX(2deg);
    }

    .glass-plaque::before {
      content: "";
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(255, 255, 255, 0.48);
      border-radius: 18px;
      pointer-events: none;
      z-index: 8;
    }

    .glass-plaque::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 55%;
      height: 38%;
      background: linear-gradient(135deg, var(--glass-shine), transparent 64%);
      pointer-events: none;
      z-index: 9;
    }

    .seal-wrapper {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      position: relative;
      display: grid;
      place-items: center;
      margin-bottom: 24px;
      z-index: 12;
    }

    .seal-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.04);
      border: 2px solid rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(6px) saturate(1.02);
      -webkit-backdrop-filter: blur(6px) saturate(1.02);
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.45),
        inset 0 0 18px rgba(255, 255, 255, 0.12);
      transform: scale(1.06);
      z-index: 1;
      pointer-events: none;
    }

    .seal {
      width: 140px;
      height: 140px;
      object-fit: cover;
      border-radius: 50%;
      display: block;
      position: relative;
      z-index: 2;
      box-shadow:
        inset 0 0 24px rgba(255, 255, 255, 0.24),
        inset 0 0 0 1px rgba(255, 255, 255, 0.42),
        0 14px 28px rgba(0, 0, 0, 0.28);
      background-color: transparent;
    }

    .title {
      margin: 0;
      color: var(--ink);
      font-size: clamp(2rem, 6vw, 3.05rem);
      line-height: 1;
      font-weight: 500;
      letter-spacing: 0.10em;
      text-align: center;
      text-transform: uppercase;
      z-index: 12;
    }

    .welcome {
      margin: 23px 0 34px;
      color: var(--soft-ink);
      font-size: clamp(1rem, 3vw, 1.45rem);
      font-weight: 500;
      letter-spacing: 0.12em;
      text-align: center;
      text-transform: uppercase;
      z-index: 12;
    }

    .entry-form {
      width: 100%;
      display: grid;
      justify-items: center;
      z-index: 12;
    }

    .email-field {
      width: min(100%, 390px);
      height: 58px;
      padding: 0 24px;
      border: 2px solid rgba(54, 39, 24, 0.78);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.30);
      color: var(--ink);
      font-size: clamp(1.05rem, 3vw, 1.35rem);
      text-align: center;
      outline: none;
      box-shadow:
        inset 0 0 10px rgba(0, 0, 0, 0.12),
        0 0 14px rgba(255, 255, 255, 0.18);
    }

    .email-field::placeholder {
      color: rgba(42, 33, 24, 0.68);
    }

    .turnstile-slot {
      width: min(100%, 390px);
      min-height: 70px;
      margin-top: 18px;
      display: none;
      place-items: center;
    }

    .send-button {
      width: min(100%, 320px);
      height: 66px;
      margin-top: 18px;
      border: 2px solid var(--gold-border);
      border-radius: 999px;
      background: linear-gradient(180deg, var(--gold-top), var(--gold-bottom));
      color: #2a1b0b;
      font-size: clamp(1.6rem, 5vw, 2.3rem);
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, 0.45),
        inset 0 -5px 10px rgba(92, 55, 16, 0.28),
        0 10px 18px rgba(0, 0, 0, 0.18);
      cursor: pointer;
    }

    .send-button[disabled] {
      opacity: 0.65;
      cursor: wait;
    }

    .member-strap {
      min-width: min(88vw, 360px);
      min-height: 68px;
      padding: 16px 34px;
      border: 2px solid rgba(54, 39, 24, 0.74);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.28);
      color: var(--ink);
      display: grid;
      place-items: center;
      font-size: clamp(1rem, 3vw, 1.35rem);
      letter-spacing: 0.10em;
      text-align: center;
      text-transform: uppercase;
      text-decoration: none;
      box-shadow:
        0 14px 38px rgba(0, 0, 0, 0.18),
        inset 0 0 16px rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      user-select: none;
      z-index: 3;
    }

    .status {
      min-height: 22px;
      margin-top: 18px;
      color: var(--ink);
      font-size: 0.95rem;
      text-align: center;
      letter-spacing: 0.04em;
    }

    .check-email-overlay {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: grid;
      place-items: center;
      padding: 24px;
      pointer-events: none;
      opacity: 0;
      perspective: 950px;
      transition: opacity 180ms ease;
    }

    .check-email-overlay.is-visible {
      opacity: 1;
      pointer-events: auto;
    }

    .check-email-stage {
      position: relative;
      width: min(90vw, 470px);
      min-height: 300px;
      transform-style: preserve-3d;
      opacity: 0;
      --start-x: 0vw;
      --start-y: -120vh;
      --start-rotate: -8deg;
    }

    .check-email-overlay.is-visible .check-email-stage {
      animation: emailStageFlyIn 760ms cubic-bezier(0.17, 0.88, 0.25, 1.15) forwards;
    }

    .check-email-overlay.from-top .check-email-stage {
      --start-x: 0vw;
      --start-y: -120vh;
      --start-rotate: -6deg;
    }

    .check-email-overlay.from-bottom .check-email-stage {
      --start-x: 0vw;
      --start-y: 120vh;
      --start-rotate: 6deg;
    }

    .check-email-overlay.from-left .check-email-stage {
      --start-x: -120vw;
      --start-y: 0vh;
      --start-rotate: -8deg;
    }

    .check-email-overlay.from-right .check-email-stage {
      --start-x: 120vw;
      --start-y: 0vh;
      --start-rotate: 8deg;
    }

    .check-email-overlay.from-top-left .check-email-stage {
      --start-x: -100vw;
      --start-y: -100vh;
      --start-rotate: -10deg;
    }

    .check-email-overlay.from-top-right .check-email-stage {
      --start-x: 100vw;
      --start-y: -100vh;
      --start-rotate: 10deg;
    }

    .check-email-overlay.from-bottom-left .check-email-stage {
      --start-x: -100vw;
      --start-y: 100vh;
      --start-rotate: 10deg;
    }

    .check-email-overlay.from-bottom-right .check-email-stage {
      --start-x: 100vw;
      --start-y: 100vh;
      --start-rotate: -10deg;
    }

    .check-email-slab {
      position: absolute;
      inset: 0;
      border: 2px solid rgba(214, 242, 232, 0.94);
      border-radius: 28px;
      background:
        radial-gradient(circle at 18% 14%, rgba(210, 255, 255, 0.44), transparent 28%),
        linear-gradient(145deg, rgba(255, 255, 255, 0.56), rgba(255, 255, 255, 0.16)),
        rgba(238, 248, 242, 0.54);
      backdrop-filter: blur(8px) saturate(1.12);
      -webkit-backdrop-filter: blur(8px) saturate(1.12);
      box-shadow:
        0 34px 90px rgba(0, 0, 0, 0.48),
        0 0 34px rgba(210, 255, 255, 0.20),
        inset 0 0 0 1px rgba(255, 255, 255, 0.58),
        inset 0 0 34px rgba(255, 255, 255, 0.24);
      transform:
        translateZ(0)
        rotateX(5deg);
      transform-origin: center center;
    }

    .check-email-slab::before {
      content: "";
      position: absolute;
      inset: 14px;
      border: 1px solid rgba(255, 255, 255, 0.52);
      border-radius: 20px;
      pointer-events: none;
    }

    .check-email-slab::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 58%;
      height: 42%;
      border-radius: 0 26px 0 60px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.58), transparent 68%);
      pointer-events: none;
    }

    .floating-email-words {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: grid;
      place-items: center;
      padding: 36px 30px;
      text-align: center;
      color: var(--ink);
      transform: translateZ(115px);
      transform-style: preserve-3d;
      opacity: 0;
      animation: floatingWordsArrive 520ms ease forwards;
      animation-delay: 520ms;
    }

    .floating-email-inner {
      transform: translateY(-2px);
    }

    .floating-email-words h2 {
      margin: 0 0 18px;
      font-size: clamp(2rem, 7vw, 3.25rem);
      line-height: 0.95;
      font-weight: 600;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      text-shadow:
        0 2px 8px rgba(255, 255, 255, 0.78),
        0 10px 24px rgba(0, 0, 0, 0.28),
        0 0 18px rgba(210, 255, 255, 0.30);
    }

    .floating-email-words p {
      margin: 0;
      color: rgba(42, 33, 24, 0.84);
      font-size: clamp(1rem, 3vw, 1.22rem);
      line-height: 1.45;
      font-weight: 500;
      text-shadow:
        0 1px 5px rgba(255, 255, 255, 0.70),
        0 8px 16px rgba(0, 0, 0, 0.18);
    }

    .floating-email-words p + p {
      margin-top: 10px;
    }

    .check-email-close {
      min-width: 150px;
      height: 48px;
      margin-top: 26px;
      border: 2px solid var(--gold-border);
      border-radius: 999px;
      background: linear-gradient(180deg, var(--gold-top), var(--gold-bottom));
      color: #2a1b0b;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, 0.45),
        inset 0 -4px 8px rgba(92, 55, 16, 0.26),
        0 12px 22px rgba(0, 0, 0, 0.22);
      cursor: pointer;
    }

    .sparkle-glint {
      position: absolute;
      top: 24px;
      right: 32px;
      width: 16px;
      height: 16px;
      z-index: 4;
      transform: translateZ(135px);
      opacity: 0;
      pointer-events: none;
      animation: sparklePop 840ms ease forwards;
      animation-delay: 420ms;
    }

    .sparkle-glint::before,
    .sparkle-glint::after {
      content: "";
      position: absolute;
      inset: 0;
      margin: auto;
      background: rgba(210, 255, 255, 0.90);
      box-shadow: 0 0 18px rgba(210, 255, 255, 0.72);
    }

    .sparkle-glint::before {
      width: 3px;
      height: 16px;
      border-radius: 999px;
    }

    .sparkle-glint::after {
      width: 16px;
      height: 3px;
      border-radius: 999px;
    }

    @keyframes emailStageFlyIn {
      0% {
        opacity: 0;
        transform:
          translate3d(var(--start-x), var(--start-y), -80px)
          scale(0.82)
          rotateX(14deg)
          rotateZ(var(--start-rotate));
        filter: blur(4px);
      }

      70% {
        opacity: 1;
        transform:
          translate3d(0, 0, 20px)
          scale(1.035)
          rotateX(-2deg)
          rotateZ(1deg);
        filter: blur(0);
      }

      100% {
        opacity: 1;
        transform:
          translate3d(0, 0, 0)
          scale(1)
          rotateX(0)
          rotateZ(0);
        filter: blur(0);
      }
    }

    @keyframes floatingWordsArrive {
      0% {
        opacity: 0;
        transform:
          translateZ(60px)
          translateY(18px)
          scale(0.96);
        filter: blur(2px);
      }

      100% {
        opacity: 1;
        transform:
          translateZ(115px)
          translateY(0)
          scale(1);
        filter: blur(0);
      }
    }

    @keyframes sparklePop {
      0% {
        opacity: 0;
        transform: translateZ(135px) scale(0.4) rotate(0deg);
      }

      35% {
        opacity: 1;
        transform: translateZ(135px) scale(1.15) rotate(45deg);
      }

      100% {
        opacity: 0;
        transform: translateZ(135px) scale(0.7) rotate(90deg);
      }
    }

    @media (max-width: 560px) {
      body {
        overflow-y: auto;
        padding: 24px 0;
      }

      .glass-plaque {
        padding: 38px 22px 36px;
      }

      .seal-wrapper {
        width: 140px;
        height: 140px;
      }

      .seal {
        width: 120px;
        height: 120px;
      }

      .check-email-stage {
        min-height: 286px;
      }

      .floating-email-words {
        padding: 34px 24px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .page,
      .check-email-stage,
      .floating-email-words,
      .sparkle-glint {
        animation: none !important;
        transition: none !important;
      }

      body.check-email-open .page {
        transform: none;
        opacity: 0.52;
        filter: none;
      }

      .check-email-overlay.is-visible .check-email-stage,
      .floating-email-words {
        opacity: 1;
        transform: none;
        filter: none;
      }
    }
  </style>
</head>

<body>
  <img
    class="background-photo"
    src="https://pub-081cb3c244be4e09b5e76012567a0b0a.r2.dev/image-4.png"
    alt=""
  />

  <main class="page" id="entryPage" aria-label="CyberCrowd entry window">
    <section class="glass-plaque" aria-labelledby="entry-title">
      <div class="seal-wrapper" aria-hidden="false">
        <div class="seal-ring" aria-hidden="true"></div>
        <img
          class="seal"
          src="https://pub-081cb3c244be4e09b5e76012567a0b0a.r2.dev/1780664884427.png"
          alt="CyberCrowd Seal"
        />
      </div>

      <h1 id="entry-title" class="title">CyberCrowd Entry</h1>
      <div class="welcome">Welcome to CyberCrowd</div>

      <form class="entry-form" id="entryForm">
        <input
          class="email-field"
          id="email"
          name="email"
          type="email"
          placeholder="Enter your email here"
          autocomplete="email"
          required
        />

        <div class="turnstile-slot" id="turnstileSlot"></div>

        <button class="send-button" id="sendButton" type="submit">Send</button>
        <div class="status" id="status" aria-live="polite"></div>
      </form>
    </section>

    <a class="member-strap" href="login.html" aria-label="Already a member">
      Already a Member
    </a>
  </main>

  <div
    class="check-email-overlay"
    id="checkEmailOverlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="checkEmailTitle"
    aria-hidden="true"
  >
    <div class="check-email-stage" id="checkEmailStage">
      <div class="check-email-slab" aria-hidden="true"></div>
      <div class="sparkle-glint" aria-hidden="true"></div>

      <div class="floating-email-words">
        <div class="floating-email-inner">
          <h2 id="checkEmailTitle">Check Your Email</h2>
          <p>CyberCrowd sent your entry link.</p>
          <p>Open your email and press the link to continue.</p>
          <button class="check-email-close" id="checkEmailClose" type="button">Close</button>
        </div>
      </div>
    </div>
  </div>

  <audio id="checkEmailWhoosh" preload="auto">
    <source
      src="https://pub-660d879738134ba990d1708d015ec763.r2.dev/whooshing-email-sent_1.1s%20teaser.mp3"
      type="audio/mpeg"
    />
  </audio>

  <script>
    const form = document.getElementById("entryForm");
    const emailInput = document.getElementById("email");
    const sendButton = document.getElementById("sendButton");
    const statusText = document.getElementById("status");
    const turnstileSlot = document.getElementById("turnstileSlot");
    const checkEmailOverlay = document.getElementById("checkEmailOverlay");
    const checkEmailClose = document.getElementById("checkEmailClose");
    const checkEmailWhoosh = document.getElementById("checkEmailWhoosh");

    let humanToken = "";
    let widgetId = null;
    let gateVisible = false;

    const flyInClasses = [
      "from-top",
      "from-bottom",
      "from-left",
      "from-right",
      "from-top-left",
      "from-top-right",
      "from-bottom-left",
      "from-bottom-right"
    ];

    function isValidEmail(value) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
    }

    function setStatus(text) {
      statusText.textContent = text;
    }

    function lockButton(text) {
      sendButton.disabled = true;
      sendButton.textContent = text;
    }

    function unlockButton() {
      sendButton.disabled = false;
      sendButton.textContent = "Send";
    }

    function playCheckEmailWhoosh() {
      if (!checkEmailWhoosh) return;

      checkEmailWhoosh.volume = 0.28;
      checkEmailWhoosh.currentTime = 0;

      checkEmailWhoosh.play().catch(function () {});
    }

    function showCheckEmailOverlay() {
      const chosenFlyIn = flyInClasses[Math.floor(Math.random() * flyInClasses.length)];

      checkEmailOverlay.classList.remove(
        "from-top",
        "from-bottom",
        "from-left",
        "from-right",
        "from-top-left",
        "from-top-right",
        "from-bottom-left",
        "from-bottom-right",
        "is-visible"
      );

      void checkEmailOverlay.offsetWidth;

      checkEmailOverlay.classList.add(chosenFlyIn);
      checkEmailOverlay.classList.add("is-visible");
      checkEmailOverlay.setAttribute("aria-hidden", "false");
      document.body.classList.add("check-email-open");

      playCheckEmailWhoosh();
    }

    function hideCheckEmailOverlay() {
      checkEmailOverlay.classList.remove("is-visible");
      checkEmailOverlay.setAttribute("aria-hidden", "true");
      document.body.classList.remove("check-email-open");
      emailInput.focus();
    }

    function renderHumanGate() {
      if (!window.turnstile) {
        setStatus("Human gate loading. Press Send again in a moment.");
        unlockButton();
        return;
      }

      turnstileSlot.style.display = "grid";
      gateVisible = true;

      if (widgetId !== null) {
        window.turnstile.remove(widgetId);
        widgetId = null;
      }

      widgetId = window.turnstile.render("#turnstileSlot", {
        sitekey: "0x4AAAAAACvkecVo2F3hpb1r",
        callback: function (token) {  humanToken = token;
         sendButton.disabled = false;
         sendButton.textContent = "Confirm Send";
        setStatus("Human gate passed. Press Confirm Send.");
        },
        "expired-callback": function () {
          humanToken = "";
          setStatus("Human gate expired. Press Send again.");
          unlockButton();
        },
        "error-callback": function () {
          humanToken = "";
          setStatus("Human gate failed. Press Send again.");
          unlockButton();
        }
      });
    }

    async function sendEntry() {
      const email = emailInput.value.trim();

      if (!isValidEmail(email)) {
        setStatus("Please enter a valid email.");
        emailInput.focus();
        unlockButton();
        return;
      }

      if (!humanToken) {
        lockButton("Check");
        setStatus("Complete the human gate.");

        if (!gateVisible) {
          renderHumanGate();
        } else {
          unlockButton();
        }

        return;
      }

      lockButton("Sending");
      setStatus("Preparing your CyberCrowd entry.");

      try {
        const response = await fetch("/api/auth/send-verification", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email: email,
            turnstileToken: humanToken
          })
        });

        const data = await response.json().catch(function () {
          return {};
        });

        if (!response.ok || data.success !== true) {
          throw new Error(data.error || "Entry request failed.");
        }

        sessionStorage.setItem("cybercrowd_entry_email", email);
        showCheckEmailOverlay();

        form.reset();
        humanToken = "";
        gateVisible = false;
        turnstileSlot.style.display = "none";
        setStatus("");

        if (window.turnstile && widgetId !== null) {
          window.turnstile.remove(widgetId);
          widgetId = null;
        }

        unlockButton();
      } catch (error) {
        humanToken = "";

        if (window.turnstile && widgetId !== null) {
          window.turnstile.reset(widgetId);
        }

        setStatus(error.message || "Entry request failed.");
        unlockButton();
      }
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      sendEntry();
    });

    checkEmailClose.addEventListener("click", function () {
      hideCheckEmailOverlay();
    });

    checkEmailOverlay.addEventListener("click", function (event) {
      if (event.target === checkEmailOverlay) {
        hideCheckEmailOverlay();
      }
    });
  </script>
</body>
</html>
