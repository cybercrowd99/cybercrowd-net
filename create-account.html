<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Create Your Account | CyberCrowd</title>

  <script
    src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"
    async
    defer
  ></script>

  <style>
    :root {
      --wall-x: 0px;
      --wall-y: 0px;

      --glass-card: rgba(238, 248, 242, 0.28);
      --glass-edge: rgba(214, 242, 232, 0.78);
      --glass-shine: rgba(255, 255, 255, 0.42);

      --ink: #2a2118;
      --soft-ink: rgba(42, 33, 24, 0.76);

      --gold-top: #e9c979;
      --gold-bottom: #9b7131;
      --gold-border: rgba(82, 53, 20, 0.76);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    .create-account-stage {
      position: relative;
      width: 100%;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      isolation: isolate;
      background: #000;
      padding: 18px;
    }

    .account-back-wall {
      position: absolute;
      inset: -12%;
      z-index: 0;

      background-image:
        url("https://pub-081cb3c244be4e09b5e76012567a0b0a.r2.dev/image-4.png");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      transform:
        translate3d(var(--wall-x), var(--wall-y), 0)
        scale(1.14);

      transition: transform 120ms ease-out;
      will-change: transform;
      pointer-events: none;
    }

    .account-glass-window {
      position: relative;
      z-index: 2;

      width: min(94vw, 641.52px);
      aspect-ratio: 1 / 1.18;

      display: grid;
      place-items: center;

      padding: 38px 34px;

      border-radius: 14px;

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.18),
          rgba(12, 22, 22, 0.27) 42%,
          rgba(4, 8, 8, 0.20)
        );

      border: 1px solid rgba(180, 245, 232, 0.42);

      backdrop-filter:
        blur(4px)
        saturate(120%);

      -webkit-backdrop-filter:
        blur(4px)
        saturate(120%);

      transform:
        perspective(1100px)
        rotateX(2.5deg)
        translateZ(18px);

      transform-style: preserve-3d;

      box-shadow:
        0 34px 90px rgba(0, 0, 0, 0.72),
        0 14px 24px rgba(0, 0, 0, 0.42),
        inset 0 2px 0 rgba(255, 255, 255, 0.24),
        inset 0 -3px 8px rgba(0, 0, 0, 0.58),
        inset 10px 0 18px rgba(255, 255, 255, 0.035),
        inset -12px 0 22px rgba(0, 0, 0, 0.16),
        0 0 24px rgba(160, 255, 235, 0.16);

      overflow: hidden;
    }

    .account-glass-window::before {
      content: "";
      position: absolute;
      inset: 1px;
      z-index: 1;

      border-radius: 13px;
      border: 1px solid rgba(220, 255, 248, 0.12);

      pointer-events: none;
    }

    .account-glass-window::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;

      background:
        radial-gradient(
          circle at 50% 18%,
          rgba(255, 255, 255, 0.08),
          transparent 32%
        ),
        linear-gradient(
          120deg,
          transparent 0%,
          rgba(255, 255, 255, 0.045) 46%,
          transparent 58%
        );

      pointer-events: none;
    }

    #turnstile-one {
      position: absolute;
      inset: 0;
      z-index: 20;

      display: grid;
      place-items: center;

      opacity: 1;
      visibility: visible;

      transition:
        opacity 260ms ease,
        visibility 260ms ease;
    }

    #turnstile-one.is-complete {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .room-content {
      position: relative;
      z-index: 10;

      width: 100%;
      height: 100%;

      display: grid;
      justify-items: center;
      align-content: center;

      opacity: 0;
      visibility: hidden;
      transform: translateY(8px) scale(0.985);

      transition:
        opacity 320ms ease,
        transform 320ms ease,
        visibility 320ms ease;
    }

    .room-content.is-visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }

    .seal-wrapper {
      width: 150px;
      height: 150px;

      position: relative;

      display: grid;
      place-items: center;

      margin-bottom: 18px;

      border-radius: 50%;
    }

    .seal-ring {
      position: absolute;
      inset: 0;

      border-radius: 50%;

      background: rgba(255, 255, 255, 0.04);
      border: 2px solid rgba(255, 255, 255, 0.22);

      backdrop-filter:
        blur(6px)
        saturate(102%);

      -webkit-backdrop-filter:
        blur(6px)
        saturate(102%);

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.45),
        inset 0 0 18px rgba(255, 255, 255, 0.12);

      transform: scale(1.06);

      pointer-events: none;
    }

    .seal {
      position: relative;
      z-index: 2;

      width: 132px;
      height: 132px;

      display: block;
      object-fit: cover;

      border-radius: 50%;

      background: transparent;

      box-shadow:
        inset 0 0 24px rgba(255, 255, 255, 0.24),
        inset 0 0 0 1px rgba(255, 255, 255, 0.42),
        0 14px 28px rgba(0, 0, 0, 0.28);
    }

    .title {
      color: #FFD700;

      font-size:
        clamp(1.7rem, 5vw, 2.8rem);

      line-height: 1.05;
      font-weight: 500;

      letter-spacing: 0.10em;

      text-align: center;
      text-transform: uppercase;
    }

    .welcome {
      margin-top: 14px;
      margin-bottom: 28px;

      color: #FFD700;

      font-size:
        clamp(0.88rem, 2.8vw, 1.22rem);

      font-weight: 500;
      letter-spacing: 0.12em;

      text-align: center;
      text-transform: uppercase;
    }

    .email-entry-shell {
      position: relative;

      width: min(74%, 310px);
      min-height: 58px;

      display: grid;
      place-items: center;

      border: 2px solid rgba(54, 39, 24, 0.72);
      border-radius: 999px;

      background:
        rgba(255, 255, 255, 0.27);

      box-shadow:
        inset 0 0 12px rgba(0, 0, 0, 0.10),
        0 10px 26px rgba(0, 0, 0, 0.13),
        0 0 12px rgba(255, 255, 255, 0.14);

      cursor: text;

      transition:
        width 380ms cubic-bezier(0.2, 0.8, 0.2, 1),
        min-height 380ms cubic-bezier(0.2, 0.8, 0.2, 1),
        border-radius 380ms ease,
        box-shadow 380ms ease,
        transform 380ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .email-entry-shell:not(.is-open) {
      animation:
        email-rest 3.4s ease-in-out infinite;
    }

    .email-entry-shell.is-open {
      width: min(100%, 470px);
      min-height: 92px;

      border-radius: 30px;

      transform:
        translateZ(14px)
        scale(1.02);

      box-shadow:
        inset 0 0 16px rgba(0, 0, 0, 0.13),
        0 18px 38px rgba(0, 0, 0, 0.22),
        0 0 24px rgba(255, 255, 255, 0.20);
    }

    @keyframes email-rest {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-2px);
      }
    }

    .email-invite {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      display: grid;
      place-items: center;

      border: 0;
      border-radius: inherit;

      background: transparent;

      color: #FFD700;

      font: inherit;

      font-size:
        clamp(1rem, 3vw, 1.25rem);

      font-weight: 500;
      letter-spacing: 0.12em;

      text-align: center;
      text-transform: uppercase;

      cursor: text;

      opacity: 1;
      visibility: visible;

      transition:
        opacity 150ms ease,
        visibility 150ms ease;
    }

    .email-entry-shell.is-open .email-invite {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .email-field {
      width: calc(100% - 30px);
      height: 70px;

      padding: 0 24px;

      border: 0;
      border-radius: 22px;

      background:
        rgba(255, 255, 255, 0.16);

      color: var(--ink);

      font-size:
        clamp(1.18rem, 4vw, 1.7rem);

      text-align: center;

      outline: none;
      caret-color: var(--ink);

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      transform: scale(0.96);

      transition:
        opacity 200ms ease 120ms,
        transform 260ms ease 100ms,
        visibility 200ms ease 120ms;
    }

    .email-entry-shell.is-open .email-field {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: scale(1);
    }

    .send-button {
      width: min(78%, 320px);
      height: 62px;

      margin-top: 28px;

      border: 2px solid var(--gold-border);
      border-radius: 999px;

      background:
        linear-gradient(
          180deg,
          var(--gold-top),
          var(--gold-bottom)
        );

      color: #2a1b0b;

      font-size:
        clamp(1.35rem, 4vw, 1.9rem);

      font-weight: 500;
      letter-spacing: 0.12em;

      text-transform: uppercase;

      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, 0.45),
        inset 0 -5px 10px rgba(92, 55, 16, 0.28),
        0 10px 18px rgba(0, 0, 0, 0.18);

      opacity: 0;
      visibility: hidden;

      transform: translateY(8px);

      transition:
        opacity 260ms ease,
        transform 260ms ease,
        visibility 260ms ease;
    }

    .room-content.email-open .send-button {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .send-button[disabled] {
      opacity: 0.62;
      cursor: default;
    }

    .status {
      min-height: 22px;
      margin-top: 14px;

      color: #FFD700;

      font-size: 0.95rem;
      letter-spacing: 0.04em;

      text-align: center;
    }

    @media (max-width: 640px) {
      .create-account-stage {
        padding: 12px;
      }

      .account-glass-window {
        width: min(94vw, 588.06px);
        padding: 28px 20px;
      }

      .seal-wrapper {
        width: 126px;
        height: 126px;
        margin-bottom: 14px;
      }

      .seal {
        width: 110px;
        height: 110px;
      }

      .welcome {
        margin-bottom: 22px;
      }

      .email-entry-shell {
        width: min(82%, 290px);
      }

      .email-entry-shell.is-open {
        width: 100%;
        min-height: 88px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .account-back-wall {
        transition: none;
        transform: scale(1.14);
      }

      .email-entry-shell {
        animation: none;
        transition: none;
      }

      .room-content,
      #turnstile-one,
      .email-field,
      .send-button {
        transition: none;
      }
    }

    @supports not (
      (backdrop-filter: blur(1px)) or
      (-webkit-backdrop-filter: blur(1px))
    ) {
      .account-glass-window {
        background:
          rgba(18, 24, 24, 0.66);
      }
    }
  </style>
</head>

<body>
  <main
    class="create-account-stage"
    aria-label="Create Your Account"
  >
    <div
      class="account-back-wall"
      aria-hidden="true"
    ></div>

    <section
      class="account-glass-window"
      aria-label="Create Your Account glass room"
    >
      <div
        id="turnstile-one"
        aria-label="Human verification"
      ></div>

      <div
        class="room-content"
        id="roomContent"
        aria-hidden="true"
      >
        <div
          class="seal-wrapper"
          aria-hidden="false"
        >
          <div
            class="seal-ring"
            aria-hidden="true"
          ></div>

          <img
            class="seal"
            src="https://pub-081cb3c244be4e09b5e76012567a0b0a.r2.dev/1780664884427.png"
            alt="CyberCrowd Seal"
          />
        </div>

        <h1
          class="title"
          id="create-title"
        >
          Create Your Account
        </h1>

        <div class="welcome">
          Welcome to CyberCrowd
        </div>

        <div
          class="email-entry-shell"
          id="emailEntryShell"
        >
          <button
            class="email-invite"
            id="emailInvite"
            type="button"
            aria-label="Add your email"
          >
            Add Your Email
          </button>

          <input
            class="email-field"
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            autocapitalize="none"
            spellcheck="false"
            aria-label="Email address"
          />
        </div>

        <button
          class="send-button"
          id="sendButton"
          type="button"
          disabled
          aria-disabled="true"
        >
          Send
        </button>

        <div
          class="status"
          id="status"
          aria-live="polite"
        ></div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const root =
        document.documentElement;

      const turnstileMount =
        document.getElementById("turnstile-one");

      const roomContent =
        document.getElementById("roomContent");

      const emailEntryShell =
        document.getElementById("emailEntryShell");

      const emailInvite =
        document.getElementById("emailInvite");

      const emailInput =
        document.getElementById("email");

      const maxShift = 18;

      let roomVisible = false;
      let emailOpen = false;

      function clamp(value, min, max) {
        return Math.max(
          min,
          Math.min(max, value)
        );
      }

      function setWallShift(x, y) {
        root.style.setProperty(
          "--wall-x",
          x + "px"
        );

        root.style.setProperty(
          "--wall-y",
          y + "px"
        );
      }

      function revealRoom() {
        roomVisible = true;

        turnstileMount.classList.add(
          "is-complete"
        );

        roomContent.classList.add(
          "is-visible"
        );

        roomContent.setAttribute(
          "aria-hidden",
          "false"
        );
      }

      function openEmailEntry() {
        if (!roomVisible || emailOpen) {
          return;
        }

        emailOpen = true;

        emailInput.value = "";

        emailEntryShell.classList.add(
          "is-open"
        );

        roomContent.classList.add(
          "email-open"
        );

        window.setTimeout(function () {
          emailInput.focus({
            preventScroll: true
          });
        }, 180);
      }

      function isModifierOnlyKey(key) {
        return (
          key === "Shift" ||
          key === "Control" ||
          key === "Alt" ||
          key === "Meta" ||
          key === "CapsLock" ||
          key === "NumLock" ||
          key === "ScrollLock"
        );
      }

      function handleOpeningKey(event) {
        if (
          !roomVisible ||
          emailOpen ||
          isModifierOnlyKey(event.key)
        ) {
          return;
        }

        if (
          event.ctrlKey ||
          event.metaKey ||
          event.altKey
        ) {
          return;
        }

        event.preventDefault();

        openEmailEntry();
      }

      function renderTurnstileOne() {
        if (!window.turnstile) {
          window.setTimeout(
            renderTurnstileOne,
            50
          );

          return;
        }

        window.turnstile.render(
          "#turnstile-one",
          {
            sitekey:
              "0x4AAAAAACvkecVo2F3hpb1r",

            appearance:
              "always",

            callback:
              function () {
                revealRoom();
              }
          }
        );
      }

      emailInvite.addEventListener(
        "click",
        function () {
          openEmailEntry();
        }
      );

      emailEntryShell.addEventListener(
        "click",
        function () {
          openEmailEntry();
        }
      );

      document.addEventListener(
        "keydown",
        handleOpeningKey
      );

      window.addEventListener(
        "mousemove",
        function (event) {
          const centerX =
            window.innerWidth / 2;

          const centerY =
            window.innerHeight / 2;

          const x =
            (
              (
                event.clientX -
                centerX
              ) /
              centerX
            ) *
            maxShift;

          const y =
            (
              (
                event.clientY -
                centerY
              ) /
              centerY
            ) *
            maxShift;

          setWallShift(x, y);
        }
      );

      window.addEventListener(
        "deviceorientation",
        function (event) {
          const gamma =
            event.gamma || 0;

          const beta =
            event.beta || 0;

          const x =
            clamp(
              gamma * 0.7,
              -maxShift,
              maxShift
            );

          const y =
            clamp(
              beta * 0.25,
              -maxShift,
              maxShift
            );

          setWallShift(x, y);
        }
      );

      renderTurnstileOne();
    })();
  </script>
</body>
</html>
