<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cybercrowd Laptop Surface</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
}

#stage {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
    radial-gradient(circle at center, rgba(0,255,255,0.10), transparent 42%),
    #050505;
}

#panel {
    width: 90%;
    max-width: 560px;
    border-radius: 24px;
    border: 1px solid rgba(0,255,255,0.40);
    background: rgba(10,10,10,0.92);
    padding: 28px;
    text-align: center;
    box-shadow: 0 0 28px rgba(0,255,255,0.18);
}

h1 {
    color: #00ffff;
    letter-spacing: 3px;
}

#status {
    margin-top: 18px;
    color: #00ffaa;
    line-height: 1.6;
}

#cursorProfile {
    margin-top: 14px;
    opacity: 0.78;
    font-size: 13px;
    line-height: 1.5;
}

#heartbeatStatus {
    margin-top: 16px;
    color: #ffff00;
    font-size: 13px;
    opacity: 0.8;
}

#cursorDot {
    position: fixed;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid #00ffff;
    box-shadow: 0 0 16px #00ffff, 0 0 32px #00ffff;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
}

button {
    margin-top: 18px;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 14px;
    background: #00ffff;
    color: black;
    font-weight: bold;
    cursor: pointer;
}

button.stop {
    background: #ff3355;
    color: white;
}
</style>
</head>

<body>

<div id="stage">

<div id="panel">

<h1>
CYBERCROWD LAPTOP SURFACE
</h1>

<div id="status">
Transport online.<br><br>
Phone surface may now control the laptop cursor.
</div>

<div id="cursorProfile">
Cursor profile loading...
</div>

<div id="heartbeatStatus">
Heartbeat: starting...
</div>

<button onclick="armControl()">
ARM CONTROL
</button>

<button class="stop" onclick="disarmControl()">
EMERGENCY STOP
</button>

</div>

</div>

<div id="cursorDot"></div>

<script>
const ws = new WebSocket("ws://" + location.host);

const dot = document.getElementById("cursorDot");
const statusBox = document.getElementById("status");
const cursorProfileBox = document.getElementById("cursorProfile");
const heartbeatBox = document.getElementById("heartbeatStatus");

function armControl() {
    ws.send(JSON.stringify({
        type: "arm-control"
    }));
}

function disarmControl() {
    ws.send(JSON.stringify({
        type: "disarm-control"
    }));
}

function sendHeartbeat() {
    if (ws.readyState === WebSocket.OPEN) {

        ws.send(JSON.stringify({
            type: "heartbeat",
            surfaceId: "laptop"
        }));

        heartbeatBox.innerHTML =
            "Heartbeat: online";
    }
}

setInterval(sendHeartbeat, 4000);

function applyCursorProfile(profileData) {

    if (!profileData || !profileData.profile) {

        cursorProfileBox.innerHTML =
        "Cursor profile unavailable.";

        return;
    }

    const profile =
    profileData.profile;

    cursorProfileBox.innerHTML =
        "Active Cursor: <strong>" +
        profile.label +
        "</strong><br>" +
        profile.description;

    dot.style.clipPath =
    "none";

    dot.style.borderRadius =
    "50%";

    dot.style.width =
    profile.size + "px";

    dot.style.height =
    profile.size + "px";

    dot.style.border =
    "2px solid " +
    profile.border;

    dot.style.background =
    profile.color;

    if (profile.glow) {

        dot.style.boxShadow =
            "0 0 16px " +
            profile.color +
            ", 0 0 34px " +
            profile.color;

    } else {

        dot.style.boxShadow =
        "none";
    }

    if (profile.shape === "triangle") {

        dot.style.width = "0";
        dot.style.height = "0";

        dot.style.borderLeft =
            (profile.size / 2) +
            "px solid transparent";

        dot.style.borderRight =
            (profile.size / 2) +
            "px solid transparent";

        dot.style.borderBottom =
            profile.size +
            "px solid " +
            profile.color;

        dot.style.background =
        "transparent";

        dot.style.borderRadius =
        "0";
    }

    if (profile.shape === "arrow") {

        dot.style.borderRadius =
        "0";

        dot.style.width =
        profile.size + "px";

        dot.style.height =
        profile.size + "px";

        dot.style.background =
        profile.color;

        dot.style.clipPath =
        "polygon(0 0, 100% 45%, 58% 58%, 45% 100%, 30% 92%, 43% 55%, 0 70%)";
    }
}

fetch("/api/cursor-profile")
.then(response => response.json())
.then(data => {

    if (data.success) {

        applyCursorProfile(
            data.profile
        );
    }
})
.catch(() => {

    cursorProfileBox.innerHTML =
    "Cursor profile failed to load.";
});

ws.onmessage = (event) => {

    const data =
    JSON.parse(event.data);

    if (data.type === "move") {

        dot.style.left =
            (data.x * window.innerWidth) +
            "px";

        dot.style.top =
            (data.y * window.innerHeight) +
            "px";
    }

    if (data.type === "click") {

        dot.style.transform =
        "translate(-50%, -50%) scale(1.8)";

        setTimeout(() => {

            dot.style.transform =
            "translate(-50%, -50%) scale(1)";

        }, 120);
    }

    if (data.type === "bridge-status") {

        statusBox.innerHTML =
        data.message;
    }
};

ws.onopen = () => {

    heartbeatBox.innerHTML =
    "Heartbeat: connected";

    sendHeartbeat();
};

ws.onclose = () => {

    heartbeatBox.innerHTML =
    "Heartbeat: disconnected";
};
</script>

</body>
</html>
