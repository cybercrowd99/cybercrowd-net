<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>CyberCrowd Turnstile 3</title>

  <!-- Organ 2 Stylesheets -->
  <link
    rel="stylesheet"
    href="/cybercrowd-turnstile/organ-2-hud-style/tokens.css"
  />

  <link
    rel="stylesheet"
    href="/cybercrowd-turnstile/organ-2-hud-style/layout.css"
  />

  <link
    rel="stylesheet"
    href="/cybercrowd-turnstile/organ-2-hud-style/hud-panel.css"
  />

  <link
    rel="stylesheet"
    href="/cybercrowd-turnstile/organ-2-hud-style/animations.css"
  />
</head>

<body>

  <div class="ambient-grid"></div>

  <!-- Trigger Button -->
  <button
    class="hud-btn"
    id="btn-members-only"
    style="width: auto; padding: 16px 36px;"
  >
    Members Only
  </button>

  <!-- Turnstile 3 Overlay -->
  <div
    class="turnstile-overlay"
    id="turnstile-overlay"
  >

    <div class="hud-panel">

      <div
        style="
          border-bottom: 1px solid var(--cc-border);
          padding-bottom: 10px;
          margin-bottom: 16px;
        "
      >
        <span
          style="
            font-size: 0.8rem;
            color: var(--cc-cyan);
            letter-spacing: 2px;
          "
        >
          TURNSTILE WIDGET 3.0
        </span>
      </div>

      <!--
      ORGAN 3 STAGE SLOT

      The ViewRouter purges and mounts
      exactly one isolated stepping stone
      inside this location.
      -->
      <div id="hud-view-slot"></div>

    </div>

  </div>

  <!-- Organ 4 Entry Point -->
  <script
    type="module"
    src="/cybercrowd-turnstile/organ-4-orchestrator/app.js"
  ></script>

</body>
</html>
