<!DOCTYPE html>
<!--
  NET FILE: pixelprix-game.html
  CyberCrowd | PixelPrix Camera Game
  Purpose: Runs the PixelPrix treasure camera game flow.
  Owns: Male/Female robot choice, parent song toggle, song start, treasure snaps, naming pause, cleanup replay, zoom, back, finish.
  Does NOT own: PixelPrix poster landing, treasure pre-counting, uploads, sync, accounts, provider transport, PING, NET, CORE.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>PixelPrix | Camera Game</title>

  <style>
    :root {
      --ink: #fff7df;
      --gold: #ffd34d;
      --green: #6dff91;
      --blue: #7bd4ff;
      --purple: #c79cff;
      --pink: #ff8bd1;
      --shadow: rgba(0, 0, 0, 0.62);
      --line: rgba(255, 255, 255, 0.24);
      --pxp-vh: 100svh;
      --android-bottom-safe: 54px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-width: 320px;
      height: 100%;
      min-height: 100svh;
      margin: 0;
      color: var(--ink);
      background: #05060a;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    body {
      position: relative;
      height: var(--pxp-vh);
      min-height: var(--pxp-vh);
      max-height: var(--pxp-vh);
    }

    .camera {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .camera.live video {
      display: block;
    }

    .still {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        linear-gradient(to bottom, rgba(5, 6, 10, 0.18), rgba(5, 6, 10, 0.72)),
        url("https://pub-081cb3c244be4e09b5e76012567a0b0a.r2.dev/PixelPrix.png")
        center / cover
        no-repeat,
        #05060a;
      background-size: cover;
      background-position: center;
      opacity: 1;
    }

    .camera.live + .still {
      opacity: 0;
    }

    .shade {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(to bottom, rgba(0, 0, 0, 0.36), transparent 28%, rgba(0, 0, 0, 0.86)),
        radial-gradient(circle at center, transparent 22%, rgba(0, 0, 0, 0.28));
    }

    .camera-touch {
      position: fixed;
      inset: 0;
      z-index: 3;
      display: none;
      place-items: center;
      padding: 18px;
      pointer-events: none;
    }

    .camera-touch.show {
      display: grid;
      pointer-events: none;
    }

    .camera-touch-bubble {
      max-width: min(520px, 92vw);
      padding: 16px 20px;
      border-radius: 28px;
      color: #050505;
      background: rgba(255, 211, 77, 0.94);
      border: 3px solid rgba(255, 255, 255, 0.65);
      box-shadow:
        0 10px 0 var(--shadow),
        0 0 34px rgba(255, 211, 77, 0.35);
      font-size: clamp(1.1rem, 5vw, 2rem);
      font-weight: 900;
      text-align: center;
      transform: scale(1);
      transition: transform 160ms ease;
      user-select: none;
    }

    .camera-touch.tap .camera-touch-bubble {
      transform: scale(1.08);
    }

    .page {
      position: relative;
      z-index: 2;
      width: min(900px, 100%);
      height: var(--pxp-vh);
      min-height: var(--pxp-vh);
      max-height: var(--pxp-vh);
      margin: 0 auto;
      padding:
        max(7px, env(safe-area-inset-top))
        9px
        max(var(--android-bottom-safe), env(safe-area-inset-bottom));
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 6px;
      overflow: hidden;
    }

    .top {
      display: flex;
      justify-content: space-between;
      gap: 7px;
      align-items: center;
      min-height: 36px;
      flex-shrink: 0;
    }

    .top a {
      display: grid;
      place-items: center;
      min-height: 34px;
      padding: 6px 10px;
      border-radius: 999px;
      color: #050505;
      background: var(--gold);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 900;
      box-shadow: 0 4px 0 var(--shadow);
      white-space: nowrap;
      touch-action: manipulation;
    }

    .top a.home {
      background: var(--green);
    }

    .stage {
      min-height: 0;
      display: grid;
      align-content: end;
      gap: 6px;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: none;
      padding-bottom: 2px;
    }

    .stage::-webkit-scrollbar {
      display: none;
    }

    .panel {
      max-height: 100%;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 11px;
      border-radius: 24px;
      background: rgba(5, 6, 10, 0.74);
      border: 2px solid var(--line);
      box-shadow: 0 18px 45px var(--shadow);
      backdrop-filter: blur(7px);
      scrollbar-width: none;
    }

    .panel::-webkit-scrollbar {
      display: none;
    }

    h1 {
      margin: 0 0 5px;
      color: var(--gold);
      font-size: clamp(1.7rem, 8.2vw, 4.8rem);
      line-height: 0.9;
      letter-spacing: 0.04em;
      text-shadow: 0 4px 0 #000;
    }

    p {
      margin: 0;
      color: var(--ink);
      font-size: clamp(0.9rem, 3.55vw, 1.28rem);
      line-height: 1.16;
      font-weight: 900;
      text-shadow: 0 3px 0 #000;
    }

    .small {
      margin-top: 5px;
      color: rgba(255, 247, 223, 0.86);
      font-size: clamp(0.78rem, 3.1vw, 0.98rem);
    }

    .setup-area {
      display: none;
      gap: 8px;
      margin-top: 9px;
    }

    .setup-area.show {
      display: grid;
    }

    .voice-choice {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .choice-button {
      min-height: 58px;
      border-radius: 18px;
      padding: 8px;
      color: #050505;
      font: inherit;
      font-size: clamp(0.95rem, 4vw, 1.25rem);
      font-weight: 900;
      box-shadow: 0 5px 0 var(--shadow);
    }

    .choice-button.male {
      background: var(--blue);
    }

    .choice-button.female {
      background: var(--purple);
    }

    .parent-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .parent-label {
      color: rgba(255, 247, 223, 0.9);
      font-size: 0.86rem;
      font-weight: 900;
      text-shadow: 0 2px 0 #000;
    }

    .song-toggle {
      width: auto;
      min-height: 38px;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--gold);
      font-size: 0.86rem;
      box-shadow: 0 4px 0 var(--shadow);
      white-space: nowrap;
    }

    .song-toggle.off {
      background: rgba(255, 255, 255, 0.72);
    }

    .progress {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 5px;
      margin-top: 7px;
    }

    .dot {
      min-height: 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.22);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14);
    }

    .dot.done {
      background: var(--green);
    }

    .dot.now {
      background: var(--gold);
    }

    .thumbs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      margin-top: 6px;
    }

    .thumb {
      aspect-ratio: 1 / 1;
      border-radius: 11px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.13);
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: grid;
      place-items: center;
      color: rgba(255, 247, 223, 0.7);
      font-size: 0.76rem;
      font-weight: 900;
      touch-action: manipulation;
    }

    .thumb.has-pic {
      cursor: pointer;
      border-color: rgba(255, 211, 77, 0.7);
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .compare {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-top: 8px;
    }

    .compare.show {
      display: grid;
    }

    .compare-card {
      min-height: 90px;
      border-radius: 18px;
      overflow: hidden;
      border: 2px solid var(--line);
      background: rgba(255, 255, 255, 0.08);
      display: grid;
      place-items: center;
      color: rgba(255, 247, 223, 0.8);
      font-weight: 900;
      text-align: center;
      touch-action: manipulation;
    }

    .compare-card.has-pic {
      cursor: pointer;
      border-color: rgba(255, 211, 77, 0.7);
    }

    .compare-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .finish-row {
      display: none;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-top: 8px;
    }

    .finish-row.show {
      display: grid;
    }

    .finish-button {
      min-height: 52px;
      border-radius: 18px;
      padding: 8px;
      font-size: clamp(0.82rem, 3.5vw, 1.05rem);
      box-shadow: 0 5px 0 var(--shadow);
    }

    .finish-button.yes {
      background: linear-gradient(135deg, var(--green), #dbff73);
    }

    .finish-button.again {
      background: linear-gradient(135deg, var(--gold), #fff1a3);
    }

    .finish-button.home {
      background: linear-gradient(135deg, var(--blue), #d8f4ff);
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 7px;
      flex-shrink: 0;
      padding-bottom: 0;
    }

    .button-row.two {
      grid-template-columns: 1fr 0.52fr;
    }

    button {
      width: 100%;
      min-height: 54px;
      border: 0;
      border-radius: 22px;
      padding: 10px 14px;
      color: #050505;
      background: linear-gradient(135deg, var(--green), #dbff73);
      font: inherit;
      font-size: clamp(1.05rem, 4.8vw, 2.35rem);
      font-weight: 900;
      cursor: pointer;
      text-align: center;
      display: grid;
      place-items: center;
      box-shadow: 0 7px 0 var(--shadow);
      touch-action: manipulation;
    }

    .done-button {
      display: none;
      background: linear-gradient(135deg, var(--pink), var(--gold));
    }

    .done-button.show {
      display: grid;
    }

    button:active,
    .top a:active {
      transform: translateY(4px);
      box-shadow: 0 3px 0 var(--shadow);
    }

    .zoom-viewer {
      position: fixed;
      inset: 0;
      z-index: 99;
      display: none;
      place-items: center;
      padding: 18px;
      background: rgba(0, 0, 0, 0.92);
    }

    .zoom-viewer.show {
      display: grid;
    }

    .zoom-viewer img {
      max-width: 100%;
      max-height: 86svh;
      border-radius: 22px;
      border: 3px solid var(--gold);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
      object-fit: contain;
    }

    .zoom-close {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      right: 12px;
      z-index: 100;
      width: auto;
      min-height: 44px;
      padding: 9px 14px;
      border-radius: 999px;
      background: var(--gold);
      color: #050505;
      font-size: 1rem;
      box-shadow: 0 5px 0 var(--shadow);
    }

    .hidden {
      display: none !important;
    }

    canvas {
      display: none;
    }

    @media (max-height: 700px) {
      :root {
        --android-bottom-safe: 58px;
      }

      .page {
        gap: 5px;
        padding:
          max(5px, env(safe-area-inset-top))
          8px
          max(var(--android-bottom-safe), env(safe-area-inset-bottom));
      }

      .top {
        min-height: 32px;
      }

      .top a {
        min-height: 31px;
        padding: 5px 9px;
        font-size: 0.75rem;
      }

      .panel {
        padding: 9px;
        border-radius: 21px;
      }

      h1 {
        font-size: clamp(1.45rem, 7.1vw, 3.7rem);
        margin-bottom: 4px;
      }

      p {
        font-size: clamp(0.82rem, 3.25vw, 1.05rem);
        line-height: 1.12;
      }

      .small {
        margin-top: 4px;
        font-size: clamp(0.72rem, 2.9vw, 0.88rem);
      }

      .compare-card {
        min-height: 78px;
      }

      button {
        min-height: 48px;
        border-radius: 20px;
        padding: 8px 12px;
        font-size: clamp(0.95rem, 4.1vw, 1.95rem);
      }
    }
  </style>
</head>

<body>
  <div class="camera" id="camera-shell">
    <video id="camera-video" autoplay playsinline muted></video>
  </div>

  <div class="still" id="still"></div>
  <div class="shade"></div>

  <div class="camera-touch" id="camera-touch" aria-hidden="true">
    <div class="camera-touch-bubble" id="camera-touch-bubble">
      Tap the screen when you see it.
    </div>
  </div>

  <main class="page">
    <header class="top">
      <a href="pixelprix.html" id="back-game">← BACK</a>
      <a class="home" href="https://cybercrowd.net/">CyberCrowd 🏠</a>
    </header>

    <section class="stage">
      <div class="panel">
        <h1 id="title">PixelPrix</h1>

        <p id="prompt">
          Choose your robot.
        </p>

        <p class="small" id="helper">
          Tap Male or Female to start.
        </p>

        <div class="setup-area" id="voice-choice">
          <div class="voice-choice">
            <button class="choice-button male" id="voice-male" type="button">
              🤖 Male
            </button>

            <button class="choice-button female" id="voice-female" type="button">
              🤖 Female
            </button>
          </div>

          <div class="parent-row">
            <div class="parent-label">
              Parent song setting
            </div>

            <button class="song-toggle" id="song-toggle" type="button">
              Song ON 🎵
            </button>
          </div>
        </div>

        <div class="progress" id="progress"></div>

        <div class="thumbs" id="thumbs"></div>

        <div class="compare" id="compare">
          <div class="compare-card" id="before-card">Before</div>
          <div class="compare-card" id="after-card">After</div>
        </div>

        <div class="finish-row" id="finish-row">
          <button class="finish-button yes" id="like-yes" type="button">
            YES 😄
          </button>

          <button class="finish-button again" id="like-again" type="button">
            PLAY AGAIN
          </button>

          <button class="finish-button home" id="like-home" type="button">
            GO HOME
          </button>
        </div>
      </div>
    </section>

    <section class="button-row" id="button-row">
      <button id="main-button" type="button">
        START
      </button>

      <button class="done-button" id="done-button" type="button">
        DONE ✔️
      </button>
    </section>
  </main>

  <canvas id="capture-canvas"></canvas>

  <div class="zoom-viewer" id="zoom-viewer" aria-hidden="true">
    <button class="zoom-close" id="zoom-close" type="button">CLOSE</button>
    <img id="zoom-image" alt="Enlarged PixelPrix picture" />
  </div>

  <audio id="pixelprix-song" preload="auto" loop>
    <source src="audio/pixelprix-song.mp3" type="audio/mpeg" />
    <source src="pixelprix-song.mp3" type="audio/mpeg" />
  </audio>

  <script>
    (function () {
      "use strict";

      const SONG_KEY = "pixelprixSongEnabled";

      function setRealViewportHeight() {
        document.documentElement.style.setProperty("--pxp-vh", window.innerHeight + "px");
      }

      setRealViewportHeight();

      window.addEventListener("resize", setRealViewportHeight);
      window.addEventListener("orientationchange", function () {
        setTimeout(setRealViewportHeight, 250);
      });

      const state = {
        phase: "voice-choice",
        robotVoice: "female",
        songEnabled: true,
        songStarted: false,
        stream: null,
        cleanPic: "",
        items: [],
        cleanupIndex: 0,
        phaseHistory: [],
        namingTreasureNumber: 0
      };

      const el = {
        cameraShell: document.getElementById("camera-shell"),
        video: document.getElementById("camera-video"),
        canvas: document.getElementById("capture-canvas"),
        still: document.getElementById("still"),
        title: document.getElementById("title"),
        prompt: document.getElementById("prompt"),
        helper: document.getElementById("helper"),
        voiceChoice: document.getElementById("voice-choice"),
        voiceMale: document.getElementById("voice-male"),
        voiceFemale: document.getElementById("voice-female"),
        songToggle: document.getElementById("song-toggle"),
        song: document.getElementById("pixelprix-song"),
        progress: document.getElementById("progress"),
        thumbs: document.getElementById("thumbs"),
        compare: document.getElementById("compare"),
        beforeCard: document.getElementById("before-card"),
        afterCard: document.getElementById("after-card"),
        finishRow: document.getElementById("finish-row"),
        likeYes: document.getElementById("like-yes"),
        likeAgain: document.getElementById("like-again"),
        likeHome: document.getElementById("like-home"),
        buttonRow: document.getElementById("button-row"),
        mainButton: document.getElementById("main-button"),
        doneButton: document.getElementById("done-button"),
        backGame: document.getElementById("back-game"),
        cameraTouch: document.getElementById("camera-touch"),
        cameraTouchBubble: document.getElementById("camera-touch-bubble"),
        zoomViewer: document.getElementById("zoom-viewer"),
        zoomImage: document.getElementById("zoom-image"),
        zoomClose: document.getElementById("zoom-close")
      };

      function saveRobotVoice(mode) {
        state.robotVoice = mode === "male" ? "male" : "female";

        try {
          localStorage.setItem("pixelprixRobotVoice", state.robotVoice);
          localStorage.setItem("pixelprixGuide", "robot");
        } catch (error) {}
      }

      function loadRobotVoice() {
        try {
          const saved = localStorage.getItem("pixelprixRobotVoice") || "female";
          state.robotVoice = saved === "male" ? "male" : "female";
        } catch (error) {
          state.robotVoice = "female";
        }
      }

      function loadSongSetting() {
        try {
          const saved = localStorage.getItem(SONG_KEY);
          state.songEnabled = saved === null ? true : saved === "true";
        } catch (error) {
          state.songEnabled = true;
        }

        renderSongToggle();
      }

      function saveSongSetting() {
        try {
          localStorage.setItem(SONG_KEY, String(state.songEnabled));
        } catch (error) {}
      }

      function renderSongToggle() {
        el.songToggle.textContent = state.songEnabled ? "Song ON 🎵" : "Song OFF";
        el.songToggle.classList.toggle("off", !state.songEnabled);
      }

      function toggleSong() {
        state.songEnabled = !state.songEnabled;
        saveSongSetting();
        renderSongToggle();

        if (!state.songEnabled) {
          stopSong();
        }
      }

      function startSong() {
        if (!state.songEnabled || state.songStarted || !el.song) {
          return;
        }

        try {
          el.song.volume = 0.42;
          const playAttempt = el.song.play();

          if (playAttempt && typeof playAttempt.catch === "function") {
            playAttempt.catch(function () {});
          }

          state.songStarted = true;
        } catch (error) {}
      }

      function stopSong() {
        if (!el.song) {
          return;
        }

        try {
          el.song.pause();
          el.song.currentTime = 0;
          state.songStarted = false;
        } catch (error) {}
      }

      function speak(text) {
        try {
          if (!("speechSynthesis" in window)) {
            return;
          }

          window.speechSynthesis.cancel();

          const voice = new SpeechSynthesisUtterance(text);
          voice.rate = 0.9;
          voice.pitch = state.robotVoice === "male" ? 0.82 : 1.14;

          window.speechSynthesis.speak(voice);
        } catch (error) {}
      }

      function beep() {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;

          if (!AudioContext) {
            return;
          }

          const ctx = new AudioContext();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = "square";
          osc.frequency.value = 720;
          gain.gain.value = 0.035;

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();

          setTimeout(function () {
            osc.stop();
            ctx.close();
          }, 90);
        } catch (error) {}
      }

      async function openCamera() {
        stopCamera();

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          el.helper.textContent = "Camera needs a browser with camera permission.";
          speak("Camera permission is needed.");
          return false;
        }

        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
              facingMode: { ideal: "environment" },
              width: { ideal: 1280 },
              height: { ideal: 720 }
            }
          });

          state.stream = stream;
          el.video.srcObject = stream;
          el.cameraShell.classList.add("live");
          setRealViewportHeight();
          return true;
        } catch (error) {
          el.helper.textContent = "Camera permission needed. Turn camera permission on, then try again.";
          speak("Camera permission needed.");
          setRealViewportHeight();
          return false;
        }
      }

      function stopCamera() {
        if (state.stream) {
          state.stream.getTracks().forEach(function (track) {
            track.stop();
          });
        }

        state.stream = null;
        el.video.srcObject = null;
        el.cameraShell.classList.remove("live");
      }

      function capturePic() {
        const width = el.video.videoWidth || 1280;
        const height = el.video.videoHeight || 720;

        el.canvas.width = width;
        el.canvas.height = height;

        const ctx = el.canvas.getContext("2d");
        ctx.drawImage(el.video, 0, 0, width, height);

        return el.canvas.toDataURL("image/jpeg", 0.86);
      }

      function setStill(pic) {
        if (!pic) {
          el.still.style.backgroundImage =
            'linear-gradient(to bottom, rgba(5, 6, 10, 0.18), rgba(5, 6, 10, 0.72)), url("https://pub-081cb3c244be4e09b5e76012567a0b0a.r2.dev/PixelPrix.png") center / cover no-repeat, #05060a';
          return;
        }

        el.still.style.backgroundImage = "url('" + pic + "')";
      }

      function imageHtml(pic, alt) {
        return '<img src="' + pic + '" alt="' + alt + '" />';
      }

      function isCameraPhase() {
        return state.phase === "items" || state.phase === "after";
      }

      function showCameraTouch(text) {
        if (!isCameraPhase()) {
          hideCameraTouch();
          return;
        }

        el.cameraTouchBubble.textContent = text || "Tap the screen when you see it.";
        el.cameraTouch.classList.add("show");
        el.cameraTouch.setAttribute("aria-hidden", "false");
      }

      function hideCameraTouch() {
        el.cameraTouch.classList.remove("show", "tap");
        el.cameraTouch.setAttribute("aria-hidden", "true");
      }

      function openZoom(pic) {
        if (!pic) {
          return;
        }

        el.zoomImage.src = pic;
        el.zoomViewer.classList.add("show");
        el.zoomViewer.setAttribute("aria-hidden", "false");
      }

      function closeZoom() {
        el.zoomViewer.classList.remove("show");
        el.zoomViewer.setAttribute("aria-hidden", "true");
        el.zoomImage.removeAttribute("src");
      }

      function clearCompareClicks() {
        el.beforeCard.onclick = null;
        el.afterCard.onclick = null;
        el.beforeCard.classList.remove("has-pic");
        el.afterCard.classList.remove("has-pic");
      }

      function hideSetup() {
        el.voiceChoice.classList.remove("show");
      }

      function hideFinish() {
        el.finishRow.classList.remove("show");
      }

      function showFinish() {
        el.finishRow.classList.add("show");
      }

      function renderDots() {
        el.progress.innerHTML = "";

        const count = Math.min(Math.max(state.items.length + 1, 1), 12);
        el.progress.style.gridTemplateColumns = "repeat(" + count + ", 1fr)";

        for (let i = 0; i < count; i += 1) {
          const dot = document.createElement("div");
          dot.className = "dot";

          if (i < state.items.length) {
            dot.classList.add("done");
          }

          if (state.phase === "items" && i === state.items.length) {
            dot.classList.add("now");
          }

          if (state.phase === "cleanup") {
            if (i < state.cleanupIndex) {
              dot.classList.add("done");
            } else if (i === state.cleanupIndex) {
              dot.classList.add("now");
            }
          }

          el.progress.appendChild(dot);
        }
      }

      function renderThumbs() {
        el.thumbs.innerHTML = "";

        if (!state.items.length) {
          return;
        }

        const visibleItems = state.items.slice(-8);
        const columnCount = Math.min(visibleItems.length, 4);
        el.thumbs.style.gridTemplateColumns = "repeat(" + columnCount + ", 1fr)";

        visibleItems.forEach(function (item) {
          const box = document.createElement("div");
          box.className = "thumb has-pic";
          box.innerHTML = imageHtml(item.pic, "Treasure " + item.number);

          box.addEventListener("click", function () {
            openZoom(item.pic);
          });

          el.thumbs.appendChild(box);
        });
      }

      function setButton(mainText) {
        el.mainButton.textContent = mainText;
        setTimeout(setRealViewportHeight, 60);
      }

      function showDoneButton(show) {
        el.doneButton.classList.toggle("show", show);
        el.buttonRow.classList.toggle("two", show);
      }

      function setPhase(phase, options) {
        options = options || {};

        if (!options.skipHistory && state.phase && state.phase !== phase) {
          state.phaseHistory.push(state.phase);
        }

        state.phase = phase;

        hideSetup();
        hideFinish();
        hideCameraTouch();
        showDoneButton(false);
        clearCompareClicks();
        el.compare.classList.remove("show");

        if (phase === "voice-choice") {
          stopCamera();
          setStill("");
          el.title.textContent = "PixelPrix";
          el.prompt.textContent = "Choose your robot.";
          el.helper.textContent = "Tap Male or Female to start your treasure adventure.";
          el.voiceChoice.classList.add("show");
          setButton("CHOOSE ROBOT");
        }

        if (phase === "intro") {
          stopCamera();
          setStill("");
          el.title.textContent = "PixelPrix";
          el.prompt.textContent = "Start your treasure adventure.";
          el.helper.textContent = "Take pictures until you are done. Then tap DONE.";
          setButton("OPEN CAMERA");
        }

        if (phase === "items") {
          el.title.textContent = "Treasure " + (state.items.length + 1);
          el.prompt.textContent = "Take your treasure picture.";
          el.helper.textContent = "Snap one treasure. When you have enough treasures, tap DONE.";
          showCameraTouch("Tap the screen when you see the treasure.");
          showDoneButton(state.items.length > 0);
          setButton("TAKE SNAP 📸");
        }

        if (phase === "name-treasure") {
          stopCamera();
          const item = state.items[state.items.length - 1];

          if (item && item.pic) {
            setStill(item.pic);
          }

          state.namingTreasureNumber = item ? item.number : state.items.length;
          el.title.textContent = "Treasure " + state.namingTreasureNumber;
          el.prompt.textContent = "Okay, what is it?";
          el.helper.textContent = "Say the word. The game saves the voice replay for cleanup.";
          setButton("RECORD NAME");
        }

        if (phase === "ready") {
          stopCamera();
          setStill(state.items[0] ? state.items[0].pic : "");
          el.title.textContent = "Game Ready";
          el.prompt.textContent = "Your treasures are ready.";
          el.helper.textContent = "Now cleanup can play back each treasure voice.";
          setButton("PLAY CLEAN UP");
        }

        if (phase === "cleanup") {
          stopCamera();

          const item = state.items[state.cleanupIndex];

          if (item && item.pic) {
            setStill(item.pic);
          }

          el.title.textContent = "Find It";
          el.prompt.textContent = "Go find treasure " + (state.cleanupIndex + 1) + ".";
          el.helper.textContent = "Listen for the saved voice replay. When it is picked up, tap FOUND IT.";
          setButton("FOUND IT");

          window.setTimeout(function () {
            if (window.PixelPrixVoice && window.PixelPrixVoice.cueFind) {
              window.PixelPrixVoice.cueFind(state.cleanupIndex + 1);
            } else {
              speak("Go find treasure " + (state.cleanupIndex + 1) + ".");
            }
          }, 250);
        }

        if (phase === "after-ready") {
          stopCamera();
          setStill(state.items[state.items.length - 1] ? state.items[state.items.length - 1].pic : "");
          el.title.textContent = "Finish Picture";
          el.prompt.textContent = "Want one clean picture at the end?";
          el.helper.textContent = "This is optional. Take one final picture or finish now.";
          showDoneButton(true);
          setButton("OPEN CAMERA");
        }

        if (phase === "after") {
          el.title.textContent = "Clean Picture";
          el.prompt.textContent = "Take the clean or treat-ready picture.";
          el.helper.textContent = "Tap the screen when the clean picture is ready. Then press TAKE CLEAN PIC.";
          showCameraTouch("Tap the screen when the clean picture is ready.");
          setButton("TAKE CLEAN PIC");
        }

        if (phase === "difference") {
          stopCamera();
          setStill(state.cleanPic);
          el.title.textContent = "Spot the Difference";
          el.prompt.textContent = "Look what changed.";
          el.helper.textContent = "Tap Before or After to make it bigger.";

          const beforePic = state.items[0] ? state.items[0].pic : "";
          const afterPic = state.cleanPic;

          el.compare.classList.add("show");

          if (beforePic) {
            el.beforeCard.classList.add("has-pic");
            el.beforeCard.innerHTML = imageHtml(beforePic, "First treasure");
            el.beforeCard.onclick = function () {
              openZoom(beforePic);
            };
          } else {
            el.beforeCard.textContent = "Before";
          }

          if (afterPic) {
            el.afterCard.classList.add("has-pic");
            el.afterCard.innerHTML = imageHtml(afterPic, "After room");
            el.afterCard.onclick = function () {
              openZoom(afterPic);
            };
          } else {
            el.afterCard.textContent = "After";
          }

          setButton("I SEE IT");
        }

        if (phase === "done") {
          stopCamera();
          setStill(state.cleanPic || (state.items[0] ? state.items[0].pic : ""));
          el.title.textContent = "Adventure Done";
          el.prompt.textContent = "You made a treasure story.";
          el.helper.textContent = "Pictures, voice names, cleanup, and finish.";
          setButton("SHOW FINISH");
        }

        if (phase === "finish") {
          stopCamera();
          setStill(state.cleanPic || (state.items[0] ? state.items[0].pic : ""));
          el.title.textContent = "PixelPrix Complete";
          el.prompt.textContent = "Did you like this?";
          el.helper.textContent = "Choose what happens next.";
          showFinish();
          setButton("PLAY AGAIN");
        }

        renderDots();
        renderThumbs();
        setRealViewportHeight();
      }

      function chooseVoice(mode) {
        saveRobotVoice(mode);
        startSong();
        speak(mode === "male" ? "Male robot selected. Start your treasure adventure." : "Female robot selected. Start your treasure adventure.");
        setPhase("intro");
      }

      function finishNamingAndContinue() {
        openCamera().then(function (ok) {
          if (ok) {
            setPhase("items");
            speak("Treasure " + (state.items.length + 1) + ".");
          }
        });
      }

      function askTreasureName() {
        const treasureNumber = state.namingTreasureNumber || state.items.length;

        if (window.PixelPrixVoice && window.PixelPrixVoice.ask) {
          window.PixelPrixVoice.ask(treasureNumber, finishNamingAndContinue);
          return;
        }

        finishNamingAndContinue();
      }

      async function mainAction() {
        if (state.phase === "voice-choice") {
          return;
        }

        if (state.phase === "intro") {
          const ok = await openCamera();

          if (ok) {
            setPhase("items");
            speak("Take your first treasure picture.");
          }

          return;
        }

        if (state.phase === "items") {
          const pic = capturePic();
          const number = state.items.length + 1;

          state.items.push({
            number: number,
            pic: pic,
            done: false
          });

          beep();
          setPhase("name-treasure");
          speak("Okay, what is it?");
          return;
        }

        if (state.phase === "name-treasure") {
          askTreasureName();
          return;
        }

        if (state.phase === "ready") {
          state.cleanupIndex = 0;
          setPhase("cleanup");
          return;
        }

        if (state.phase === "cleanup") {
          state.cleanupIndex += 1;
          beep();

          if (state.cleanupIndex >= state.items.length) {
            speak("Clean up done.");
            setPhase("after-ready");
            return;
          }

          setPhase("cleanup");
          return;
        }

        if (state.phase === "after-ready") {
          const ok = await openCamera();

          if (ok) {
            setPhase("after");
            speak("Take the clean picture.");
          }

          return;
        }

        if (state.phase === "after") {
          state.cleanPic = capturePic();
          beep();
          speak("Clean picture ready.");
          setPhase("difference");
          return;
        }

        if (state.phase === "difference") {
          speak("Great job. Adventure done.");
          setPhase("done");
          return;
        }

        if (state.phase === "done") {
          speak("Did you like this?");
          setPhase("finish");
          return;
        }

        if (state.phase === "finish") {
          resetGame();
        }
      }

      function doneAction() {
        if (state.phase === "items") {
          if (!state.items.length) {
            speak("Take one treasure picture first.");
            return;
          }

          speak("Treasures done. Start cleanup.");
          setPhase("ready");
          return;
        }

        if (state.phase === "after-ready") {
          setPhase("done");
        }
      }

      function goBack(event) {
        event.preventDefault();

        if (state.phase === "voice-choice") {
          window.location.href = "pixelprix.html";
          return;
        }

        if (state.phase === "intro") {
          setPhase("voice-choice", { skipHistory: true });
          return;
        }

        if (state.phase === "items" && state.items.length > 0) {
          state.items.pop();
          setPhase("items", { skipHistory: true });
          speak("Back one treasure.");
          return;
        }

        if (state.phase === "name-treasure" && state.items.length > 0) {
          state.items.pop();
          openCamera().then(function (ok) {
            if (ok) {
              setPhase("items", { skipHistory: true });
            }
          });
          return;
        }

        if (state.phase === "cleanup" && state.cleanupIndex > 0) {
          state.cleanupIndex -= 1;
          setPhase("cleanup", { skipHistory: true });
          speak("Back one treasure.");
          return;
        }

        const previous = state.phaseHistory.pop();

        if (previous) {
          setPhase(previous, { skipHistory: true });
          speak("Back.");
          return;
        }

        window.location.href = "pixelprix.html";
      }

      function resetGame() {
        stopCamera();
        stopSong();

        state.cleanPic = "";
        state.items = [];
        state.cleanupIndex = 0;
        state.phaseHistory = [];
        state.namingTreasureNumber = 0;

        setPhase("voice-choice", { skipHistory: true });
      }

      function likeYes() {
        beep();
        el.prompt.textContent = "Yes! PixelPrix liked your treasure story too.";
        el.helper.textContent = "Tap PLAY AGAIN when you are ready.";
        speak("Yes. Great job.");
      }

      function goHome() {
        window.location.href = "pixelprix.html";
      }

      el.voiceMale.addEventListener("click", function () {
        chooseVoice("male");
      });

      el.voiceFemale.addEventListener("click", function () {
        chooseVoice("female");
      });

      el.songToggle.addEventListener("click", toggleSong);
      el.backGame.addEventListener("click", goBack);
      el.mainButton.addEventListener("click", mainAction);
      el.doneButton.addEventListener("click", doneAction);

      el.zoomClose.addEventListener("click", closeZoom);

      el.zoomViewer.addEventListener("click", function (event) {
        if (event.target === el.zoomViewer) {
          closeZoom();
        }
      });

      el.likeYes.addEventListener("click", likeYes);
      el.likeAgain.addEventListener("click", resetGame);
      el.likeHome.addEventListener("click", goHome);

      window.addEventListener("pagehide", function () {
        stopCamera();
      });

      loadRobotVoice();
      loadSongSetting();
      setPhase("voice-choice", { skipHistory: true });
    })();
  </script>

  <script src="js/pixelprix-voice.js"></script>
</body>
</html>
