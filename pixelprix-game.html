<!DOCTYPE html>
<!--
  NET FILE: pixelprix-game.html
  CyberCrowd | PixelPrix Camera Game
  Purpose: Runs the PixelPrix kid cleanup camera adventure.
  Owns: layered art wake, robot choice window, parent song toggle, room game-board shot, treasure snaps, human voice naming, cleanup replay, big picture review, clean/dirty compare.
  Does NOT own: PixelPrix poster landing, uploads, sync, accounts, provider transport, PING, NET, CORE.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>PixelPrix | Camera Game</title>

  <style>
    :root {
      --ink: #fff7df;
      --gold: #ffd34d;
      --green: #6dff91;
      --blue: #7bd4ff;
      --purple: #c79cff;
      --pink: #ff8bd1;
      --shadow: rgba(0, 0, 0, 0.62);
      --line: rgba(255, 255, 255, 0.24);
      --pxp-vh: 100svh;
      --bottom-safe: 56px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-width: 320px;
      height: 100%;
      min-height: 100svh;
      margin: 0;
      color: var(--ink);
      background: #05060a;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    body {
      position: relative;
      height: var(--pxp-vh);
      min-height: var(--pxp-vh);
      max-height: var(--pxp-vh);
    }

    .camera {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .camera.live video {
      display: block;
    }

    .still {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        linear-gradient(to bottom, rgba(5, 6, 10, 0.04), rgba(5, 6, 10, 0.18)),
        url("https://pub-081cb3c244be4e09b5e76012567a0b0a.r2.dev/PixelPrix.png")
        center / cover
        no-repeat,
        #05060a;
      background-size: cover;
      background-position: center;
      opacity: 1;
    }

    .camera.live + .still {
      opacity: 0;
    }

    .shade {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(to bottom, rgba(0, 0, 0, 0.18), transparent 30%, rgba(0, 0, 0, 0.72)),
        radial-gradient(circle at center, transparent 22%, rgba(0, 0, 0, 0.16));
    }

    .art-wake {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: none;
      border: 0;
      padding: 0;
      margin: 0;
      background: transparent;
      box-shadow: none;
      border-radius: 0;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .art-wake.show {
      display: block;
    }

    .choice-window {
      position: fixed;
      left: 50%;
      bottom: max(72px, calc(env(safe-area-inset-bottom) + 68px));
      z-index: 7;
      width: min(360px, calc(100vw - 34px));
      transform: translateX(-50%);
      display: none;
      padding: 12px;
      border-radius: 22px;
      background: rgba(5, 6, 10, 0.76);
      border: 2px solid rgba(255, 255, 255, 0.28);
      box-shadow: 0 14px 38px rgba(0, 0, 0, 0.62);
      backdrop-filter: blur(8px);
    }

    .choice-window.show {
      display: grid;
      gap: 9px;
    }

    .choice-title {
      margin: 0;
      color: var(--gold);
      font-size: clamp(1.15rem, 5vw, 1.7rem);
      line-height: 1;
      font-weight: 900;
      text-align: center;
      text-shadow: 0 3px 0 #000;
    }

    .choice-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .choice-button {
      min-height: 54px;
      border-radius: 18px;
      color: #050505;
      font: inherit;
      font-size: clamp(1rem, 4.2vw, 1.24rem);
      font-weight: 900;
      box-shadow: 0 5px 0 var(--shadow);
    }

    .choice-button.male {
      background: var(--blue);
    }

    .choice-button.female {
      background: var(--purple);
    }

    .parent-song {
      position: fixed;
      right: 12px;
      bottom: max(14px, env(safe-area-inset-bottom));
      z-index: 8;
      display: none;
    }

    .parent-song.show {
      display: block;
    }

    .song-toggle {
      width: auto;
      min-height: 38px;
      padding: 8px 13px;
      border-radius: 999px;
      background: var(--gold);
      color: #050505;
      font: inherit;
      font-size: 0.86rem;
      font-weight: 900;
      box-shadow: 0 4px 0 var(--shadow);
      white-space: nowrap;
    }

    .song-toggle.off {
      background: rgba(255, 255, 255, 0.78);
    }

    .page {
      position: relative;
      z-index: 3;
      width: min(900px, 100%);
      height: var(--pxp-vh);
      min-height: var(--pxp-vh);
      max-height: var(--pxp-vh);
      margin: 0 auto;
      padding:
        max(7px, env(safe-area-inset-top))
        9px
        max(var(--bottom-safe), env(safe-area-inset-bottom));
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 6px;
      overflow: hidden;
      pointer-events: none;
    }

    .page.active-ui {
      pointer-events: auto;
    }

    .top {
      position: relative;
      z-index: 9;
      display: flex;
      justify-content: space-between;
      gap: 7px;
      align-items: center;
      min-height: 36px;
      flex-shrink: 0;
      pointer-events: auto;
    }

    .top a {
      display: grid;
      place-items: center;
      min-height: 34px;
      padding: 6px 10px;
      border-radius: 999px;
      color: #050505;
      background: var(--gold);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 900;
      box-shadow: 0 4px 0 var(--shadow);
      white-space: nowrap;
      touch-action: manipulation;
    }

    .top a.home {
      background: var(--green);
    }

    .stage {
      min-height: 0;
      display: grid;
      align-content: end;
      gap: 6px;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: none;
      padding-bottom: 2px;
    }

    .stage::-webkit-scrollbar {
      display: none;
    }

    .panel {
      max-height: 100%;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 11px;
      border-radius: 24px;
      background: rgba(5, 6, 10, 0.74);
      border: 2px solid var(--line);
      box-shadow: 0 18px 45px var(--shadow);
      backdrop-filter: blur(7px);
      scrollbar-width: none;
    }

    .panel::-webkit-scrollbar {
      display: none;
    }

    .art-mode .stage,
    .art-mode .button-row {
      display: none;
    }

    .camera-mode .panel {
      padding: 10px 13px;
      border-radius: 22px;
      background: rgba(5, 6, 10, 0.62);
    }

    h1 {
      margin: 0 0 5px;
      color: var(--gold);
      font-size: clamp(1.7rem, 8vw, 4.6rem);
      line-height: 0.9;
      letter-spacing: 0.04em;
      text-shadow: 0 4px 0 #000;
    }

    .camera-mode h1 {
      font-size: clamp(1.55rem, 7vw, 3.7rem);
    }

    p {
      margin: 0;
      color: var(--ink);
      font-size: clamp(0.9rem, 3.55vw, 1.28rem);
      line-height: 1.16;
      font-weight: 900;
      text-shadow: 0 3px 0 #000;
    }

    .small {
      margin-top: 5px;
      color: rgba(255, 247, 223, 0.86);
      font-size: clamp(0.78rem, 3.1vw, 0.98rem);
    }

    .thumbs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      margin-top: 7px;
    }

    .thumbs.empty {
      display: none;
    }

    .thumb {
      aspect-ratio: 1 / 1;
      border-radius: 11px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.13);
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: grid;
      place-items: center;
      color: rgba(255, 247, 223, 0.7);
      font-size: 0.72rem;
      font-weight: 900;
      touch-action: manipulation;
    }

    .thumb.has-pic {
      cursor: pointer;
      border-color: rgba(255, 211, 77, 0.7);
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .compare {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-top: 8px;
    }

    .compare.show {
      display: grid;
    }

    .compare-card {
      min-height: 92px;
      border-radius: 18px;
      overflow: hidden;
      border: 2px solid var(--line);
      background: rgba(255, 255, 255, 0.08);
      display: grid;
      place-items: center;
      color: rgba(255, 247, 223, 0.8);
      font-weight: 900;
      text-align: center;
      touch-action: manipulation;
    }

    .compare-card.has-pic {
      cursor: pointer;
      border-color: rgba(255, 211, 77, 0.7);
    }

    .compare-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 7px;
      flex-shrink: 0;
      padding-bottom: 0;
    }

    .button-row.two {
      grid-template-columns: 1fr 0.52fr;
    }

    .button-row.three {
      grid-template-columns: 0.52fr 1fr 0.52fr;
    }

    button {
      width: 100%;
      min-height: 54px;
      border: 0;
      border-radius: 22px;
      padding: 10px 14px;
      color: #050505;
      background: linear-gradient(135deg, var(--green), #dbff73);
      font: inherit;
      font-size: clamp(1.02rem, 4.6vw, 2.25rem);
      font-weight: 900;
      cursor: pointer;
      text-align: center;
      display: grid;
      place-items: center;
      box-shadow: 0 7px 0 var(--shadow);
      touch-action: manipulation;
    }

    .side-button {
      display: none;
      background: linear-gradient(135deg, var(--pink), var(--gold));
      font-size: clamp(0.9rem, 3.8vw, 1.2rem);
    }

    .side-button.show {
      display: grid;
    }

    button:active,
    .top a:active {
      transform: translateY(4px);
      box-shadow: 0 3px 0 var(--shadow);
    }

    .finish-row {
      display: none;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-top: 8px;
    }

    .finish-row.show {
      display: grid;
    }

    .finish-button {
      min-height: 52px;
      border-radius: 18px;
      padding: 8px;
      font-size: clamp(0.82rem, 3.5vw, 1.05rem);
      box-shadow: 0 5px 0 var(--shadow);
    }

    .finish-button.yes {
      background: linear-gradient(135deg, var(--green), #dbff73);
    }

    .finish-button.again {
      background: linear-gradient(135deg, var(--gold), #fff1a3);
    }

    .finish-button.home {
      background: linear-gradient(135deg, var(--blue), #d8f4ff);
    }

    .zoom-viewer {
      position: fixed;
      inset: 0;
      z-index: 99;
      display: none;
      place-items: center;
      padding: 18px;
      background: rgba(0, 0, 0, 0.92);
    }

    .zoom-viewer.show {
      display: grid;
    }

    .zoom-viewer img {
      max-width: 100%;
      max-height: 86svh;
      border-radius: 22px;
      border: 3px solid var(--gold);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
      object-fit: contain;
    }

    .zoom-close {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      right: 12px;
      z-index: 100;
      width: auto;
      min-height: 44px;
      padding: 9px 14px;
      border-radius: 999px;
      background: var(--gold);
      color: #050505;
      font-size: 1rem;
      box-shadow: 0 5px 0 var(--shadow);
    }

    canvas {
      display: none;
    }

    @media (max-height: 700px) {
      :root {
        --bottom-safe: 58px;
      }

      .page {
        gap: 5px;
        padding:
          max(5px, env(safe-area-inset-top))
          8px
          max(var(--bottom-safe), env(safe-area-inset-bottom));
      }

      .top {
        min-height: 32px;
      }

      .top a {
        min-height: 31px;
        padding: 5px 9px;
        font-size: 0.75rem;
      }

      .panel {
        padding: 9px;
        border-radius: 21px;
      }

      h1 {
        font-size: clamp(1.45rem, 7.1vw, 3.7rem);
        margin-bottom: 4px;
      }

      p {
        font-size: clamp(0.82rem, 3.25vw, 1.05rem);
        line-height: 1.12;
      }

      .small {
        margin-top: 4px;
        font-size: clamp(0.72rem, 2.9vw, 0.88rem);
      }

      button {
        min-height: 48px;
        border-radius: 20px;
        padding: 8px 12px;
        font-size: clamp(0.95rem, 4.1vw, 1.9rem);
      }
    }
  </style>
</head>

<body>
  <div class="camera" id="camera-shell">
    <video id="camera-video" autoplay playsinline muted></video>
  </div>

  <div class="still" id="still"></div>
  <div class="shade"></div>

  <button class="art-wake" id="art-wake" type="button" aria-label="Wake PixelPrix"></button>

  <section class="choice-window" id="choice-window" aria-label="Choose robot">
    <p class="choice-title">Choose Robot</p>

    <div class="choice-row">
      <button class="choice-button male" id="voice-male" type="button">🤖 Male</button>
      <button class="choice-button female" id="voice-female" type="button">🤖 Female</button>
    </div>
  </section>

  <div class="parent-song" id="parent-song">
    <button class="song-toggle" id="song-toggle" type="button">Song ON 🎵</button>
  </div>

  <main class="page art-mode" id="page">
    <header class="top">
      <a href="pixelprix.html" id="back-game">← EXIT</a>
      <a class="home" href="https://cybercrowd.net/">CyberCrowd 🏠</a>
    </header>

    <section class="stage">
      <div class="panel">
        <h1 id="title">PixelPrix</h1>

        <p id="prompt">Start your treasure adventure.</p>

        <p class="small" id="helper">Open the camera. First we take the room picture.</p>

        <div class="thumbs empty" id="thumbs"></div>

        <div class="compare" id="compare">
          <div class="compare-card" id="dirty-card">Dirty Room</div>
          <div class="compare-card" id="clean-card">Clean Room</div>
        </div>

        <div class="finish-row" id="finish-row">
          <button class="finish-button yes" id="like-yes" type="button">YES 😄</button>
          <button class="finish-button again" id="like-again" type="button">PLAY AGAIN</button>
          <button class="finish-button home" id="like-home" type="button">GO HOME</button>
        </div>
      </div>
    </section>

    <section class="button-row" id="button-row">
      <button class="side-button" id="left-button" type="button">BACK</button>
      <button id="main-button" type="button">START</button>
      <button class="side-button" id="right-button" type="button">DONE ✔️</button>
    </section>
  </main>

  <canvas id="capture-canvas"></canvas>

  <div class="zoom-viewer" id="zoom-viewer" aria-hidden="true">
    <button class="zoom-close" id="zoom-close" type="button">CLOSE</button>
    <img id="zoom-image" alt="Big PixelPrix picture" />
  </div>

  <audio id="pixelprix-song" preload="auto" loop>
    <source src="audio/pixelprix-song.mp3" type="audio/mpeg" />
    <source src="pixelprix-song.mp3" type="audio/mpeg" />
  </audio>

  <script>
    (function () {
      "use strict";

      const SONG_KEY = "pixelprixSongEnabled";
      const EXIT_ARM_MS = 2600;

      function setRealViewportHeight() {
        document.documentElement.style.setProperty("--pxp-vh", window.innerHeight + "px");
      }

      setRealViewportHeight();

      window.addEventListener("resize", setRealViewportHeight);
      window.addEventListener("orientationchange", function () {
        setTimeout(setRealViewportHeight, 250);
      });

      const state = {
        phase: "wake",
        robotVoice: "female",
        songEnabled: true,
        songStarted: false,
        stream: null,
        roomPic: "",
        cleanPic: "",
        items: [],
        cleanupIndex: 0,
        reviewIndex: 0,
        reviewList: [],
        phaseHistory: [],
        namingTreasureNumber: 0,
        voiceRecording: false,
        exitArmed: false,
        exitTimer: null
      };

      const el = {
        page: document.getElementById("page"),
        artWake: document.getElementById("art-wake"),
        choiceWindow: document.getElementById("choice-window"),
        parentSong: document.getElementById("parent-song"),
        cameraShell: document.getElementById("camera-shell"),
        video: document.getElementById("camera-video"),
        canvas: document.getElementById("capture-canvas"),
        still: document.getElementById("still"),
        title: document.getElementById("title"),
        prompt: document.getElementById("prompt"),
        helper: document.getElementById("helper"),
        voiceMale: document.getElementById("voice-male"),
        voiceFemale: document.getElementById("voice-female"),
        songToggle: document.getElementById("song-toggle"),
        song: document.getElementById("pixelprix-song"),
        thumbs: document.getElementById("thumbs"),
        compare: document.getElementById("compare"),
        dirtyCard: document.getElementById("dirty-card"),
        cleanCard: document.getElementById("clean-card"),
        finishRow: document.getElementById("finish-row"),
        likeYes: document.getElementById("like-yes"),
        likeAgain: document.getElementById("like-again"),
        likeHome: document.getElementById("like-home"),
        buttonRow: document.getElementById("button-row"),
        mainButton: document.getElementById("main-button"),
        leftButton: document.getElementById("left-button"),
        rightButton: document.getElementById("right-button"),
        backGame: document.getElementById("back-game"),
        zoomViewer: document.getElementById("zoom-viewer"),
        zoomImage: document.getElementById("zoom-image"),
        zoomClose: document.getElementById("zoom-close")
      };

      function voiceGuide(key, detail, after) {
        if (typeof detail === "function") {
          after = detail;
          detail = null;
        }

        if (window.PixelPrixVoice && window.PixelPrixVoice.guide) {
          window.PixelPrixVoice.guide(key, detail, after);
          return;
        }

        if (typeof after === "function") {
          after();
        }
      }

      function voiceGuideSequence(list) {
        let index = 0;

        function next() {
          if (index >= list.length) {
            return;
          }

          const item = list[index];
          index += 1;
          voiceGuide(item, null, next);
        }

        next();
      }

      function saveRobotVoice(mode) {
        state.robotVoice = mode === "male" ? "male" : "female";

        try {
          localStorage.setItem("pixelprixRobotVoice", state.robotVoice);
          localStorage.setItem("pixelprixGuide", "robot");
        } catch (error) {}
      }

      function loadRobotVoice() {
        try {
          const saved = localStorage.getItem("pixelprixRobotVoice") || "female";
          state.robotVoice = saved === "male" ? "male" : "female";
        } catch (error) {
          state.robotVoice = "female";
        }
      }

      function loadSongSetting() {
        try {
          const saved = localStorage.getItem(SONG_KEY);
          state.songEnabled = saved === null ? true : saved === "true";
        } catch (error) {
          state.songEnabled = true;
        }

        renderSongToggle();
      }

      function saveSongSetting() {
        try {
          localStorage.setItem(SONG_KEY, String(state.songEnabled));
        } catch (error) {}
      }

      function renderSongToggle() {
        el.songToggle.textContent = state.songEnabled ? "Song ON 🎵" : "Song OFF";
        el.songToggle.classList.toggle("off", !state.songEnabled);
      }

      function toggleSong() {
        state.songEnabled = !state.songEnabled;
        saveSongSetting();
        renderSongToggle();

        if (!state.songEnabled) {
          stopSong();
        }
      }

      function startSong() {
        if (!state.songEnabled || state.songStarted || !el.song) {
          return;
        }

        try {
          el.song.volume = 0.42;
          const attempt = el.song.play();

          if (attempt && typeof attempt.then === "function") {
            attempt.then(function () {
              state.songStarted = true;
            }).catch(function () {
              state.songStarted = false;
            });
            return;
          }

          state.songStarted = true;
        } catch (error) {
          state.songStarted = false;
        }
      }

      function stopSong() {
        if (!el.song) {
          return;
        }

        try {
          el.song.pause();
          el.song.currentTime = 0;
          state.songStarted = false;
        } catch (error) {}
      }

      function beep() {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;

          if (!AudioContext) {
            return;
          }

          const ctx = new AudioContext();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = "square";
          osc.frequency.value = 720;
          gain.gain.value = 0.035;

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();

          setTimeout(function () {
            osc.stop();
            ctx.close();
          }, 90);
        } catch (error) {}
      }

      async function openCamera() {
        stopCamera();

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          el.helper.textContent = "Camera needs permission.";
          return false;
        }

        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
              facingMode: { ideal: "environment" },
              width: { ideal: 1280 },
              height: { ideal: 720 }
            }
          });

          state.stream = stream;
          el.video.srcObject = stream;
          el.cameraShell.classList.add("live");
          setRealViewportHeight();
          return true;
        } catch (error) {
          el.helper.textContent = "Camera permission needed. Turn camera permission on, then try again.";
          setRealViewportHeight();
          return false;
        }
      }

      function stopCamera() {
        if (state.stream) {
          state.stream.getTracks().forEach(function (track) {
            track.stop();
          });
        }

        state.stream = null;
        el.video.srcObject = null;
        el.cameraShell.classList.remove("live");
      }

      function capturePic() {
        const width = el.video.videoWidth || 1280;
        const height = el.video.videoHeight || 720;

        el.canvas.width = width;
        el.canvas.height = height;

        const ctx = el.canvas.getContext("2d");
        ctx.drawImage(el.video, 0, 0, width, height);

        return el.canvas.toDataURL("image/jpeg", 0.86);
      }

      function setStill(pic) {
        if (!pic) {
          el.still.style.backgroundImage =
            'linear-gradient(to bottom, rgba(5, 6, 10, 0.04), rgba(5, 6, 10, 0.18)), url("https://pub-081cb3c244be4e09b5e76012567a0b0a.r2.dev/PixelPrix.png") center / cover no-repeat, #05060a';
          return;
        }

        el.still.style.backgroundImage = "url('" + pic + "')";
      }

      function imageHtml(pic, alt) {
        return '<img src="' + pic + '" alt="' + alt + '" />';
      }

      function openZoom(pic) {
        if (!pic) {
          return;
        }

        el.zoomImage.src = pic;
        el.zoomViewer.classList.add("show");
        el.zoomViewer.setAttribute("aria-hidden", "false");
      }

      function closeZoom() {
        el.zoomViewer.classList.remove("show");
        el.zoomViewer.setAttribute("aria-hidden", "true");
        el.zoomImage.removeAttribute("src");
      }

      function hideFinish() {
        el.finishRow.classList.remove("show");
      }

      function clearCompare() {
        el.compare.classList.remove("show");
        el.dirtyCard.onclick = null;
        el.cleanCard.onclick = null;
        el.dirtyCard.classList.remove("has-pic");
        el.cleanCard.classList.remove("has-pic");
        el.dirtyCard.textContent = "Dirty Room";
        el.cleanCard.textContent = "Clean Room";
      }

      function setButton(mainText) {
        el.mainButton.textContent = mainText;
        setTimeout(setRealViewportHeight, 60);
      }

      function setSideButtons(mode) {
        el.buttonRow.className = "button-row";
        el.leftButton.classList.remove("show");
        el.rightButton.classList.remove("show");

        if (mode === "right") {
          el.buttonRow.classList.add("two");
          el.rightButton.classList.add("show");
        }

        if (mode === "both") {
          el.buttonRow.classList.add("three");
          el.leftButton.classList.add("show");
          el.rightButton.classList.add("show");
        }
      }

      function isLiveCameraPhase() {
        return state.phase === "room" || state.phase === "items" || state.phase === "after";
      }

      function renderThumbs() {
        el.thumbs.innerHTML = "";
        el.thumbs.classList.add("empty");

        if (isLiveCameraPhase()) {
          return;
        }

        const pics = [];

        if (state.roomPic) {
          pics.push({ label: "Room", pic: state.roomPic });
        }

        state.items.forEach(function (item) {
          pics.push({ label: String(item.number), pic: item.pic });
        });

        if (state.cleanPic) {
          pics.push({ label: "Clean", pic: state.cleanPic });
        }

        if (!pics.length) {
          return;
        }

        const visible = pics.slice(-8);
        el.thumbs.classList.remove("empty");
        el.thumbs.style.gridTemplateColumns = "repeat(" + Math.min(visible.length, 4) + ", 1fr)";

        visible.forEach(function (item) {
          const box = document.createElement("div");
          box.className = "thumb has-pic";
          box.innerHTML = item.pic ? imageHtml(item.pic, item.label) : item.label;

          box.addEventListener("click", function () {
            openZoom(item.pic);
          });

          el.thumbs.appendChild(box);
        });
      }

      function buildReviewList() {
        const list = [];

        if (state.roomPic) {
          list.push({
            label: "Dirty room",
            helper: "This is the room game board / before picture.",
            pic: state.roomPic
          });
        }

        state.items.forEach(function (item) {
          list.push({
            label: "Treasure " + item.number,
            helper: "Tap through treasures one by one.",
            pic: item.pic
          });
        });

        if (state.cleanPic) {
          list.push({
            label: "Clean room",
            helper: "Compare clean room with dirty room.",
            pic: state.cleanPic
          });
        }

        state.reviewList = list;
      }

      function showReviewPicture() {
        buildReviewList();

        if (!state.reviewList.length) {
          setPhase("finish");
          return;
        }

        if (state.reviewIndex < 0) {
          state.reviewIndex = 0;
        }

        if (state.reviewIndex >= state.reviewList.length) {
          state.reviewIndex = state.reviewList.length - 1;
        }

        const item = state.reviewList[state.reviewIndex];

        stopCamera();
        setStill(item.pic);
        el.title.textContent = item.label;
        el.prompt.textContent = "Review picture " + (state.reviewIndex + 1) + " of " + state.reviewList.length + ".";
        el.helper.textContent = item.helper;
        setButton("NEXT ▶");
        el.leftButton.textContent = "◀ BACK";
        el.rightButton.textContent = "FINISH";
        setSideButtons("both");
        renderThumbs();
      }

      function clearExitArm() {
        state.exitArmed = false;
        el.backGame.textContent = "← EXIT";

        if (state.exitTimer) {
          clearTimeout(state.exitTimer);
          state.exitTimer = null;
        }
      }

      function setCameraMode(on) {
        el.page.classList.toggle("camera-mode", on);
      }

      function setArtMode(on) {
        el.page.classList.toggle("art-mode", on);
        el.page.classList.toggle("active-ui", !on);
        el.artWake.classList.toggle("show", on && state.phase === "wake");
        el.parentSong.classList.toggle("show", on || state.phase === "choice");
      }

      function openChoiceWindow() {
        if (state.phase !== "wake") {
          return;
        }

        startSong();
        state.phase = "choice";
        el.artWake.classList.remove("show");
        el.choiceWindow.classList.add("show");
        el.parentSong.classList.add("show");
      }

      function closeChoiceWindow() {
        el.choiceWindow.classList.remove("show");
      }

      function setPhase(phase, options) {
        options = options || {};

        clearExitArm();

        if (!options.skipHistory && state.phase && state.phase !== phase) {
          state.phaseHistory.push(state.phase);
        }

        state.phase = phase;

        hideFinish();
        clearCompare();
        setSideButtons("");
        closeChoiceWindow();
        state.voiceRecording = false;
        setCameraMode(phase === "room" || phase === "items" || phase === "after");

        if (phase === "wake") {
          stopCamera();
          setStill("");
          setArtMode(true);
          return;
        }

        setArtMode(false);

        if (phase === "intro") {
          stopCamera();
          setStill("");
          el.title.textContent = "PixelPrix";
          el.prompt.textContent = "Start your treasure adventure.";
          el.helper.textContent = "Open the camera. First we take the room picture.";
          setButton("OPEN CAMERA");
        }

        if (phase === "room") {
          el.title.textContent = "Room Shot";
          el.prompt.textContent = "Take the room picture first.";
          el.helper.textContent = "This is the game board / dirty room / before picture.";
          setButton("TAKE ROOM PIC 📸");
        }

        if (phase === "items") {
          el.title.textContent = "Treasure " + (state.items.length + 1);
          el.prompt.textContent = "Look for a treasure.";
          el.helper.textContent = "Point the camera at one treasure, then tap TAKE SNAP.";
          setButton("TAKE SNAP 📸");

          if (state.items.length > 0) {
            el.rightButton.textContent = "DONE ✔️";
            setSideButtons("right");
          }
        }

        if (phase === "name-treasure") {
          stopCamera();

          const item = state.items[state.items.length - 1];

          if (item && item.pic) {
            setStill(item.pic);
          }

          state.namingTreasureNumber = item ? item.number : state.items.length;
          el.title.textContent = "Treasure " + state.namingTreasureNumber;
          el.prompt.textContent = "Name this treasure";
          el.helper.textContent = "Tap RECORD YOUR VOICE. Say the treasure name.";
          setButton("RECORD YOUR VOICE");
        }

        if (phase === "treasure-saved") {
          const item = state.items[state.items.length - 1];

          if (item && item.pic) {
            setStill(item.pic);
          }

          el.title.textContent = "Saved";
          el.prompt.textContent = "Voice saved to treasure " + state.namingTreasureNumber + ".";
          el.helper.textContent = "Now take the next treasure or tap DONE.";
          setButton("NEXT TREASURE");

          if (state.items.length > 0) {
            el.rightButton.textContent = "DONE ✔️";
            setSideButtons("right");
          }
        }

        if (phase === "ready") {
          stopCamera();
          setStill(state.roomPic);
          el.title.textContent = "Cleanup Time";
          el.prompt.textContent = "Your treasures are ready.";
          el.helper.textContent = "The cleanup game plays each saved human voice.";
          setButton("PLAY CLEAN UP");
        }

        if (phase === "cleanup") {
          stopCamera();

          const item = state.items[state.cleanupIndex];

          if (item && item.pic) {
            setStill(item.pic);
          }

          el.title.textContent = "Find It";
          el.prompt.textContent = "Go find treasure " + (state.cleanupIndex + 1) + ".";
          el.helper.textContent = "Listen for the saved voice. When it is picked up, tap FOUND IT.";
          setButton("FOUND IT");

          window.setTimeout(function () {
            if (window.PixelPrixVoice && window.PixelPrixVoice.cueFind) {
              window.PixelPrixVoice.cueFind(state.cleanupIndex + 1);
            }
          }, 250);
        }

        if (phase === "after-ready") {
          stopCamera();
          setStill(state.roomPic);
          el.title.textContent = "Clean Room Picture";
          el.prompt.textContent = "Take the clean room picture?";
          el.helper.textContent = "This lets you compare dirty room and clean room.";
          setButton("OPEN CAMERA");
          el.rightButton.textContent = "SKIP";
          setSideButtons("right");
        }

        if (phase === "after") {
          el.title.textContent = "Clean Room";
          el.prompt.textContent = "Take the clean room picture.";
          el.helper.textContent = "This becomes the after picture.";
          setButton("TAKE CLEAN PIC 📸");
        }

        if (phase === "compare") {
          stopCamera();
          setStill(state.cleanPic || state.roomPic);
          el.title.textContent = "Spot the Difference";
          el.prompt.textContent = "Dirty room ↔ clean room.";
          el.helper.textContent = "Tap either picture to make it big.";

          el.compare.classList.add("show");

          if (state.roomPic) {
            el.dirtyCard.classList.add("has-pic");
            el.dirtyCard.innerHTML = imageHtml(state.roomPic, "Dirty room");
            el.dirtyCard.onclick = function () {
              openZoom(state.roomPic);
            };
          }

          if (state.cleanPic) {
            el.cleanCard.classList.add("has-pic");
            el.cleanCard.innerHTML = imageHtml(state.cleanPic, "Clean room");
            el.cleanCard.onclick = function () {
              openZoom(state.cleanPic);
            };
          }

          setButton("REVIEW BIG");
        }

        if (phase === "review") {
          showReviewPicture();
        }

        if (phase === "finish") {
          stopCamera();
          setStill(state.cleanPic || state.roomPic);
          el.title.textContent = "PixelPrix Complete";
          el.prompt.textContent = "Did you like this?";
          el.helper.textContent = "Pictures, cleanup, voice, and review are done.";
          el.finishRow.classList.add("show");
          setButton("PLAY AGAIN");
        }

        renderThumbs();
        setRealViewportHeight();
      }

      function chooseVoice(mode) {
        saveRobotVoice(mode);
        startSong();
        setPhase("intro");
        voiceGuideSequence(["welcome", "adventure"]);
      }

      async function mainAction() {
        if (state.phase === "intro") {
          voiceGuide("room");

          const ok = await openCamera();

          if (ok) {
            setPhase("room");
          }

          return;
        }

        if (state.phase === "room") {
          state.roomPic = capturePic();
          setStill(state.roomPic);
          beep();
          setPhase("items");
          voiceGuide("treasure");
          return;
        }

        if (state.phase === "items") {
          const pic = capturePic();
          const number = state.items.length + 1;

          state.items.push({
            number: number,
            pic: pic,
            done: false
          });

          beep();
          setPhase("name-treasure");
          voiceGuide("name");
          return;
        }

        if (state.phase === "name-treasure") {
          recordVoiceForTreasure();
          return;
        }

        if (state.phase === "treasure-saved") {
          const ok = await openCamera();

          if (ok) {
            setPhase("items");
            voiceGuide("treasure");
          }

          return;
        }

        if (state.phase === "ready") {
          state.cleanupIndex = 0;
          setPhase("cleanup");
          return;
        }

        if (state.phase === "cleanup") {
          state.cleanupIndex += 1;
          beep();

          if (state.cleanupIndex >= state.items.length) {
            setPhase("after-ready");
            return;
          }

          setPhase("cleanup");
          return;
        }

        if (state.phase === "after-ready") {
          const ok = await openCamera();

          if (ok) {
            setPhase("after");
          }

          return;
        }

        if (state.phase === "after") {
          state.cleanPic = capturePic();
          beep();
          setPhase("compare");
          return;
        }

        if (state.phase === "compare") {
          state.reviewIndex = 0;
          setPhase("review");
          return;
        }

        if (state.phase === "review") {
          state.reviewIndex += 1;

          if (state.reviewIndex >= state.reviewList.length) {
            state.reviewIndex = state.reviewList.length - 1;
          }

          showReviewPicture();
          return;
        }

        if (state.phase === "finish") {
          resetGame();
        }
      }

      function recordVoiceForTreasure() {
        const number = state.namingTreasureNumber;

        if (!window.PixelPrixVoice || !window.PixelPrixVoice.start) {
          el.helper.textContent = "Voice recorder is not ready. Tap NEXT TREASURE.";
          setPhase("treasure-saved");
          return;
        }

        if (!state.voiceRecording) {
          state.voiceRecording = true;
          el.helper.textContent = "Listening. Say the treasure name.";
          setButton("STOP RECORDING");

          window.PixelPrixVoice.start(number, {
            onStatus: function (message) {
              el.helper.textContent = message;
            },
            onDone: function () {
              state.voiceRecording = false;
              setPhase("treasure-saved");
            }
          });

          return;
        }

        window.PixelPrixVoice.stop();
      }

      function rightAction() {
        if (state.phase === "items" || state.phase === "treasure-saved") {
          if (!state.items.length) {
            return;
          }

          setPhase("ready");
          return;
        }

        if (state.phase === "after-ready") {
          state.reviewIndex = 0;
          setPhase("review");
          return;
        }

        if (state.phase === "review") {
          setPhase("finish");
        }
      }

      function leftAction() {
        if (state.phase === "review") {
          state.reviewIndex -= 1;

          if (state.reviewIndex < 0) {
            state.reviewIndex = 0;
          }

          showReviewPicture();
        }
      }

      function goBack(event) {
        event.preventDefault();

        if (state.exitArmed) {
          window.location.href = "pixelprix.html";
          return;
        }

        state.exitArmed = true;
        el.backGame.textContent = "EXIT AGAIN";

        if (state.phase !== "wake" && state.phase !== "choice" && el.helper) {
          el.helper.textContent = "Tap EXIT again to leave PixelPrix.";
        }

        state.exitTimer = setTimeout(function () {
          clearExitArm();
        }, EXIT_ARM_MS);
      }

      function resetGame() {
        stopCamera();
        stopSong();

        if (window.PixelPrixVoice && window.PixelPrixVoice.stop) {
          window.PixelPrixVoice.stop();
        }

        state.roomPic = "";
        state.cleanPic = "";
        state.items = [];
        state.cleanupIndex = 0;
        state.reviewIndex = 0;
        state.reviewList = [];
        state.phaseHistory = [];
        state.namingTreasureNumber = 0;
        state.voiceRecording = false;

        setPhase("wake", { skipHistory: true });
      }

      function likeYes() {
        beep();
        el.prompt.textContent = "Yes! PixelPrix liked your treasure story too.";
        el.helper.textContent = "Tap PLAY AGAIN when you are ready.";
      }

      function goHome() {
        window.location.href = "pixelprix.html";
      }

      el.artWake.addEventListener("click", openChoiceWindow);

      el.voiceMale.addEventListener("click", function () {
        chooseVoice("male");
      });

      el.voiceFemale.addEventListener("click", function () {
        chooseVoice("female");
      });

      el.songToggle.addEventListener("click", toggleSong);
      el.backGame.addEventListener("click", goBack);
      el.mainButton.addEventListener("click", mainAction);
      el.leftButton.addEventListener("click", leftAction);
      el.rightButton.addEventListener("click", rightAction);

      el.zoomClose.addEventListener("click", closeZoom);

      el.zoomViewer.addEventListener("click", function (event) {
        if (event.target === el.zoomViewer) {
          closeZoom();
        }
      });

      el.likeYes.addEventListener("click", likeYes);
      el.likeAgain.addEventListener("click", resetGame);
      el.likeHome.addEventListener("click", goHome);

      window.addEventListener("pagehide", function () {
        stopCamera();

        if (window.PixelPrixVoice && window.PixelPrixVoice.stop) {
          window.PixelPrixVoice.stop();
        }
      });

      loadRobotVoice();
      loadSongSetting();
      setPhase("wake", { skipHistory: true });
    })();
  </script>

  <script src="js/pixelprix-voice.js"></script>
</body>
</html>
