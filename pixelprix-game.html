<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>PixelPrix | Camera Game</title>

  <style>
    :root {
      --ink: #fff7df;
      --gold: #ffd34d;
      --green: #6dff91;
      --blue: #7bd4ff;
      --purple: #c79cff;
      --pink: #ff8bd1;
      --shadow: rgba(0, 0, 0, 0.62);
      --line: rgba(255, 255, 255, 0.24);
      --pxp-vh: 100svh;
      --android-bottom-safe: 54px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-width: 320px;
      height: 100%;
      min-height: 100svh;
      margin: 0;
      color: var(--ink);
      background: #05060a;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    body {
      position: relative;
      height: var(--pxp-vh);
      min-height: var(--pxp-vh);
      max-height: var(--pxp-vh);
    }

    .camera {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .camera.live video {
      display: block;
    }

    .still {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(123, 212, 255, 0.22), transparent 20rem),
        radial-gradient(circle at 80% 80%, rgba(255, 211, 77, 0.18), transparent 22rem),
        #05060a;
      background-size: cover;
      background-position: center;
      opacity: 1;
    }

    .camera.live + .still {
      opacity: 0;
    }

    .shade {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(to bottom, rgba(0, 0, 0, 0.52), transparent 28%, rgba(0, 0, 0, 0.86)),
        radial-gradient(circle at center, transparent 22%, rgba(0, 0, 0, 0.35));
    }

    .camera-touch {
      position: fixed;
      inset: 0;
      z-index: 3;
      display: none;
      place-items: center;
      padding: 18px;
      pointer-events: none;
    }

    .camera-touch.show {
      display: grid;
      pointer-events: auto;
    }

    .camera-touch-bubble {
      max-width: min(520px, 92vw);
      padding: 16px 20px;
      border-radius: 28px;
      color: #050505;
      background: rgba(255, 211, 77, 0.94);
      border: 3px solid rgba(255, 255, 255, 0.65);
      box-shadow:
        0 10px 0 var(--shadow),
        0 0 34px rgba(255, 211, 77, 0.35);
      font-size: clamp(1.1rem, 5vw, 2rem);
      font-weight: 900;
      text-align: center;
      transform: scale(1);
      transition: transform 160ms ease, opacity 160ms ease;
      user-select: none;
    }

    .camera-touch.tap .camera-touch-bubble {
      transform: scale(1.08);
    }

    .page {
      position: relative;
      z-index: 2;
      width: min(900px, 100%);
      height: var(--pxp-vh);
      min-height: var(--pxp-vh);
      max-height: var(--pxp-vh);
      margin: 0 auto;
      padding:
        max(7px, env(safe-area-inset-top))
        9px
        max(var(--android-bottom-safe), env(safe-area-inset-bottom));
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 6px;
      overflow: hidden;
    }

    .top {
      display: flex;
      justify-content: space-between;
      gap: 7px;
      align-items: center;
      min-height: 36px;
      flex-shrink: 0;
    }

    .top a {
      display: grid;
      place-items: center;
      min-height: 34px;
      padding: 6px 10px;
      border-radius: 999px;
      color: #050505;
      background: var(--gold);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 900;
      box-shadow: 0 4px 0 var(--shadow);
      white-space: nowrap;
      touch-action: manipulation;
    }

    .top a.home {
      background: var(--green);
    }

    .stage {
      min-height: 0;
      display: grid;
      align-content: end;
      gap: 6px;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: none;
      padding-bottom: 2px;
    }

    .stage::-webkit-scrollbar {
      display: none;
    }

    .panel {
      max-height: 100%;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 11px;
      border-radius: 24px;
      background: rgba(5, 6, 10, 0.72);
      border: 2px solid var(--line);
      box-shadow: 0 18px 45px var(--shadow);
      backdrop-filter: blur(7px);
      scrollbar-width: none;
    }

    .panel::-webkit-scrollbar {
      display: none;
    }

    h1 {
      margin: 0 0 5px;
      color: var(--gold);
      font-size: clamp(1.7rem, 8.2vw, 4.8rem);
      line-height: 0.9;
      letter-spacing: 0.04em;
      text-shadow: 0 4px 0 #000;
    }

    p {
      margin: 0;
      color: var(--ink);
      font-size: clamp(0.9rem, 3.55vw, 1.28rem);
      line-height: 1.16;
      font-weight: 900;
      text-shadow: 0 3px 0 #000;
    }

    .small {
      margin-top: 5px;
      color: rgba(255, 247, 223, 0.86);
      font-size: clamp(0.78rem, 3.1vw, 0.98rem);
    }

    .progress {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
      margin-top: 7px;
    }

    .dot {
      min-height: 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.22);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14);
    }

    .dot.done {
      background: var(--green);
    }

    .dot.now {
      background: var(--gold);
    }

    .thumbs {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
      margin-top: 6px;
    }

    .thumb {
      aspect-ratio: 1 / 1;
      border-radius: 11px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.13);
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: grid;
      place-items: center;
      color: rgba(255, 247, 223, 0.7);
      font-size: 0.76rem;
      font-weight: 900;
      touch-action: manipulation;
    }

    .thumb.has-pic {
      cursor: pointer;
      border-color: rgba(255, 211, 77, 0.7);
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .compare {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-top: 8px;
    }

    .compare.show {
      display: grid;
    }

    .compare-card {
      min-height: 90px;
      border-radius: 18px;
      overflow: hidden;
      border: 2px solid var(--line);
      background: rgba(255, 255, 255, 0.08);
      display: grid;
      place-items: center;
      color: rgba(255, 247, 223, 0.8);
      font-weight: 900;
      text-align: center;
      touch-action: manipulation;
    }

    .compare-card.has-pic {
      cursor: pointer;
      border-color: rgba(255, 211, 77, 0.7);
    }

    .compare-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .choice-row {
      display: none;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-top: 8px;
    }

    .choice-row.show {
      display: grid;
    }

    .choice-button {
      min-height: 52px;
      border-radius: 18px;
      padding: 8px;
      font-size: clamp(0.82rem, 3.5vw, 1.05rem);
      box-shadow: 0 5px 0 var(--shadow);
    }

    .choice-button.yes {
      background: linear-gradient(135deg, var(--green), #dbff73);
    }

    .choice-button.again {
      background: linear-gradient(135deg, var(--gold), #fff1a3);
    }

    .choice-button.home {
      background: linear-gradient(135deg, var(--blue), #d8f4ff);
    }

    .button-row {
      display: grid;
      gap: 0;
      flex-shrink: 0;
      padding-bottom: 0;
    }

    button {
      width: 100%;
      min-height: 54px;
      border: 0;
      border-radius: 22px;
      padding: 10px 14px;
      color: #050505;
      background: linear-gradient(135deg, var(--green), #dbff73);
      font: inherit;
      font-size: clamp(1.05rem, 4.8vw, 2.35rem);
      font-weight: 900;
      cursor: pointer;
      text-align: center;
      display: grid;
      place-items: center;
      box-shadow: 0 7px 0 var(--shadow);
      touch-action: manipulation;
    }

    button:active,
    .top a:active {
      transform: translateY(4px);
      box-shadow: 0 3px 0 var(--shadow);
    }

    .zoom-viewer {
      position: fixed;
      inset: 0;
      z-index: 99;
      display: none;
      place-items: center;
      padding: 18px;
      background: rgba(0, 0, 0, 0.92);
    }

    .zoom-viewer.show {
      display: grid;
    }

    .zoom-viewer img {
      max-width: 100%;
      max-height: 86svh;
      border-radius: 22px;
      border: 3px solid var(--gold);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
      object-fit: contain;
    }

    .zoom-close {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      right: 12px;
      z-index: 100;
      width: auto;
      min-height: 44px;
      padding: 9px 14px;
      border-radius: 999px;
      background: var(--gold);
      color: #050505;
      font-size: 1rem;
      box-shadow: 0 5px 0 var(--shadow);
    }

    .hidden {
      display: none !important;
    }

    canvas {
      display: none;
    }

    @media (max-height: 700px) {
      :root {
        --android-bottom-safe: 58px;
      }

      .page {
        gap: 5px;
        padding:
          max(5px, env(safe-area-inset-top))
          8px
          max(var(--android-bottom-safe), env(safe-area-inset-bottom));
      }

      .top {
        min-height: 32px;
      }

      .top a {
        min-height: 31px;
        padding: 5px 9px;
        font-size: 0.75rem;
      }

      .panel {
        padding: 9px;
        border-radius: 21px;
      }

      h1 {
        font-size: clamp(1.45rem, 7.1vw, 3.7rem);
        margin-bottom: 4px;
      }

      p {
        font-size: clamp(0.82rem, 3.25vw, 1.05rem);
        line-height: 1.12;
      }

      .small {
        margin-top: 4px;
        font-size: clamp(0.72rem, 2.9vw, 0.88rem);
      }

      .progress {
        margin-top: 5px;
        gap: 4px;
      }

      .dot {
        min-height: 8px;
      }

      .thumbs {
        margin-top: 5px;
        gap: 4px;
      }

      .thumb {
        border-radius: 9px;
      }

      .compare-card {
        min-height: 78px;
      }

      button {
        min-height: 48px;
        border-radius: 20px;
        padding: 8px 12px;
        font-size: clamp(0.95rem, 4.1vw, 1.95rem);
      }

      .choice-button {
        min-height: 46px;
        font-size: clamp(0.74rem, 3.1vw, 0.95rem);
      }
    }

    @media (max-height: 600px) {
      :root {
        --android-bottom-safe: 62px;
      }

      .page {
        gap: 4px;
        padding:
          max(4px, env(safe-area-inset-top))
          7px
          max(var(--android-bottom-safe), env(safe-area-inset-bottom));
      }

      .panel {
        padding: 8px;
      }

      h1 {
        font-size: clamp(1.28rem, 6.4vw, 3.2rem);
      }

      p {
        font-size: clamp(0.78rem, 3vw, 0.98rem);
      }

      .small {
        display: block;
        font-size: clamp(0.68rem, 2.75vw, 0.82rem);
      }

      .compare-card {
        min-height: 68px;
      }

      button {
        min-height: 44px;
        font-size: clamp(0.88rem, 3.8vw, 1.7rem);
      }
    }
  </style>
</head>

<body>
  <div class="camera" id="camera-shell">
    <video id="camera-video" autoplay playsinline muted></video>
  </div>

  <div class="still" id="still"></div>
  <div class="shade"></div>

  <div class="camera-touch" id="camera-touch" aria-hidden="true">
    <div class="camera-touch-bubble" id="camera-touch-bubble">
      Tap the screen when you see it.
    </div>
  </div>

  <main class="page">
    <header class="top">
      <a href="pixelprix.html" id="back-game">← BACK</a>
      <a class="home" href="https://cybercrowd.net/">CyberCrowd 🏠</a>
    </header>

    <section class="stage">
      <div class="panel">
        <h1 id="title">PixelPrix</h1>

        <p id="prompt">
          Let’s make a Tiny Tidy adventure.
        </p>

        <p class="small" id="helper">
          Camera opens here. Pictures stay on this device.
        </p>

        <div class="progress" id="progress">
          <div class="dot now"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>

        <div class="thumbs" id="thumbs">
          <div class="thumb">1</div>
          <div class="thumb">2</div>
          <div class="thumb">3</div>
          <div class="thumb">4</div>
          <div class="thumb">5</div>
        </div>

        <div class="compare" id="compare">
          <div class="compare-card" id="before-card">Before</div>
          <div class="compare-card" id="after-card">After</div>
        </div>

        <div class="choice-row" id="choice-row">
          <button class="choice-button yes" id="like-yes" type="button">
            YES 😄
          </button>

          <button class="choice-button again" id="like-again" type="button">
            PLAY AGAIN
          </button>

          <button class="choice-button home" id="like-home" type="button">
            GO HOME
          </button>
        </div>
      </div>
    </section>

    <section class="button-row" id="button-row">
      <button id="main-button" type="button">
        OPEN CAMERA
      </button>
    </section>
  </main>

  <canvas id="capture-canvas"></canvas>

  <div class="zoom-viewer" id="zoom-viewer" aria-hidden="true">
    <button class="zoom-close" id="zoom-close" type="button">CLOSE</button>
    <img id="zoom-image" alt="Enlarged PixelPrix picture" />
  </div>

  <script>
    (function () {
      "use strict";

      function setRealViewportHeight() {
        document.documentElement.style.setProperty("--pxp-vh", window.innerHeight + "px");
      }

      setRealViewportHeight();

      window.addEventListener("resize", setRealViewportHeight);
      window.addEventListener("orientationchange", function () {
        setTimeout(setRealViewportHeight, 250);
      });

      const state = {
        phase: "intro",
        guide: "star",
        stream: null,
        roomPic: "",
        cleanPic: "",
        items: [],
        cleanupIndex: 0,
        targetCount: 5,
        phaseHistory: []
      };

      const el = {
        cameraShell: document.getElementById("camera-shell"),
        video: document.getElementById("camera-video"),
        canvas: document.getElementById("capture-canvas"),
        still: document.getElementById("still"),
        title: document.getElementById("title"),
        prompt: document.getElementById("prompt"),
        helper: document.getElementById("helper"),
        progress: document.getElementById("progress"),
        thumbs: document.getElementById("thumbs"),
        compare: document.getElementById("compare"),
        beforeCard: document.getElementById("before-card"),
        afterCard: document.getElementById("after-card"),
        choiceRow: document.getElementById("choice-row"),
        likeYes: document.getElementById("like-yes"),
        likeAgain: document.getElementById("like-again"),
        likeHome: document.getElementById("like-home"),
        mainButton: document.getElementById("main-button"),
        backGame: document.getElementById("back-game"),
        cameraTouch: document.getElementById("camera-touch"),
        cameraTouchBubble: document.getElementById("camera-touch-bubble"),
        zoomViewer: document.getElementById("zoom-viewer"),
        zoomImage: document.getElementById("zoom-image"),
        zoomClose: document.getElementById("zoom-close")
      };

      function loadGuide() {
        try {
          state.guide = localStorage.getItem("pixelprixGuide") || "star";
        } catch (error) {
          state.guide = "star";
        }
      }

      function speak(text) {
        try {
          if (!("speechSynthesis" in window)) {
            return;
          }

          if (state.guide === "voice") {
            return;
          }

          window.speechSynthesis.cancel();

          const voice = new SpeechSynthesisUtterance(text);
          voice.rate = 0.9;
          voice.pitch = state.guide === "robot" ? 0.85 : 1.12;

          window.speechSynthesis.speak(voice);
        } catch (error) {}
      }

      function beep() {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;

          if (!AudioContext) {
            return;
          }

          const ctx = new AudioContext();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = "square";
          osc.frequency.value = 720;
          gain.gain.value = 0.035;

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();

          setTimeout(function () {
            osc.stop();
            ctx.close();
          }, 90);
        } catch (error) {}
      }

      async function openCamera() {
        stopCamera();

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          el.helper.textContent = "Camera needs a browser with camera permission.";
          speak("Camera permission is needed.");
          return false;
        }

        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
              facingMode: { ideal: "environment" },
              width: { ideal: 1280 },
              height: { ideal: 720 }
            }
          });

          state.stream = stream;
          el.video.srcObject = stream;
          el.cameraShell.classList.add("live");
          setRealViewportHeight();
          return true;
        } catch (error) {
          el.helper.textContent = "Camera permission needed. Turn camera permission on, then try again.";
          speak("Camera permission needed.");
          setRealViewportHeight();
          return false;
        }
      }

      function stopCamera() {
        if (state.stream) {
          state.stream.getTracks().forEach(function (track) {
            track.stop();
          });
        }

        state.stream = null;
        el.video.srcObject = null;
        el.cameraShell.classList.remove("live");
      }

      function capturePic() {
        const width = el.video.videoWidth || 1280;
        const height = el.video.videoHeight || 720;

        el.canvas.width = width;
        el.canvas.height = height;

        const ctx = el.canvas.getContext("2d");
        ctx.drawImage(el.video, 0, 0, width, height);

        return el.canvas.toDataURL("image/jpeg", 0.86);
      }

      function setStill(pic) {
        if (!pic) {
          el.still.style.backgroundImage = "";
          return;
        }

        el.still.style.backgroundImage = "url('" + pic + "')";
      }

      function imageHtml(pic, alt) {
        return '<img src="' + pic + '" alt="' + alt + '" />';
      }

      function isCameraPhase() {
        return (
          state.phase === "room" ||
          state.phase === "items" ||
          state.phase === "after"
        );
      }

      function showCameraTouch(text) {
        if (!isCameraPhase()) {
          hideCameraTouch();
          return;
        }

        el.cameraTouchBubble.textContent = text || "Tap the screen when you see it.";
        el.cameraTouch.classList.add("show");
        el.cameraTouch.setAttribute("aria-hidden", "false");
      }

      function hideCameraTouch() {
        el.cameraTouch.classList.remove("show", "tap");
        el.cameraTouch.setAttribute("aria-hidden", "true");
      }

      function cameraTouchFeedback() {
        if (!isCameraPhase()) {
          return;
        }

        el.cameraTouch.classList.add("tap");
        beep();

        if (state.phase === "room") {
          el.cameraTouchBubble.textContent = "I see the room. Hold still.";
        }

        if (state.phase === "items") {
          el.cameraTouchBubble.textContent = "I see the treasure. Hold close.";
        }

        if (state.phase === "after") {
          el.cameraTouchBubble.textContent = "I see the clean picture. Hold still.";
        }

        window.setTimeout(function () {
          el.cameraTouch.classList.remove("tap");
        }, 180);
      }

      function openZoom(pic) {
        if (!pic) {
          return;
        }

        el.zoomImage.src = pic;
        el.zoomViewer.classList.add("show");
        el.zoomViewer.setAttribute("aria-hidden", "false");
      }

      function closeZoom() {
        el.zoomViewer.classList.remove("show");
        el.zoomViewer.setAttribute("aria-hidden", "true");
        el.zoomImage.removeAttribute("src");
      }

      function clearCompareClicks() {
        el.beforeCard.onclick = null;
        el.afterCard.onclick = null;
        el.beforeCard.classList.remove("has-pic");
        el.afterCard.classList.remove("has-pic");
      }

      function hideChoices() {
        el.choiceRow.classList.remove("show");
      }

      function showChoices() {
        el.choiceRow.classList.add("show");
      }

      function renderDots() {
        const dots = el.progress.querySelectorAll(".dot");

        dots.forEach(function (dot, index) {
          dot.classList.remove("done", "now");

          if (index < state.items.length) {
            dot.classList.add("done");
          } else if (index === state.items.length && state.phase === "items") {
            dot.classList.add("now");
          }
        });

        if (state.phase === "cleanup") {
          dots.forEach(function (dot, index) {
            dot.classList.remove("done", "now");

            if (index < state.cleanupIndex) {
              dot.classList.add("done");
            } else if (index === state.cleanupIndex) {
              dot.classList.add("now");
            }
          });
        }

        if (
          state.phase === "done" ||
          state.phase === "difference" ||
          state.phase === "finish"
        ) {
          dots.forEach(function (dot) {
            dot.classList.add("done");
            dot.classList.remove("now");
          });
        }
      }

      function renderThumbs() {
        el.thumbs.innerHTML = "";

        for (let i = 0; i < state.targetCount; i += 1) {
          const box = document.createElement("div");
          box.className = "thumb";

          if (state.items[i] && state.items[i].pic) {
            box.classList.add("has-pic");
            box.innerHTML = imageHtml(state.items[i].pic, "Treasure " + (i + 1));

            box.addEventListener("click", function () {
              openZoom(state.items[i].pic);
            });
          } else {
            box.textContent = String(i + 1);
          }

          el.thumbs.appendChild(box);
        }
      }

      function setButton(mainText) {
        el.mainButton.textContent = mainText;
        setTimeout(setRealViewportHeight, 60);
      }

      function setPhase(phase, options) {
        options = options || {};

        if (!options.skipHistory && state.phase && state.phase !== phase) {
          state.phaseHistory.push(state.phase);
        }

        state.phase = phase;
        el.compare.classList.remove("show");
        hideChoices();
        hideCameraTouch();
        clearCompareClicks();

        if (phase === "intro") {
          stopCamera();
          setStill("");
          el.title.textContent = "PixelPrix";
          el.prompt.textContent = "Let’s make a Tiny Tidy adventure.";
          el.helper.textContent = "Open the camera. Take one room picture. Then we find five treasures.";
          setButton("OPEN CAMERA");
        }

        if (phase === "room") {
          el.title.textContent = "Game Board";
          el.prompt.textContent = "Stand back. Take one big room picture.";
          el.helper.textContent = "Tap the screen when the room is ready. Then press TAKE ROOM PIC.";
          showCameraTouch("Tap the screen when the room is ready.");
          setButton("TAKE ROOM PIC");
        }

        if (phase === "tiny") {
          stopCamera();
          setStill(state.roomPic);
          el.title.textContent = "Tiny Tidy";
          el.prompt.textContent = "Five treasures today.";
          el.helper.textContent = "Now we take five close-up pictures. One treasure at a time.";
          setButton("START TINY TIDY");
        }

        if (phase === "items") {
          el.title.textContent = "Treasure " + (state.items.length + 1);
          el.prompt.textContent = "Point close. Take the treasure picture.";
          el.helper.textContent = "Tap the screen when you see the treasure. Then press TAKE TREASURE PIC.";
          showCameraTouch("Tap the screen when you see the treasure.");
          setButton("TAKE TREASURE PIC");
        }

        if (phase === "ready") {
          stopCamera();
          setStill(state.roomPic);
          el.title.textContent = "Game Ready";
          el.prompt.textContent = "Your five treasures are ready.";
          el.helper.textContent = "Tap a treasure picture to make it bigger. Then start the clean-up hunt.";
          setButton("PLAY CLEAN UP");
        }

        if (phase === "cleanup") {
          stopCamera();

          const item = state.items[state.cleanupIndex];

          if (item && item.pic) {
            setStill(item.pic);
          }

          el.title.textContent = "Find It";
          el.prompt.textContent = "Find treasure " + (state.cleanupIndex + 1) + ". Move it home.";
          el.helper.textContent = "When it is picked up, tap FOUND IT. Tap the picture below to zoom.";
          setButton("FOUND IT");
        }

        if (phase === "after-ready") {
          stopCamera();
          setStill(state.roomPic);
          el.title.textContent = "Find the Difference?";
          el.prompt.textContent = "One last clean picture makes the before-and-after game.";
          el.helper.textContent = "This picture is for Spot the Difference.";
          setButton("OPEN CAMERA");
        }

        if (phase === "after") {
          el.title.textContent = "Clean Picture";
          el.prompt.textContent = "Take the clean or treat-ready picture.";
          el.helper.textContent = "Tap the screen when the clean picture is ready. Then press TAKE CLEAN PIC.";
          showCameraTouch("Tap the screen when the clean picture is ready.");
          setButton("TAKE CLEAN PIC");
        }

        if (phase === "difference") {
          stopCamera();
          setStill(state.cleanPic);
          el.title.textContent = "Spot the Difference";
          el.prompt.textContent = "Look what changed.";
          el.helper.textContent = "Tap Before or After to make it bigger.";
          el.compare.classList.add("show");
          el.beforeCard.classList.add("has-pic");
          el.afterCard.classList.add("has-pic");
          el.beforeCard.innerHTML = imageHtml(state.roomPic, "Before room");
          el.afterCard.innerHTML = imageHtml(state.cleanPic, "After room");

          el.beforeCard.onclick = function () {
            openZoom(state.roomPic);
          };

          el.afterCard.onclick = function () {
            openZoom(state.cleanPic);
          };

          setButton("I SEE IT");
        }

        if (phase === "done") {
          stopCamera();
          setStill(state.cleanPic || state.roomPic);
          el.title.textContent = "Adventure Done";
          el.prompt.textContent = "You made a clean-up story.";
          el.helper.textContent = "Before, treasures, cleanup, and after. That is the whole adventure.";
          setButton("SHOW FINISH");
        }

        if (phase === "finish") {
          stopCamera();
          setStill(state.cleanPic || state.roomPic);
          el.title.textContent = "PixelPrix Complete";
          el.prompt.textContent = "Did you like this?";
          el.helper.textContent = "Choose what happens next.";
          showChoices();
          setButton("PLAY AGAIN");
        }

        renderDots();
        renderThumbs();
        setRealViewportHeight();
      }

      async function mainAction() {
        if (state.phase === "intro") {
          const ok = await openCamera();

          if (ok) {
            setPhase("room");
            speak("Stand back. Take one big room picture.");
          }

          return;
        }

        if (state.phase === "room") {
          state.roomPic = capturePic();
          setStill(state.roomPic);
          beep();
          speak("Great. That is the game board.");
          setPhase("tiny");
          return;
        }

        if (state.phase === "tiny") {
          const ok = await openCamera();

          if (ok) {
            state.items = [];
            setPhase("items");
            speak("Treasure one. Point close.");
          }

          return;
        }

        if (state.phase === "items") {
          const pic = capturePic();

          state.items.push({
            pic: pic,
            done: false
          });

          beep();

          if (state.items.length >= state.targetCount) {
            speak("Five treasures ready.");
            setPhase("ready");
            return;
          }

          speak("Got it. Next treasure.");
          setPhase("items");
          return;
        }

        if (state.phase === "ready") {
          state.cleanupIndex = 0;
          setPhase("cleanup");
          speak("Find treasure one.");
          return;
        }

        if (state.phase === "cleanup") {
          state.cleanupIndex += 1;
          beep();

          if (state.cleanupIndex >= state.items.length) {
            speak("Clean up done. Want to find the difference?");
            setPhase("after-ready");
            return;
          }

          speak("Next treasure.");
          setPhase("cleanup");
          return;
        }

        if (state.phase === "after-ready") {
          const ok = await openCamera();

          if (ok) {
            setPhase("after");
            speak("Take the clean picture.");
          }

          return;
        }

        if (state.phase === "after") {
          state.cleanPic = capturePic();
          beep();
          speak("Clean picture ready.");
          setPhase("difference");
          return;
        }

        if (state.phase === "difference") {
          speak("Great job. Adventure done.");
          setPhase("done");
          return;
        }

        if (state.phase === "done") {
          speak("Did you like this?");
          setPhase("finish");
          return;
        }

        if (state.phase === "finish") {
          resetGame();
        }
      }

      function goBack(event) {
        event.preventDefault();

        if (state.phase === "intro") {
          window.location.href = "pixelprix.html";
          return;
        }

        if (state.phase === "items" && state.items.length > 0) {
          state.items.pop();
          setPhase("items", { skipHistory: true });
          speak("Back one treasure.");
          return;
        }

        if (state.phase === "cleanup" && state.cleanupIndex > 0) {
          state.cleanupIndex -= 1;
          setPhase("cleanup", { skipHistory: true });
          speak("Back one treasure.");
          return;
        }

        const previous = state.phaseHistory.pop();

        if (previous) {
          setPhase(previous, { skipHistory: true });
          speak("Back.");
          return;
        }

        window.location.href = "pixelprix.html";
      }

      function resetGame() {
        stopCamera();

        state.roomPic = "";
        state.cleanPic = "";
        state.items = [];
        state.cleanupIndex = 0;
        state.phaseHistory = [];

        setPhase("intro", { skipHistory: true });
      }

      function likeYes() {
        beep();
        el.prompt.textContent = "Yes! PixelPrix liked your clean-up story too.";
        el.helper.textContent = "Tap PLAY AGAIN when you are ready.";
        speak("Yes. Great job.");
      }

      function goHome() {
        window.location.href = "pixelprix.html";
      }

      el.backGame.addEventListener("click", goBack);
      el.mainButton.addEventListener("click", mainAction);
      el.cameraTouch.addEventListener("click", cameraTouchFeedback);

      el.zoomClose.addEventListener("click", closeZoom);

      el.zoomViewer.addEventListener("click", function (event) {
        if (event.target === el.zoomViewer) {
          closeZoom();
        }
      });

      el.likeYes.addEventListener("click", likeYes);
      el.likeAgain.addEventListener("click", resetGame);
      el.likeHome.addEventListener("click", goHome);

      window.addEventListener("pagehide", stopCamera);

      loadGuide();
      setPhase("intro", { skipHistory: true });
    })();
  </script>

  <script src="js/pixelprix-voice.js"></script>
</body>
</html>
