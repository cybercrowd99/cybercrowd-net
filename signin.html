<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberCrowd Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      width: 100vw;

      background-image: url('https://pub-081cb3c244be4e09b5e76012567a0b0a.r2.dev/Registry-Image/Register_login_image.png');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;

      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .panel {
      width: 100%;
      max-width: 420px;
      background: rgba(0, 0, 0, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 18px;
      padding: 32px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
      color: #e9fff7;
    }

    h1 {
      color: #0aff9d;
      font-size: 1.9rem;
      margin-bottom: 8px;
      letter-spacing: 1px;
      text-align: center;
    }

    .subtitle {
      color: #b6ffe4;
      font-size: 0.95rem;
      margin-bottom: 24px;
      text-align: center;
    }

    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 6px;
      color: #c9fff0;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #1f3b34;
      background: rgba(3, 15, 12, 0.9);
      color: #e9fff7;
      font-size: 0.95rem;
      margin-bottom: 16px;
      outline: none;
      transition: border 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      border-color: #0aff9d;
      box-shadow: 0 0 0 1px #0aff9d33;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      font-size: 0.85rem;
      color: #a8e9d4;
    }

    .row input[type="checkbox"] {
      width: auto;
      margin-right: 6px;
    }

    .row .left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .row a {
      color: #0aff9d;
      text-decoration: none;
      font-size: 0.85rem;
    }

    .row a:hover {
      text-decoration: underline;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: #0aff9d;
      color: #000;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
      margin-bottom: 10px;
    }

    .btn:hover {
      background: #4dffbe;
      transform: translateY(-1px);
    }

    .secondary {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #0aff9d;
      background: transparent;
      color: #0aff9d;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease, transform 0.1s ease;
      margin-bottom: 6px;
    }

    .secondary:hover {
      background: #0aff9d;
      color: #000;
      transform: translateY(-1px);
    }

    .footer-links {
      text-align: center;
      margin-top: 10px;
      font-size: 0.85rem;
    }

    .footer-links a {
      color: #0aff9d;
      text-decoration: none;
      margin: 0 4px;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      body {
        padding: 0 10px;
      }
      .panel {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="panel">
    <h1>CyberCrowd Login</h1>
    <div class="subtitle">Authenticate to access the vault layer.</div>

    <form>
      <label for="email">Email or Handle</label>
      <input type="text" id="email" name="email" autocomplete="username">

      <label for="password">Passphrase</label>
      <input type="password" id="password" name="password" autocomplete="current-password">

      <div class="row">
        <div class="left">
          <input type="checkbox" id="remember">
          <label for="remember" style="margin:0;">Remember this node</label>
        </div>
        <a href="#">Forgot key?</a>
      </div>

      <button type="submit" class="btn">Enter Vault</button>
      <button type="button" class="secondary" onclick="window.location.href='register.html'">
        Create New Access
      </button>
    </form>

    <div class="footer-links">
      <a href="index.html">Return to Home</a> •
      <a href="#">Terms</a> •
      <a href="#">Privacy</a>
    </div>
  </div>

</body>
</html>
