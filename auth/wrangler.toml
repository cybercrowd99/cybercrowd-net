name = "cybercrowd-auth"
main = "src/router.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "VERIFY_KV"
id = "62a6c667bfc94d43aaf6936bc2502750"

[[d1_databases]]
binding = "DB"
database_id = "ff39e37c-391a-4898-9db5-d2118a141c07"

[[routes]]
pattern = "https://cybercrowd.net/api/auth/verify*"
script = "cybercrowd-auth"

[[routes]]
pattern = "https://cybercrowd.net/api/auth/send-verification"
script = "cybercrowd-auth"
