<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cybercrowd Continuity Events</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
}

#stage {
    min-height: 100vh;
    padding: 24px;
    box-sizing: border-box;
    background:
    radial-gradient(circle at center, rgba(0,255,255,0.10), transparent 42%),
    #050505;
}

#title {
    color: #00ffff;
    font-size: 34px;
    letter-spacing: 4px;
    text-align: center;
}

#subtitle {
    text-align: center;
    opacity: 0.75;
    margin-top: 8px;
    margin-bottom: 30px;
}

.section {
    max-width: 1100px;
    margin: 0 auto 22px auto;
    border-radius: 22px;
    border: 1px solid rgba(0,255,255,0.30);
    background: rgba(10,10,10,0.92);
    padding: 22px;
    box-sizing: border-box;
}

.sectionTitle {
    color: #00ffff;
    font-size: 22px;
    margin-bottom: 16px;
}

.buttonGrid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
}

button {
    padding: 13px;
    border: none;
    border-radius: 14px;
    background: #00ffff;
    color: black;
    font-weight: bold;
    cursor: pointer;
}

button.warning {
    background: #ffaa00;
    color: black;
}

button.critical {
    background: #ff3355;
    color: white;
}

.eventItem {
    margin-top: 12px;
    padding: 14px;
    border-radius: 14px;
    background: rgba(0,255,255,0.06);
    border: 1px solid rgba(0,255,255,0.18);
    line-height: 1.5;
}

.eventType {
    color: #00ffaa;
    font-size: 13px;
    letter-spacing: 1px;
}

.eventSeverity {
    margin-top: 6px;
    font-size: 12px;
    letter-spacing: 1px;
}

.severity-info {
    color: #00ffaa;
}

.severity-warning {
    color: #ffaa00;
}

.severity-critical {
    color: #ff3355;
}

.eventMeta {
    opacity: 0.78;
    font-size: 13px;
    margin-top: 6px;
}

#footer {
    text-align: center;
    margin-top: 30px;
    opacity: 0.55;
    font-size: 12px;
    letter-spacing: 2px;
}
</style>
</head>

<body>

<div id="stage">

<div id="title">
CONTINUITY EVENTS
</div>

<div id="subtitle">
Live API continuity and resilience behavior testing.
</div>

<div class="section">

<div class="sectionTitle">
Simulate Continuity Events
</div>

<div class="buttonGrid">

<button onclick="simulateEvent('continuity_mode_enabled')">
Enable Continuity Mode
</button>

<button onclick="simulateEvent('continuity_mode_disabled')">
Disable Continuity Mode
</button>

<button class="warning" onclick="simulateEvent('fallback_surface_activated')">
Activate Fallback Surface
</button>

<button onclick="simulateEvent('fallback_surface_deactivated')">
Deactivate Fallback Surface
</button>

<button onclick="simulateEvent('status_only_mode_enabled')">
Enable Status-Only Mode
</button>

<button onclick="simulateEvent('continuity_broadcast_sent')">
Send Continuity Broadcast
</button>

<button class="warning" onclick="simulateEvent('continuity_recovery_started')">
Start Recovery
</button>

<button onclick="simulateEvent('continuity_recovery_completed')">
Complete Recovery
</button>

<button onclick="simulateEvent('cross_domain_sync_attempt')">
Cross-Domain Sync
</button>

<button class="critical" onclick="simulateEvent('continuity_fault_detected')">
Continuity Fault
</button>

<button class="critical" onclick="simulateEvent('unauthorized_failover_attempt')">
Unauthorized Failover
</button>

<button class="critical" onclick="clearEvents()">
Clear Continuity Events
</button>

</div>

</div>

<div class="section">

<div class="sectionTitle">
Live Continuity Event Trail
</div>

<div id="eventList">
Loading...
</div>

</div>

<div id="footer">
CYBERCROWD CONTINUITY EVENTS API PANEL V2
</div>

</div>

<script>
const eventList = document.getElementById("eventList");

async function simulateEvent(eventType) {
    try {
        const response =
        await fetch(
            "/api/continuity-events/simulate/" +
            eventType
        );

        const result =
        await response.json();

        if (!result.success) {
            alert("Blocked: " + result.error);
        }

        loadEvents();

    } catch (err) {
        alert("Continuity event simulation failed.");
    }
}

async function clearEvents() {
    try {
        await fetch(
            "/api/continuity-events/clear"
        );

        loadEvents();

    } catch (err) {
        alert("Clear request failed.");
    }
}

async function loadEvents() {
    try {
        const response =
        await fetch(
            "/api/continuity-events"
        );

        const data =
        await response.json();

        if (
            !data.events ||
            data.events.length === 0
        ) {
            eventList.innerHTML =
            "No continuity events recorded.";

            return;
        }

        eventList.innerHTML = "";

        data.events
        .slice()
        .reverse()
        .forEach((event) => {

            const item =
            document.createElement("div");

            item.className =
            "eventItem";

            item.innerHTML =
                "<div class='eventType'>" +
                event.type +
                "</div>" +

                "<div>" +
                event.description +
                "</div>" +

                "<div class='eventSeverity severity-" +
                event.severity +
                "'>" +
                "SEVERITY: " +
                event.severity.toUpperCase() +
                "</div>" +

                "<div class='eventMeta'>" +
                "Category: " +
                event.category +
                "</div>" +

                "<div class='eventMeta'>" +
                "Time: " +
                event.timestamp +
                "</div>" +

                "<div class='eventMeta'>" +
                "ID: " +
                event.id +
                "</div>";

            eventList.appendChild(item);
        });

    } catch (err) {
        eventList.innerHTML =
        "Continuity event API unavailable.";
    }
}

loadEvents();

setInterval(
    loadEvents,
    5000
);
</script>

</body>
</html>
