[[r2_buckets]]
binding = "LEDGER_EVENTS"
bucket_name = "cybercrowd-ledger-events"

[[r2_buckets]]
binding = "REPLAY"
bucket_name = "cybercrowd-replay"

[[r2_buckets]]
binding = "DEADLETTER"
bucket_name = "cybercrowd-deadletter"

[[r2_buckets]]
binding = "ARCHIVE"
bucket_name = "cybercrowd-archive"

[[r2_buckets]]
binding = "LINEAGE"
