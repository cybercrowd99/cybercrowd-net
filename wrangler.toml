name = "cybercrowd-net"

main = "worker.js"

compatibility_date = "2026-05-09"

workers_dev = true

[assets]
directory = "./"

run_worker_first = true

exclude = [
  "node_modules/**",
  ".git/**",
  ".github/**",
  "*.log",
  "*.zip",
  "*.tar",
  "*.gz",
  "*.rar",
  "*.7z",
  "package.json",
  "package-lock.json",
  "wrangler.toml",
  "README.md",
  "LICENSE.md",
  "NOTICE.md",
  "**/*.mp4",
  "**/*.mov",
  "**/*.mkv",
  "**/*.avi",
  "**/*.psd",
  "**/*.blend",
  "**/*.iso",
  "**/*.bin"
]

[observability.logs]
enabled = true
