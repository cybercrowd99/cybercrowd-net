<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile Setup</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="profile-setup.css">
</head>

<body>

    <div id="profile-setup-surface" class="surface-root">

        <div class="panel">
            <h1>Profile Setup</h1>

            <label for="display-name">Display Name</label>
            <input id="display-name" type="text" placeholder="Enter your display name">

            <label>Choose Your Profile Picture</label>
            <div id="avatar-grid" class="avatar-grid" aria-label="Profile picture choices">
                <!-- profile-setup.js will populate profile picture choices here -->
            </div>

            <button id="save-profile-btn" class="save-btn">Save Profile</button>

            <div id="profile-status" class="status"></div>
        </div>

    </div>

    <script src="profile-setup.js"></script>
</body>
</html>
