<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberCrowd Access</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      width: 100vw;

      /* Your full-room museum image */
      background-image: url('full-room.jpg'); 
      background-size: cover;

      /* THIS is the change — center the case */
      background-position: center center;

      background-repeat: no-repeat;

      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding-right: 6%;
      font-family: Arial, sans-serif;
    }

    .panel {
      width: 100%;
      max-width: 420px;
      background: rgba(0, 0, 0, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 32px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
      text-align: center;
    }

    h1 {
      color: #0aff9d;
      font-size: 1.9rem;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    p {
      color: #b6ffe4;
      font-size: 1rem;
      margin-bottom: 25px;
    }

    .cta {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .btn {
      padding: 14px;
      border-radius: 8px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      border: none;
      transition: 0.2s ease;
    }

    .trial {
      background: #0aff9d;
      color: #000;
    }

    .trial:hover {
      background: #4dffbe;
    }

    .login {
      background: transparent;
      border: 2px solid #0aff9d;
      color: #0aff9d;
    }

    .login:hover {
      background: #0aff9d;
      color: #000;
    }

    a {
      color: #0aff9d;
      text-decoration: none;
      display: inline-block;
      margin-top: 20px;
      font-size: 0.9rem;
    }

    @media (max-width: 768px) {
      body {
        justify-content: center;
        padding-right: 0;
      }
      .panel {
        width: 90%;
      }
    }
  </style>
</head>

<body>

  <div class="panel">
    <h1>CyberCrowd Access</h1>
    <p>The artifact is sealed. Unlock the vault to continue.</p>

    <div class="cta">
      <button class="btn trial">Start Free Trial</button>
      <button class="btn login">Login / Register</button>
    </div>

    <a href="index.html">Return to Home</a>
  </div>

</body>
</html>
