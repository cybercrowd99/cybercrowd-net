<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberCrowd Access</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #0aff9d;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .wrap {
      text-align: center;
      max-width: 420px;
      padding: 20px;
      border: 2px solid #0aff9d;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.7);
    }

    h1 {
      margin-bottom: 10px;
      font-size: 2rem;
      letter-spacing: 1px;
    }

    p {
      margin-bottom: 25px;
      font-size: 1rem;
      color: #b6ffe4;
    }

    .cta {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .btn {
      padding: 14px;
      border-radius: 8px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      border: none;
      transition: 0.2s ease;
    }

    .trial {
      background: #0aff9d;
      color: #000;
    }

    .trial:hover {
      background: #4dffbe;
    }

    .login {
      background: transparent;
      border: 2px solid #0aff9d;
      color: #0aff9d;
    }

    .login:hover {
      background: #0aff9d;
      color: #000;
    }

    a {
      color: #0aff9d;
      text-decoration: none;
      font-size: 1rem;
      margin-top: 20px;
      display: inline-block;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>CyberCrowd Access</h1>
    <p>Choose your entry lane. Free trial for new users. Login/Register for returning members.</p>

    <div class="cta">
      <button class="btn trial">Start Free Trial</button>
      <button class="btn login">Login / Register</button>
    </div>

    <a href="index.html">Return to Home</a>
  </div>
</body>
</html>
