<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SECURITY GATE</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        background:#000;
        color:#e5e5e5;
        font-family:Arial, sans-serif;
        margin:0;
        padding:0;
        text-align:center;
    }

    .wrap {
        padding:40px 20px;
        max-width:420px;
        margin:auto;
    }

    h1 {
        font-size:32px;
        margin-bottom:10px;
        letter-spacing:1px;
    }

    .sub {
        font-size:14px;
        opacity:0.8;
        margin-bottom:30px;
        line-height:1.5em;
    }

    input {
        width:100%;
        padding:14px;
        border:none;
        border-radius:6px;
        margin-bottom:20px;
        font-size:16px;
        box-sizing:border-box;
    }

    button {
        width:100%;
        padding:16px;
        background:#00eaff;
        border:none;
        border-radius:6px;
        font-size:18px;
        font-weight:bold;
        cursor:pointer;
    }

    button:disabled {
        opacity:0.55;
        cursor:not-allowed;
    }

    .status {
        margin-top:20px;
        color:#ff4444;
        font-size:14px;
        font-weight:bold;
        min-height:22px;
        line-height:1.5em;
    }

    .plugbox {
        margin-top:40px;
        text-align:left;
        font-family:monospace;
        font-size:13px;
        background:#111;
        padding:15px;
        border-radius:6px;
        line-height:1.4em;
        white-space:pre-line;
        word-break:break-word;
    }

    footer {
        margin-top:40px;
        font-size:12px;
        opacity:0.6;
    }

    .hidden-field {
        display:none;
    }
</style>
</head>

<body>

<div class="wrap">

    <h1>SECURITY GATE</h1>

    <div class="sub">
        Enter your email. One live entry link is sent.<br>
        Click it once. The verified room opens.
    </div>

    <input id="email" type="email" placeholder="you@example.com" autocomplete="email">

    <input id="website" class="hidden-field" type="text" tabindex="-1" autocomplete="off">

    <button id="sendButton" onclick="sendLink()">SEND ENTRY LINK</button>

    <div id="status" class="status"></div>

    <div class="plugbox" id="plugtrace">config plug: worker auth lane active
email plug: waiting
redirect plug: next = /nav.html
session plug: pending email click
room plug: idle</div>

    <footer>
        PAGE2 WORKER SECURITY · RESEND EMAIL · COOKIE VERIFY
    </footer>

</div>

<script>
(function() {
    "use strict";

    const START_ENDPOINT = "/api/enrollment/start";
    const NEXT_PATH = "/nav.html";

    function setStatus(text, color) {
        const status = document.getElementById("status");
        status.innerHTML = text;
        status.style.color = color;
    }

    function setPlug(text) {
        document.getElementById("plugtrace").innerHTML = text;
    }

    function validEmail(value) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
    }

    window.sendLink = async function sendLink() {
        const emailInput = document.getElementById("email");
        const websiteInput = document.getElementById("website");
        const button = document.getElementById("sendButton");

        const email = emailInput.value.trim().toLowerCase();
        const website = websiteInput.value.trim();

        if (website) {
            setStatus("Entry request blocked.", "#ff4444");

            setPlug(
`config plug: worker auth lane active
email plug: FAILED - bot_field_triggered
redirect plug: next = ${NEXT_PATH}
session plug: waiting
room plug: idle`
            );

            return;
        }

        if (!email || !validEmail(email)) {
            setStatus("Valid email required.", "#ff4444");

            setPlug(
`config plug: worker auth lane active
email plug: FAILED - invalid_email
redirect plug: next = ${NEXT_PATH}
session plug: waiting
room plug: idle`
            );

            return;
        }

        button.disabled = true;
        button.innerHTML = "SENDING";

        setStatus("Sending live entry link...", "#00eaff");

        setPlug(
`config plug: worker auth lane active
email plug: posting to ${START_ENDPOINT}
redirect plug: next = ${NEXT_PATH}
session plug: pending email click
room plug: sealed`
        );

        try {
            const response = await fetch(
                START_ENDPOINT,
                {
                    method:"POST",
                    headers:{
                        "Content-Type":"application/json",
                        "Accept":"application/json"
                    },
                    body:JSON.stringify({
                        email:email,
                        tier:"visitor",
                        next:NEXT_PATH,
                        humanConfirmed:true,
                        human_confirmed:true
                    })
                }
            );

            const data = await response.json();

            button.disabled = false;
            button.innerHTML = "SEND ENTRY LINK";

            if (!response.ok || !data || data.success !== true) {
                const statusCode = data && data.status ? data.status : "request_failed";
                const message = data && data.message ? data.message : "Entry link failed.";

                setStatus(message, "#ff4444");

                setPlug(
`config plug: worker auth lane active
email plug: FAILED - ${statusCode}
redirect plug: next = ${NEXT_PATH}
session plug: waiting
room plug: idle`
                );

                return;
            }

            const delivery =
                data.emailDelivery ||
                data.status ||
                "link_dispatched";

            setStatus("Entry link sent. Check your inbox.", "#00ff99");

            setPlug(
`config plug: worker auth lane active
email plug: OK - ${delivery}
redirect plug: next = ${NEXT_PATH}
session plug: awaiting user click
room plug: sealed`
            );

        } catch(error) {
            button.disabled = false;
            button.innerHTML = "SEND ENTRY LINK";

            setStatus("Connection failed: " + error.message, "#ff4444");

            setPlug(
`config plug: worker auth lane active
email plug: FAILED - connection_error
redirect plug: next = ${NEXT_PATH}
session plug: waiting
room plug: idle`
            );
        }
    };
})();
</script>

</body>
</html>
