<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>CyberCrowd | Activate Identity</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
    }

    .setup-room {
      position: relative;
      width: min(100vw, calc(100vh * 1.7777778));
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
      isolation: isolate;
    }

    .setup-art {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center center;
      z-index: 1;
      pointer-events: none;
      user-select: none;
    }

    .setup-form {
      position: absolute;
      inset: 0;
      z-index: 50;
    }

    .air-input {
      position: absolute;
      border: 0;
      outline: 0;
      background: transparent;
      box-shadow: none;
      color: transparent;
      caret-color: rgba(115, 250, 255, 0.86);
      appearance: none;
      -webkit-appearance: none;
    }

    .air-input::selection {
      color: transparent;
      background: transparent;
    }

    .air-input:-webkit-autofill,
    .air-input:-webkit-autofill:hover,
    .air-input:-webkit-autofill:focus {
      -webkit-text-fill-color: transparent;
      transition: background-color 9999s ease-in-out 0s;
      box-shadow: 0 0 0 1000px transparent inset;
    }

    .welcome-layer {
      position: absolute;
      inset: 0;
      z-index: 18;
      pointer-events: none;
      opacity: 0;
      transition: opacity 500ms ease;
    }

    .welcome-layer.on {
      opacity: 1;
    }

    .welcome-ticker {
      position: absolute;
      left: 100%;
      top: 31.5%;
      white-space: nowrap;
      color: rgba(220, 255, 255, 0.92);
      font-size: clamp(13px, 1.35vw, 22px);
      letter-spacing: 0.42em;
      text-shadow:
        0 0 8px rgba(100, 245, 255, 0.9),
        0 0 18px rgba(100, 245, 255, 0.52),
        0 0 30px rgba(160, 95, 255, 0.22);
      animation: welcome-drag 4.8s ease-out forwards;
    }

    .welcome-email {
      position: absolute;
      left: 50%;
      top: 38.9%;
      width: 44%;
      height: 7.4%;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translate(-50%, -50%) translateX(-8%);
      color: rgba(220, 255, 255, 0.96);
      font-size: clamp(14px, 1.45vw, 23px);
      letter-spacing: 0.08em;
      text-align: center;
      text-shadow:
        0 0 8px rgba(100, 245, 255, 0.9),
        0 0 20px rgba(100, 245, 255, 0.55);
      opacity: 0;
      overflow: hidden;
      white-space: nowrap;
      animation: email-settle 1.45s ease-out forwards;
      animation-delay: 2.25s;
    }

    .welcome-status {
      position: absolute;
      left: 50%;
      top: 45.8%;
      transform: translate(-50%, -50%);
      color: rgba(116, 255, 174, 0.88);
      font-size: clamp(9px, 0.86vw, 14px);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      text-shadow:
        0 0 7px rgba(116, 255, 174, 0.84),
        0 0 18px rgba(116, 255, 174, 0.34);
      opacity: 0;
      animation: status-breathe 1.2s ease-out forwards;
      animation-delay: 3.35s;
    }

    @keyframes welcome-drag {
      0% {
        left: 100%;
        opacity: 0;
      }

      12% {
        opacity: 1;
      }

      72% {
        opacity: 1;
      }

      100% {
        left: 50%;
        transform: translateX(-50%);
        opacity: 0.46;
      }
    }

    @keyframes email-settle {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) translateX(-8%);
        filter: blur(5px);
      }

      55% {
        opacity: 1;
        transform: translate(-50%, -50%) translateX(1.4%);
        filter: blur(0);
      }

      100% {
        opacity: 1;
        transform: translate(-50%, -50%) translateX(0);
        filter: blur(0);
      }
    }

    @keyframes status-breathe {
      from {
        opacity: 0;
        transform: translate(-50%, -50%) translateY(6px);
      }

      to {
        opacity: 1;
        transform: translate(-50%, -50%) translateY(0);
      }
    }

    #pepperState {
      position: absolute;
      left: 50%;
      top: 38.9%;
      width: 44%;
      height: 7.4%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      opacity: 0;
    }

    #passwordInput,
    #passwordFloat {
      left: 50.5%;
      top: 54.2%;
      width: 34%;
      height: 7.4%;
      transform: translate(-50%, -50%);
    }

    #verifyInput,
    #verifyFloat {
      left: 49.8%;
      top: 69.3%;
      width: 34%;
      height: 7.4%;
      transform: translate(-50%, -50%);
    }

    #activateButton {
      position: absolute;
      left: 69.8%;
      top: 85.3%;
      width: 24%;
      height: 8.8%;
      transform: translate(-50%, -50%);
      border: 0;
      outline: 0;
      background: transparent;
      color: transparent;
      box-shadow: none;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }

    #activateButton:disabled {
      cursor: default;
    }

    .float-layer {
      position: absolute;
      inset: 0;
      z-index: 20;
      pointer-events: none;
    }

    .float-text {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(220, 255, 255, 0.94);
      font-size: clamp(14px, 1.55vw, 24px);
      letter-spacing: 0.1em;
      text-align: center;
      text-shadow:
        0 0 8px rgba(100, 245, 255, 0.9),
        0 0 18px rgba(100, 245, 255, 0.55),
        0 0 34px rgba(160, 95, 255, 0.22);
      opacity: 0;
      transform-origin: center center;
      transition:
        opacity 160ms ease,
        color 160ms ease,
        text-shadow 160ms ease;
      white-space: nowrap;
      overflow: hidden;
    }

    .float-text.on {
      opacity: 1;
    }

    .float-text.masked {
      letter-spacing: 0.18em;
    }

    .float-text.good {
      color: rgba(118, 255, 168, 0.96);
      text-shadow:
        0 0 8px rgba(118, 255, 168, 0.95),
        0 0 22px rgba(118, 255, 168, 0.5);
    }

    .float-text.bad {
      color: rgba(255, 92, 132, 0.96);
      text-shadow:
        0 0 8px rgba(255, 92, 132, 0.85),
        0 0 22px rgba(255, 92, 132, 0.45);
    }

    .circuit-layer {
      position: absolute;
      inset: 0;
      z-index: 16;
      pointer-events: none;
      opacity: 0;
    }

    .setup-room.circuit-live .circuit-layer {
      opacity: 1;
    }

    .circuit-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .circuit-trace {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
    }

    .circuit-trace.active {
      opacity: 1;
      animation: trace-on 1.15s ease-out forwards;
    }

    .circuit-trace.hot {
      filter:
        drop-shadow(0 0 5px currentColor)
        drop-shadow(0 0 11px currentColor);
    }

    @keyframes trace-on {
      from { stroke-dashoffset: 1000; }
      to { stroke-dashoffset: 0; }
    }

    .circuit-node {
      position: absolute;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.4);
      transition:
        opacity 240ms ease,
        transform 320ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .circuit-node.active {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .circuit-node.email {
      left: 50%;
      top: 38.9%;
      background: rgba(105, 245, 255, 0.95);
      box-shadow:
        0 0 10px rgba(105, 245, 255, 0.85),
        0 0 22px rgba(105, 245, 255, 0.36);
    }

    .circuit-node.password {
      left: 50.5%;
      top: 54.2%;
      background: rgba(255, 170, 0, 0.95);
      box-shadow:
        0 0 10px rgba(255, 170, 0, 0.78),
        0 0 22px rgba(255, 170, 0, 0.32);
    }

    .circuit-node.verify {
      left: 49.8%;
      top: 69.3%;
      background: rgba(255, 0, 102, 0.95);
      box-shadow:
        0 0 10px rgba(255, 0, 102, 0.75),
        0 0 22px rgba(255, 0, 102, 0.34);
    }

    .circuit-node.activate {
      left: 69.8%;
      top: 85.3%;
      background: rgba(118, 255, 168, 0.96);
      box-shadow:
        0 0 10px rgba(118, 255, 168, 0.82),
        0 0 22px rgba(118, 255, 168, 0.36);
    }

    .activation-lock {
      position: absolute;
      left: 69.8%;
      top: 85.3%;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid rgba(118, 255, 168, 0.86);
      background: radial-gradient(circle at 35% 35%, rgba(118, 255, 168, 0.94), rgba(0, 90, 52, 0.68));
      box-shadow:
        0 0 18px rgba(118, 255, 168, 0.85),
        0 0 42px rgba(118, 255, 168, 0.34);
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      transition: all 420ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .activation-lock.active {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .setup-room.locked::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 60;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 38.9%, rgba(105, 255, 164, 0.2), transparent 20%),
        radial-gradient(circle at 69.8% 85.3%, rgba(105, 245, 255, 0.14), transparent 24%);
      animation: lock-pulse 950ms ease-out forwards;
    }

    @keyframes lock-pulse {
      0% { opacity: 0; }
      30% { opacity: 1; }
      100% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .welcome-ticker,
      .welcome-email,
      .welcome-status,
      .circuit-trace.active,
      .setup-room.locked::after {
        animation: none;
      }

      .welcome-layer,
      .welcome-layer.on,
      .welcome-email,
      .welcome-status {
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>

<body>
  <main id="setupRoom" class="setup-room" aria-label="CyberCrowd activate identity room">
    <img
      class="setup-art"
      src="https://pub-081cb3c244be4e09b5e76012567a0b0a.r2.dev/Setup-html-image.png"
      alt=""
      aria-hidden="true"
    />

    <div id="welcomeLayer" class="welcome-layer" aria-hidden="true">
      <div class="welcome-ticker">W . E . L . C . O . M . E</div>
      <div id="welcomeEmail" class="welcome-email"></div>
      <div id="welcomeStatus" class="welcome-status">EMAIL ARRIVAL CONFIRMED</div>
    </div>

    <div id="pepperState" aria-hidden="true"></div>

    <div class="float-layer" aria-hidden="true">
      <div id="passwordFloat" class="float-text"></div>
      <div id="verifyFloat" class="float-text"></div>
    </div>

    <div id="circuitLayer" class="circuit-layer" aria-hidden="true">
      <svg class="circuit-svg" viewBox="0 0 800 600" preserveAspectRatio="none">
        <path
          class="circuit-trace"
          id="trace-email-password"
          d="M 400 233 L 404 325"
          stroke="#8ffcff"
          stroke-width="2.5"
        />

        <path
          class="circuit-trace"
          id="trace-password-verify"
          d="M 404 325 L 398 416"
          stroke="#ffaa00"
          stroke-width="2.3"
        />

        <path
          class="circuit-trace"
          id="trace-verify-activate"
          d="M 398 416 L 558 512"
          stroke="#ff0066"
          stroke-width="2.3"
        />

        <path
          class="circuit-trace"
          id="trace-activate-return"
          d="M 558 512 L 610 512 L 610 233 L 400 233"
          stroke="#76ffa8"
          stroke-width="2"
        />
      </svg>

      <div id="nodeEmail" class="circuit-node email"></div>
      <div id="nodePassword" class="circuit-node password"></div>
      <div id="nodeVerify" class="circuit-node verify"></div>
      <div id="nodeActivate" class="circuit-node activate"></div>
      <div id="activationLock" class="activation-lock"></div>
    </div>

    <form id="setupForm" class="setup-form" autocomplete="off">
      <input
        id="passwordInput"
        class="air-input"
        type="password"
        name="password"
        minlength="8"
        maxlength="19"
        required
        autocomplete="new-password"
        aria-label="New password"
      />

      <input
        id="verifyInput"
        class="air-input"
        type="password"
        name="confirmPassword"
        minlength="8"
        maxlength="19"
        required
        autocomplete="new-password"
        aria-label="Verify password"
      />

      <button
        id="activateButton"
        type="submit"
        aria-label="Activate Identity"
      ></button>
    </form>
  </main>

  <script>
    const setupRoom = document.getElementById("setupRoom");
    const setupForm = document.getElementById("setupForm");
    const passwordInput = document.getElementById("passwordInput");
    const verifyInput = document.getElementById("verifyInput");
    const activateButton = document.getElementById("activateButton");

    const passwordFloat = document.getElementById("passwordFloat");
    const verifyFloat = document.getElementById("verifyFloat");

    const welcomeLayer = document.getElementById("welcomeLayer");
    const welcomeEmail = document.getElementById("welcomeEmail");
    const welcomeStatus = document.getElementById("welcomeStatus");

    const params = new URLSearchParams(window.location.search);
    const setupToken = params.get("token") || params.get("setup") || "";

    let passwordMaskTimer = null;
    let verifyMaskTimer = null;
    let passwordRevealed = false;
    let verifyRevealed = false;
    let verifiedEmail = "";

    function safeEmail(value) {
      return String(value || "")
        .replace(/[<>"'`]/g, "")
        .trim()
        .slice(0, 120);
    }

    function showWelcome(email) {
      verifiedEmail = safeEmail(email);

      if (!verifiedEmail) {
        welcomeEmail.textContent = "EMAIL ARRIVAL CONFIRMED";
        welcomeStatus.textContent = "SETUP TOKEN ACCEPTED";
      } else {
        welcomeEmail.textContent = verifiedEmail;
        welcomeStatus.textContent = "EMAIL ARRIVAL CONFIRMED";
      }

      welcomeLayer.classList.add("on");

      setTimeout(() => {
        document.getElementById("nodeEmail").classList.add("active");
      }, 3500);
    }

    async function loadSetupState() {
      if (!setupToken) {
        welcomeEmail.textContent = "SETUP TOKEN MISSING";
        welcomeStatus.textContent = "RETURN TO EMAIL LINK";
        welcomeLayer.classList.add("on");
        return;
      }

      try {
        const response = await fetch("/api/auth/setup-state", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            token: setupToken
          })
        });

        const result = await response.json().catch(() => ({}));

        if (!response.ok || result.ok === false || result.success === false) {
          throw new Error(result.error || "setup_state_failed");
        }

        showWelcome(result.email || result.ownerEmail || "");
      } catch (error) {
        welcomeEmail.textContent = "EMAIL ARRIVAL PENDING";
        welcomeStatus.textContent = "SETUP TOKEN NOT CONFIRMED";
        welcomeLayer.classList.add("on");
      }
    }

    function maskedValue(value) {
      return "•".repeat(Math.min(value.length, 19));
    }

    function renderValue(input, target, revealed, stateClass) {
      const value = input.value.slice(0, 19);

      if (!value) {
        target.textContent = "";
        target.className = "float-text";
        return;
      }

      target.textContent = revealed ? value : maskedValue(value);
      target.className = revealed
        ? `float-text on ${stateClass || ""}`.trim()
        : `float-text on masked ${stateClass || ""}`.trim();
    }

    function revealThenMask(input, target, lane) {
      if (lane === "password") {
        passwordRevealed = true;
        window.clearTimeout(passwordMaskTimer);
        renderValue(input, target, true, "");
        passwordMaskTimer = window.setTimeout(() => {
          passwordRevealed = false;
          renderValue(input, target, false, "");
        }, 1200);
        return;
      }

      verifyRevealed = true;
      window.clearTimeout(verifyMaskTimer);
      renderValue(input, target, true, verifyStateClass());
      verifyMaskTimer = window.setTimeout(() => {
        verifyRevealed = false;
        renderValue(input, target, false, verifyStateClass());
      }, 1200);
    }

    function verifyStateClass() {
      if (!verifyInput.value) {
        return "";
      }

      return passwordInput.value === verifyInput.value ? "good" : "bad";
    }

    function renderVerify() {
      renderValue(verifyInput, verifyFloat, verifyRevealed, verifyStateClass());
    }

    function resetCircuit() {
      setupRoom.classList.remove("circuit-live", "locked");

      document.querySelectorAll(".circuit-trace").forEach((trace) => {
        trace.classList.remove("active", "hot");
      });

      document.querySelectorAll(".circuit-node").forEach((node) => {
        node.classList.remove("active");
      });

      document.getElementById("activationLock").classList.remove("active");
    }

    function startIdentityCircuit() {
      resetCircuit();

      void setupRoom.offsetWidth;
      setupRoom.classList.add("circuit-live");

      const sequence = [
        { ids: ["nodeEmail", "trace-email-password"], delay: 0 },
        { ids: ["nodePassword", "trace-password-verify"], delay: 650 },
        { ids: ["nodeVerify", "trace-verify-activate"], delay: 1250 },
        { ids: ["nodeActivate", "trace-activate-return"], delay: 1850 },
        { ids: ["activationLock"], delay: 2550 }
      ];

      sequence.forEach((step) => {
        setTimeout(() => {
          step.ids.forEach((id) => {
            const el = document.getElementById(id);
            if (!el) return;

            el.classList.add("active");

            if (el.classList.contains("circuit-trace")) {
              setTimeout(() => el.classList.add("hot"), 850);
            }
          });
        }, step.delay);
      });
    }

    function lockIdentityCircuit() {
      setupRoom.classList.add("locked");
    }

    function failIdentityCircuit() {
      resetCircuit();
      verifyFloat.className = "float-text on masked bad";
    }

    function holdReveal(input, target, lane) {
      if (lane === "password") {
        window.clearTimeout(passwordMaskTimer);
        passwordRevealed = true;
        renderValue(input, target, true, "");
        return;
      }

      window.clearTimeout(verifyMaskTimer);
      verifyRevealed = true;
      renderValue(input, target, true, verifyStateClass());
    }

    function releaseReveal(input, target, lane) {
      if (lane === "password") {
        passwordRevealed = false;
        renderValue(input, target, false, "");
        return;
      }

      verifyRevealed = false;
      renderValue(input, target, false, verifyStateClass());
    }

    passwordInput.addEventListener("input", () => {
      revealThenMask(passwordInput, passwordFloat, "password");
      renderVerify();
    });

    verifyInput.addEventListener("input", () => {
      revealThenMask(verifyInput, verifyFloat, "verify");
    });

    passwordInput.addEventListener("pointerdown", () => {
      holdReveal(passwordInput, passwordFloat, "password");
    });

    passwordInput.addEventListener("pointerup", () => {
      releaseReveal(passwordInput, passwordFloat, "password");
    });

    passwordInput.addEventListener("pointercancel", () => {
      releaseReveal(passwordInput, passwordFloat, "password");
    });

    verifyInput.addEventListener("pointerdown", () => {
      holdReveal(verifyInput, verifyFloat, "verify");
    });

    verifyInput.addEventListener("pointerup", () => {
      releaseReveal(verifyInput, verifyFloat, "verify");
    });

    verifyInput.addEventListener("pointercancel", () => {
      releaseReveal(verifyInput, verifyFloat, "verify");
    });

    setupForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const password = passwordInput.value;
      const confirmPassword = verifyInput.value;

      if (!setupToken) {
        welcomeStatus.textContent = "RETURN TO EMAIL LINK";
        return;
      }

      if (password.length < 8) {
        passwordFloat.className = "float-text on masked bad";
        return;
      }

      if (password !== confirmPassword) {
        verifyFloat.className = "float-text on masked bad";
        return;
      }

      activateButton.disabled = true;
      startIdentityCircuit();

      try {
        const response = await fetch("/api/auth/set-password", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            token: setupToken,
            password
          })
        });

        const result = await response.json().catch(() => ({}));

        if (!response.ok || result.ok === false || result.success === false) {
          throw new Error(result.error || "password_setup_failed");
        }

        setTimeout(() => {
          lockIdentityCircuit();
        }, 2800);

        setTimeout(() => {
          window.location.href = result.redirect || "/dashboard-surface.html";
        }, 3900);
      } catch (error) {
        activateButton.disabled = false;

        setTimeout(() => {
          failIdentityCircuit();
        }, 900);
      }
    });

    loadSetupState();
  </script>
</body>
</html>
