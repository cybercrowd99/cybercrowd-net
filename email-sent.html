<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Check Your Email | CyberCrowd</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --glass-card: rgba(238, 248, 242, 0.18);
      --glass-edge: rgba(214, 242, 232, 0.78);
      --glass-shine: rgba(255, 255, 255, 0.42);
      --ink: #eaffff;
      --cyan: #00ffff;
      --mint: #00ffaa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% 20%, rgba(0,255,255,.18), transparent 34%),
        linear-gradient(135deg, #020409, #07131a 55%, #020409);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.22);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .email-sent-card {
      width: min(92vw, 520px);
      padding: 34px 34px 30px;
      text-align: center;
      border-radius: 28px;
      color: white;
      background: var(--glass-card);
      border: 1px solid var(--glass-edge);
      box-shadow:
        0 0 0 1px rgba(255,255,255,.14) inset,
        0 24px 80px rgba(0,0,0,.46),
        0 0 42px rgba(0,255,255,.18);
      backdrop-filter: blur(18px) saturate(150%);
      -webkit-backdrop-filter: blur(18px) saturate(150%);
      transform: translateX(-120vw) rotate(-8deg) scale(.84);
      animation: doormanWhoosh .72s cubic-bezier(.15,.9,.2,1.1) forwards;
    }

    .email-sent-card::before {
      content: "";
      position: absolute;
      inset: 14px 18px auto 18px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--glass-shine), transparent);
      opacity: .9;
    }

    h1 {
      margin: 0 0 14px;
      letter-spacing: 2px;
      color: var(--cyan);
      text-shadow: 0 0 18px rgba(0,255,255,.42);
    }

    p {
      margin: 0;
      line-height: 1.6;
      opacity: .9;
      font-size: 16px;
    }

    .ok-btn {
      margin-top: 24px;
      padding: 13px 24px;
      border: 0;
      border-radius: 16px;
      background: linear-gradient(90deg, var(--cyan), var(--mint));
      color: #001212;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(0,255,200,.2);
    }

    @keyframes doormanWhoosh {
      0% {
        transform: translateX(-120vw) rotate(-8deg) scale(.84);
        opacity: 0;
      }

      68% {
        transform: translateX(2vw) rotate(1deg) scale(1.03);
        opacity: 1;
      }

      100% {
        transform: translateX(0) rotate(0deg) scale(1);
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <!-- CyberCrowd Email Sent Room – Visual Surface Only
       Owns: forced glass notice, whoosh, check-email message.
       Owns NOT: tokens, KV, sessions, cookies, Turnstile, verification, email sending.
  -->

  <main class="stage">
    <section class="email-sent-card" aria-live="polite">
      <h1>Check Your Email</h1>
      <p>Your CyberCrowd verification link is on the way.</p>
      <button class="ok-btn" id="email-sent-close">OK</button>
    </section>
  </main>

  <audio id="email-sent-whoosh" src="/audio/whoosh.mp3" preload="auto"></audio>

  <script>
    const whoosh = document.getElementById("email-sent-whoosh");
    const closeBtn = document.getElementById("email-sent-close");

    window.addEventListener("load", () => {
      if (whoosh) {
        try {
          whoosh.currentTime = 0;
          whoosh.play();
        } catch (_) {
          // Audio failure is non-critical; visual message still owns the room.
        }
      }
    });

    closeBtn?.addEventListener("click", () => {
      window.location.href = "/";
    });
  </script>
</body>
</html>
