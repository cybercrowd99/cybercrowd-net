<script>
/* CyberCrowd Email Sent Overlay – Visual Surface Only
   Owns: show/hide overlay + optional whoosh.
   Owns NOT: tokens, KV, sessions, cookies, Turnstile, verification, email sending.
*/

window.showEmailSentOverlay = function () {
  const overlay = document.getElementById("email-sent-overlay");
  const whoosh = document.getElementById("email-sent-whoosh");

  if (overlay) {
    overlay.style.display = "flex";
  }

  if (whoosh) {
    try {
      whoosh.currentTime = 0;
      whoosh.play();
    } catch (_) {
      // Audio failure is non-critical; ignore silently
    }
  }
};

document.getElementById("email-sent-close")?.addEventListener("click", () => {
  const overlay = document.getElementById("email-sent-overlay");
  if (overlay) {
    overlay.style.display = "none";
  }
});
</script>
