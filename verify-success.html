<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>CyberCrowd Access Granted</title>

<style>

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #020508;

    color: white;

    font-family: Arial, Helvetica, sans-serif;
}

#bg {

    position: fixed;

    inset: 0;

    background:
    radial-gradient(
        circle at center,
        rgba(0,255,255,.10),
        transparent 42%
    ),
    linear-gradient(
        to bottom,
        #020406,
        #071018
    );
}

#wrap {

    position: relative;

    z-index: 5;

    width: 100%;
    height: 100%;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

    box-sizing: border-box;
}

#panel {

    width: 100%;

    max-width: 620px;

    border-radius: 28px;

    background:
    rgba(0,0,0,.72);

    border:
    1px solid rgba(0,255,255,.24);

    padding: 40px;

    box-sizing: border-box;

    text-align: center;

    backdrop-filter: blur(8px);

    box-shadow:
    0 0 40px rgba(0,255,255,.08);
}

#title {

    color: #00ffff;

    font-size: 42px;

    letter-spacing: 6px;

    margin-bottom: 20px;
}

#sub {

    opacity: .82;

    line-height: 1.9;

    margin-bottom: 28px;

    font-size: 16px;
}

#status {

    display: inline-block;

    padding: 14px 24px;

    border-radius: 999px;

    background:
    rgba(0,255,170,.10);

    border:
    1px solid rgba(0,255,170,.30);

    color: #00ffaa;

    margin-bottom: 26px;

    letter-spacing: 2px;

    font-size: 13px;
}

#emailBox {

    margin-bottom: 28px;

    padding: 16px;

    border-radius: 18px;

    background:
    rgba(0,255,255,.05);

    border:
    1px solid rgba(0,255,255,.18);

    line-height: 1.7;

    word-break: break-word;
}

#emailLabel {

    color: #00ffaa;

    font-size: 12px;

    letter-spacing: 2px;

    margin-bottom: 8px;
}

#emailValue {

    color: white;

    opacity: .9;
}

#enterBtn {

    width: 100%;

    padding: 18px;

    border: none;

    border-radius: 20px;

    background:
    linear-gradient(
        90deg,
        #00ffff,
        #00ffaa
    );

    color: black;

    font-weight: bold;

    font-size: 17px;

    letter-spacing: 2px;

    cursor: pointer;

    transition:
    transform .2s ease,
    box-shadow .2s ease;
}

#enterBtn:hover {

    transform: scale(1.02);

    box-shadow:
    0 0 24px rgba(0,255,255,.28);
}

#footer {

    margin-top: 28px;

    opacity: .42;

    font-size: 11px;

    letter-spacing: 2px;
}

.blocked {

    color: #ff7777 !important;
}

.blockedStatus {

    background:
    rgba(255,90,90,.10) !important;

    border:
    1px solid rgba(255,90,90,.35) !important;

    color: #ff9999 !important;
}

</style>
</head>

<body>

<div id="bg"></div>

<div id="wrap">

<div id="panel">

<div id="title">
ACCESS GRANTED
</div>

<div id="sub">
Continuity identity verified.<br>
The ecosystem now recognizes your presence.
</div>

<div id="status">
VERIFIED CONTINUITY SESSION ACTIVE
</div>

<div id="emailBox">

<div id="emailLabel">
VERIFIED EMAIL
</div>

<div id="emailValue">
loading...
</div>

</div>

<button id="enterBtn">
ENTER MENU
</button>

<div id="footer">
CYBERCROWD VERIFY SUCCESS ROUTE V2
</div>

</div>

</div>

<script>

const title =
document.getElementById(
'title'
);

const sub =
document.getElementById(
'sub'
);

const statusBox =
document.getElementById(
'status'
);

const emailValue =
document.getElementById(
'emailValue'
);

const enterBtn =
document.getElementById(
'enterBtn'
);

const params =
new URLSearchParams(
window.location.search
);

const verified =
params.get(
'verified'
) === '1';

const email =
(
params.get(
'email'
) || ''
)
.trim()
.toLowerCase();

const token =
params.get(
'token'
) || '';

const emailPattern =
/^[^\s@]+@[^\s@]+\.[^\s@]+$/;

const validLink =
verified &&
token &&
emailPattern.test(
email
);

function createVerifiedSession() {

    const session = {

        verified: true,

        email: email,

        token: token,

        verifiedAt: Date.now(),

        route: 'verify-success.html',

        next: 'menu.html'

    };

    localStorage.setItem(
        'cc_verified_email',
        email
    );

    localStorage.setItem(
        'cc_verified_session',
        JSON.stringify(session)
    );

    localStorage.removeItem(
        'cc_pending_verify_email'
    );

    localStorage.removeItem(
        'cc_pending_verify_token'
    );

    localStorage.removeItem(
        'cc_pending_verify_url'
    );
}

function activateSuccess() {

    createVerifiedSession();

    title.innerText =
    'ACCESS GRANTED';

    sub.innerHTML =
    'Continuity identity verified.<br>The ecosystem now recognizes your presence.';

    statusBox.innerText =
    'VERIFIED CONTINUITY SESSION ACTIVE';

    emailValue.innerText =
    email;

    enterBtn.innerText =
    'ENTER MENU';

    enterBtn.onclick =
    function() {

        window.location.href =
        'menu.html';
    };
}

function activateBlocked() {

    title.innerText =
    'ACCESS BLOCKED';

    title.classList.add(
        'blocked'
    );

    sub.innerHTML =
    'Verification link is missing, invalid, or expired.<br>Return to the security gate and request a new verification link.';

    statusBox.innerText =
    'VERIFICATION LINK REQUIRED';

    statusBox.classList.add(
        'blockedStatus'
    );

    emailValue.innerText =
    'No verified email';

    enterBtn.innerText =
    'RETURN TO SECURITY GATE';

    enterBtn.onclick =
    function() {

        window.location.href =
        'page2.html';
    };
}

if (validLink) {

    activateSuccess();

} else {

    activateBlocked();
}

</script>

</body>
</html>
