<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CyberCrowd Access Verified</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --cc-black: #050505;
  --cc-panel: #101414;
  --cc-cyan: #00ffff;
  --cc-green: #00ffaa;
  --cc-text: #ffffff;
  --cc-muted: #9fb9b9;
  --cc-border: rgba(0,255,255,0.34);
  --cc-border-hot: rgba(0,255,255,0.82);
  --cc-glow: rgba(0,255,255,0.22);
  --cc-error: #ff5555;
}

html,
body {
  width: 100%;
  min-height: 100%;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  min-height: 100vh;
  background:
    radial-gradient(circle at center, rgba(0,255,255,0.13), transparent 48%),
    var(--cc-black);
  color: var(--cc-text);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 22px;
}

.panel {
  width: 100%;
  max-width: 680px;
  border: 1px solid var(--cc-border);
  border-radius: 22px;
  background:
    linear-gradient(180deg, rgba(0,255,255,0.055), rgba(0,255,170,0.025)),
    var(--cc-panel);
  box-shadow:
    0 0 36px var(--cc-glow),
    0 24px 90px rgba(0,0,0,0.85);
  padding: 34px;
  text-align: center;
}

.badge {
  width: 74px;
  height: 74px;
  border: 3px solid var(--cc-green);
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 22px;
  color: var(--cc-green);
  font-size: 38px;
  box-shadow: 0 0 22px rgba(0,255,170,0.24);
}

h1 {
  color: var(--cc-cyan);
  font-size: clamp(30px, 7vw, 56px);
  letter-spacing: 4px;
  margin-bottom: 16px;
  text-transform: uppercase;
}

p {
  color: var(--cc-muted);
  line-height: 1.7;
  font-size: 16px;
  margin-bottom: 18px;
}

.status-box {
  border: 1px solid var(--cc-border);
  border-radius: 16px;
  padding: 18px;
  margin: 22px 0;
  text-align: left;
  background: rgba(0,0,0,0.25);
}

.label {
  color: var(--cc-green);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 1.4px;
  font-weight: 800;
  margin-bottom: 6px;
}

.value {
  color: var(--cc-text);
  font-weight: 800;
  word-break: break-word;
}

.actions {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  margin-top: 24px;
}

button,
a.button {
  display: block;
  width: 100%;
  padding: 16px 18px;
  border-radius: 14px;
  border: 1px solid transparent;
  background: linear-gradient(90deg, var(--cc-cyan), var(--cc-green));
  color: #001111;
  font-size: 15px;
  font-weight: 900;
  letter-spacing: 1px;
  text-decoration: none;
  cursor: pointer;
}

button.secondary,
a.button.secondary {
  background: rgba(0,0,0,0.18);
  color: var(--cc-muted);
  border-color: var(--cc-border);
}

.error {
  color: var(--cc-error);
}

.small {
  font-size: 12px;
  opacity: 0.78;
}
</style>
</head>

<body>

<main class="panel">
  <div class="badge">✓</div>

  <h1>Access Verified</h1>

  <p>
    CyberCrowd email verification is complete.
    The verified session cookie has been set by the server.
  </p>

  <div class="status-box">
    <div class="label">Session Status</div>
    <div class="value" id="sessionStatus">Checking verified session...</div>
  </div>

  <div class="status-box">
    <div class="label">Verified Email</div>
    <div class="value" id="verifiedEmail">Reading...</div>
  </div>

  <div class="status-box">
    <div class="label">Next Page</div>
    <div class="value" id="nextPage">Reading...</div>
  </div>

  <div class="actions">
    <a class="button" id="continueButton" href="/">Enter CyberCrowd</a>
    <a class="button secondary" href="/api/enrollment/close">Close Door</a>
  </div>

  <p class="small" id="autoText">
    Auto-entry begins after session check.
  </p>
</main>

<script>
(function () {
  "use strict";

  var params = new URLSearchParams(window.location.search);

  var verified = params.get("verified") || "";
  var email = params.get("email") || "";
  var next = params.get("next") || "/";

  var sessionStatus = document.getElementById("sessionStatus");
  var verifiedEmail = document.getElementById("verifiedEmail");
  var nextPage = document.getElementById("nextPage");
  var continueButton = document.getElementById("continueButton");
  var autoText = document.getElementById("autoText");

  function sanitizeNext(value) {
    if (!value) {
      return "/";
    }

    if (value.indexOf("/") !== 0 || value.indexOf("//") === 0) {
      return "/";
    }

    if (value.indexOf("/verify-success.html") === 0) {
      return "/";
    }

    if (value.indexOf("/page2.html?verified=1") === 0) {
      return "/";
    }

    return value;
  }

  next = sanitizeNext(next);

  if (verifiedEmail) {
    verifiedEmail.textContent = email || "Verified email not shown.";
  }

  if (nextPage) {
    nextPage.textContent = next;
  }

  if (continueButton) {
    continueButton.href = next;
  }

  if (verified !== "1") {
    if (sessionStatus) {
      sessionStatus.textContent = "Missing verified flag.";
      sessionStatus.classList.add("error");
    }

    if (autoText) {
      autoText.textContent = "Use the verification link from your email.";
    }

    return;
  }

  async function checkSession() {
    try {
      var response = await fetch(
        "/api/enrollment/session",
        {
          method: "GET",
          headers: {
            "Accept": "application/json"
          }
        }
      );

      var data = await response.json();

      if (data.verified === true) {
        if (sessionStatus) {
          sessionStatus.textContent = "Verified session active.";
        }

        if (data.email && verifiedEmail) {
          verifiedEmail.textContent = data.email;
        }

        if (autoText) {
          autoText.textContent = "Verified. Continue into CyberCrowd.";
        }

        return;
      }

      if (sessionStatus) {
        sessionStatus.textContent = "No verified session cookie found.";
        sessionStatus.classList.add("error");
      }

      if (autoText) {
        autoText.textContent = "The email link was reached, but the session cookie is missing.";
      }
    } catch (error) {
      if (sessionStatus) {
        sessionStatus.textContent = "Session check failed: " + error.message;
        sessionStatus.classList.add("error");
      }

      if (autoText) {
        autoText.textContent = "Session check failed.";
      }
    }
  }

  checkSession();
})();
</script>

</body>
</html>
