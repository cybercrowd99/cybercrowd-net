<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CyberCrowd Verification</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --gold: #d4af37;
      --gold-dark: #7a5f24;
      --cyan: #00ffff;
      --cream: #f8f3e7;
      --muted: rgba(248, 243, 231, 0.68);
      --panel: rgba(0, 0, 0, 0.76);
      --line: rgba(212, 175, 55, 0.28);
      --danger: #ffd6d6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(0,255,255,0.12), transparent 32%),
        radial-gradient(circle at bottom, rgba(212,175,55,0.12), transparent 36%),
        #000;
      color: var(--cream);
      font-family: "Segoe UI", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
    }

    .verify-card {
      width: min(430px, 100%);
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--panel);
      box-shadow:
        0 0 28px rgba(0,255,255,0.08),
        0 0 34px rgba(212,175,55,0.10);
      padding: 30px;
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-mark {
      color: var(--cyan);
      font-size: 0.76rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      color: var(--gold);
      font-size: 2.05rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .subtext {
      margin: 12px 0 0;
      color: var(--muted);
      line-height: 1.45;
      font-size: 0.95rem;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      color: var(--cream);
      font-size: 0.92rem;
      font-weight: 700;
    }

    input {
      width: 100%;
      border: 1px solid rgba(212,175,55,0.30);
      border-radius: 12px;
      background: rgba(255,255,255,0.06);
      color: var(--cream);
      padding: 14px 15px;
      font-size: 1rem;
      outline: none;
    }

    input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(0,255,255,0.10);
    }

    button {
      width: 100%;
      margin-top: 22px;
      border: 2px solid var(--gold);
      border-radius: 999px;
      background: linear-gradient(145deg, #b08d3a, var(--gold-dark));
      color: var(--cream);
      padding: 14px 22px;
      font-size: 0.96rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 22px rgba(212,175,55,0.28);
    }

    button:disabled {
      opacity: 0.48;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    #statusMessage {
      display: none;
      margin-top: 18px;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1px solid rgba(0,255,255,0.22);
      background: rgba(0,255,255,0.06);
      color: var(--muted);
      line-height: 1.45;
      font-size: 0.92rem;
    }

    #statusMessage.error {
      border-color: rgba(255,90,90,0.45);
      background: rgba(255,90,90,0.08);
      color: var(--danger);
    }

    .small-note {
      margin-top: 16px;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.45;
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="verify-card">
    <div class="brand">
      <div class="brand-mark">cybercrowd.net</div>
      <h1>Token Accepted</h1>
      <p class="subtext">
        Your email link was accepted. Create your password to finish opening your CyberCrowd profile lane.
      </p>
    </div>

    <form id="passwordForm">
      <label for="password">Create Password</label>
      <input id="password" type="password" autocomplete="new-password" />

      <label for="confirmPassword">Confirm Password</label>
      <input id="confirmPassword" type="password" autocomplete="new-password" />

      <button id="createPasswordBtn" type="submit">Create Password</button>

      <div class="small-note">
        This step completes the verified account lane. The token is consumed by the server after password creation.
      </div>

      <div id="statusMessage" aria-live="polite"></div>
    </form>
  </main>

  <script>
    const passwordForm = document.getElementById("passwordForm");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const createPasswordBtn = document.getElementById("createPasswordBtn");
    const statusMessage = document.getElementById("statusMessage");

    function setStatus(message, type) {
      statusMessage.textContent = message;
      statusMessage.className = type || "";
      statusMessage.style.display = "block";
    }

    function getCookie(name) {
      return document.cookie
        .split("; ")
        .find(row => row.startsWith(name + "="))
        ?.split("=")[1] || "";
    }

    function getVerificationToken() {
      const params = new URLSearchParams(window.location.search);

      return (
        params.get("token") ||
        params.get("verify_token") ||
        params.get("session") ||
        getCookie("cc_session") ||
        localStorage.getItem("cc_verify_token") ||
        ""
      );
    }

    function passwordLooksUsable(password) {
      return password.length >= 8;
    }

    passwordForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      const password = passwordInput.value.trim();
      const confirmPassword = confirmPasswordInput.value.trim();
      const verificationToken = getVerificationToken();

      if (!password || !confirmPassword) {
        setStatus("Please enter a password in both fields.", "error");
        return;
      }

      if (password !== confirmPassword) {
        setStatus("Passwords do not match.", "error");
        return;
      }

      if (!passwordLooksUsable(password)) {
        setStatus("Password must be at least 8 characters.", "error");
        return;
      }

      if (!verificationToken) {
        setStatus("Verification token missing. Reopen the email verification link.", "error");
        return;
      }

      createPasswordBtn.disabled = true;
      createPasswordBtn.textContent = "Creating...";
      setStatus("Creating password and completing verified account lane.", "");

      try {
        const response = await fetch("/api/auth/set_password", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": verificationToken
          },
          body: JSON.stringify({
            password,
            token: verificationToken
          })
        });

        const result = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(result.error || result.message || "Password setup failed.");
        }

        localStorage.removeItem("cc_verify_token");
        window.location.href = "profile-setup.html";
      } catch (error) {
        console.error("CyberCrowd password setup error:", error);
        setStatus(error.message || "Password setup failed.", "error");
        createPasswordBtn.disabled = false;
        createPasswordBtn.textContent = "Create Password";
      }
    });
  </script>
</body>
</html>
