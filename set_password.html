<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Welcome Aboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      text-align: center;
    }
    .box {
      margin: 0 auto;
      padding: 30px;
      max-width: 400px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>Your Vessel Is Ready</h1>

    <p>Your secure access key has been automatically generated.</p>
    <p>Before entering, we need to confirm you are human.</p>

    <button onclick="go()">Continue</button>
  </div>

  <script>
    function go() {
      const params = new URLSearchParams(window.location.search);
      const email = params.get("email");
      window.location.href = "/human-check?email=" + encodeURIComponent(email);
    }
  </script>

</body>
</html>
