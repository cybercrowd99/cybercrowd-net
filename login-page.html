<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>CyberCrowd Login Page</title>
  <meta name="description" content="CyberCrowd login landing page." />

  <style>
    :root {
      --page-bg: #000000;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: var(--page-bg);
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
    }

    .login-page {
      position: relative;
      width: 100%;
      min-height: 100vh;
      background: var(--page-bg);
      overflow: hidden;
    }

    .login-page img {
      display: block;
      width: 100%;
      min-height: 100vh;
      object-fit: cover;
      object-position: center;
    }

    .button-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .button-layer a,
    .button-layer button {
      pointer-events: auto;
    }
  </style>
</head>

<body>
  <main class="login-page" aria-label="CyberCrowd login landing page">
    <img
      src="https://pub-081cb3c244be4e09b5e76012567a0b0a.r2.dev/Registry-Image/Register_login_image.png"
      alt="CyberCrowd registry login background"
    />

    <div class="button-layer" aria-label="Custom button placement layer">
      <!-- Place your buttons here when ready. -->
    </div>
  </main>
</body>
</html>
