<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CyberCrowd Login</title>

<style>
  body {
    margin: 0;
    background: #000;
  }

  /* IMAGE CONTAINER — CORRECT NON-ZOOM MATH */
  .r2-image-container {
    width: 100%;
    height: auto;
    max-width: 1200px;
    margin: 0 auto;
    background-color: #000;
    position: relative;
  }

  .r2-image-container img {
    width: 100%;
    height: auto;
    display: block;
    object-fit: contain;
  }

  /* BRASS PLATES */
  .brass-plate {
    position: absolute;
    padding: 14px 28px;
    background: linear-gradient(145deg, #b08d57, #8c6a3b);
    border: 2px solid rgba(255, 255, 255, 0.15);
    border-radius: 6px;
    box-shadow:
      inset 0 0 6px rgba(0,0,0,0.6),
      0 4px 12px rgba(0,0,0,0.7);
    color: #f7e7c1;
    font-family: "Georgia", serif;
    font-size: 1.1rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    user-select: none;
    transition: 0.2s ease;
    animation: brass-breath 4s ease-in-out infinite;
  }

  .brass-plate:hover {
    filter: brightness(1.25);
    transform: translateY(-2px);
  }

  @keyframes brass-breath {
    0%   { filter: brightness(1.0); }
    50%  { filter: brightness(1.25); }
    100% { filter: brightness(1.0); }
  }

  /* BUTTON POSITIONS */
  .register-btn {
    bottom: 8%;
    left: 50%;
    transform: translateX(-50%);
  }

  .about-btn {
    bottom: 8%;
    left: 20%;
  }

  .contents-btn {
    bottom: 8%;
    right: 20%;
  }

  /* TEASER HITBOX */
  .glass-hitbox {
    position: absolute;
    left: 32%;
    top: 18%;
    width: 36%;
    height: 58%;
    cursor: pointer;
    background: rgba(255,255,255,0);
  }
</style>
</head>

<body>

<div class="r2-image-container">
  <img src="https://pub-081cb3c244be4e09b5e76012567a0b0a.r2.dev/Registry-Image/Register_login_image.png">
</div>

<div class="brass-plate register-btn" onclick="openNAV()">Register</div>
<div class="brass-plate about-btn" onclick="goAbout()">About</div>
<div class="brass-plate contents-btn" onclick="goContents()">Contents</div>

<div class="glass-hitbox" onclick="playRandomTeaser()"></div>

<script>
  function openNAV() {
    window.location.href = "nav.html"; 
  }

  function goAbout() {
    window.location.href = "README.md";
  }

  function goContents() {
    window.location.href = "contents.html";
  }

  /* GLOBAL CYBERCROWD TEASERS — AUTO-GENERATED 500 TRACKS */
  const globalTeasers = Array.from({ length: 500 }, (_, i) =>
    `https://pub-081cb3c244be4e09b5e76012567a0b0a.r2.dev/cybercrowd-teasers/track${String(i+1).padStart(3,'0')}.60s.teaser.mp3`
  );

  /* USER TEASERS — UP TO 3 (POPULATED LATER IN PROFILE CREATION) */
  let userTeasers = [];

  /* MERGED PLAYLIST */
  function getFullPlaylist() {
    return [...globalTeasers, ...userTeasers];
  }

  /* RANDOM PLAYER */
  function playRandomTeaser() {
    const playlist = getFullPlaylist();
    const pick = playlist[Math.floor(Math.random() * playlist.length)];
    new Audio(pick).play();
  }
</script>

</body>
</html>
