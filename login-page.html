<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CyberCrowd Login</title>

<style>
  .brass-plate {
    position: absolute;
    padding: 14px 28px;
    background: linear-gradient(145deg, #b08d57, #8c6a3b);
    border: 2px solid rgba(255, 255, 255, 0.15);
    border-radius: 6px;
    box-shadow:
      inset 0 0 6px rgba(0,0,0,0.6),
      0 4px 12px rgba(0,0,0,0.7);
    color: #f7e7c1;
    font-family: "Georgia", serif;
    font-size: 1.1rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    user-select: none;
    transition: 0.2s ease;
  }

  .brass-plate:hover {
    filter: brightness(1.25);
    transform: translateY(-2px);
  }

  .register-btn {
    bottom: 8%;
    left: 50%;
    transform: translateX(-50%);
  }

  .about-btn {
    bottom: 8%;
    left: 20%;
  }

  .contents-btn {
    bottom: 8%;
    right: 20%;
  }

  .glass-hitbox {
    position: absolute;
    left: 32%;
    top: 18%;
    width: 36%;
    height: 58%;
    cursor: pointer;
    background: rgba(255,255,255,0);
  }
</style>
</head>

<body>

<div class="brass-plate register-btn" onclick="openNAV()">Register</div>
<div class="brass-plate about-btn" onclick="goAbout()">About</div>
<div class="brass-plate contents-btn" onclick="goContents()">Contents</div>

<div class="glass-hitbox" onclick="playRandomTeaser()"></div>

<script>
  function openNAV() {
    window.location.href = "nav.html"; 
  }

  function goAbout() {
    window.location.href = "about.html";
  }

  function goContents() {
    window.location.href = "contents.html";
  }

  const teaserFiles = [
    "https://pub-XXXX.r2.dev/teasers/teaser1.mp3",
    "https://pub-XXXX.r2.dev/teasers/teaser2.mp3",
    "https://pub-XXXX.r2.dev/teasers/teaser3.mp3",
    "https://pub-XXXX.r2.dev/teasers/teaser4.mp3"
  ];

  function playRandomTeaser() {
    const pick = teaserFiles[Math.floor(Math.random() * teaserFiles.length)];
    const audio = new Audio(pick);
    audio.play();
  }
</script>

</body>
</html>
