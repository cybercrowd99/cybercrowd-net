<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CyberCrowd Chat Surface</title>
  <link rel="stylesheet" href="/surfaces/css/surface-chat.css">
  <style>
    .chat-surface-root {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 9999;
      transform: translate3d(0, 0, 0);
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-lock-toggle {
      background: transparent;
      border: none;
      color: inherit;
      cursor: pointer;
      font-size: 0.85rem;
      opacity: 0.8;
    }

    .chat-lock-toggle:hover {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="chat-surface-root" class="chat-surface-root">
    <div id="chat-window" class="chat-window">
      <div id="chat-header" class="chat-header">
        <span>CyberCrowd Chat</span>
        <button id="chat-lock-toggle" class="chat-lock-toggle" type="button">
          🔒 Locked
        </button>
      </div>
      <div id="chat-messages" class="chat-messages"></div>
      <div id="chat-input" class="chat-input"></div>
    </div>
  </div>

  <script type="module">
    import { SurfaceChatKernel } from "./surface-chat-kernel.js";
    import { SurfaceChatLoader } from "./surface-chat-loader.js";
    import { SurfaceChatActivation } from "./surface-chat-activation.js";
    import { SurfaceChatController } from "./surface-chat-controller.js";
    import { SurfaceDragSystem } from "./surface-drag-system.js";

    const registry = window.CyberCrowdRegistry || {};
    const heartbeat = window.CyberCrowdHeartbeat || {};

    const loader = new SurfaceChatLoader({ registry, heartbeat });
    const activation = new SurfaceChatActivation({ registry, heartbeat });
    const controller = new SurfaceChatController({ registry, heartbeat });

    const rootEl = document.getElementById("chat-surface-root");
    const windowEl = document.getElementById("chat-window");
    const headerEl = document.getElementById("chat-header");
    const lockToggleEl = document.getElementById("chat-lock-toggle");

    const drag = new SurfaceDragSystem({
      surfaceId: "surface.chat",
      handleElement: headerEl,
      targetElement: rootEl,
      locked: true
    });

    function updateLockLabel() {
      if (drag.locked) {
        lockToggleEl.textContent = "🔒 Locked";
      } else {
        lockToggleEl.textContent = "🔓 Unlocked";
      }
    }

    lockToggleEl.addEventListener("click", () => {
      drag.toggleLock();
      updateLockLabel();
    });

    updateLockLabel();

    (async () => {
      await loader.load();
      await activation.activate();

      const kernel = new SurfaceChatKernel({
        registry,
        controller,
        messagesElement: document.getElementById("chat-messages"),
        inputElement: document.getElementById("chat-input")
      });

      kernel.boot();
    })();
  </script>
</body>
</html>
