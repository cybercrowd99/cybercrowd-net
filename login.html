<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CyberCrowd Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      background: #000;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #e8e8e8;
    }

    .frame {
      width: 900px;
      max-width: 95%;
      background: #0a0c10;
      border: 1px solid #1c1f26;
      border-radius: 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0, 255, 255, 0.12);
    }

    .left {
      background: #000;
      position: relative;
    }

    .left img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 1;
    }

    .right {
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      background: #0d1117;
    }

    h2 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #4fd1c5;
    }

    label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #9aa0ac;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 8px;
      border: 1px solid #222831;
      background: #0b0f14;
      color: #e8e8e8;
      font-size: 14px;
    }

    input:focus {
      outline: none;
      border-color: #4fd1c5;
      box-shadow: 0 0 6px rgba(79, 209, 197, 0.4);
    }

    .btn {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .primary {
      background: linear-gradient(135deg, #4fd1c5, #2b6cb0);
      color: #000;
    }

    .secondary {
      background: #11151c;
      color: #e8e8e8;
      border: 1px solid #2a303c;
    }

    .link {
      margin-top: 6px;
      font-size: 12px;
      color: #4fd1c5;
      cursor: pointer;
      text-decoration: none;
    }

    .error {
      color: #ff6b6b;
      font-size: 12px;
      min-height: 14px;
      margin-top: 4px;
    }

    @media (max-width: 800px) {
      .frame {
        grid-template-columns: 1fr;
      }
      .left {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="frame">

    <!-- LEFT SIDE: YOUR EXACT IMAGE ONLY -->
    <div class="left">
      <img src="https://pub-081cb3c244be4e09b5e76012567a0b0a.r2.dev/Registry-Image/Register_login_image.png" />
    </div>

    <!-- RIGHT SIDE: LOGIN PANEL -->
    <div class="right">
      <h2>CyberCrowd Access</h2>

      <label>Email</label>
      <input id="email" type="email" autocomplete="email" />

      <label>Password</label>
      <input id="password" type="password" autocomplete="current-password" />

      <div class="error" id="error"></div>

      <button class="btn primary" id="loginBtn">Login</button>
      <button class="btn secondary" id="signupBtn">Sign Up</button>

      <a class="link" id="roomsLink">Enter Reading Rooms</a>
      <a class="link" id="homeLink">Return to Landing</a>
    </div>
  </div>

  <script>
    const errorBox = document.getElementById("error");

    document.getElementById("loginBtn").onclick = () => {
      const email = document.getElementById("email").value.trim();
      const pass = document.getElementById("password").value.trim();

      if (!email || !pass) {
        errorBox.textContent = "Email and password required.";
        return;
      }

      errorBox.textContent = "Local login simulated. Wire backend when ready.";
    };

    document.getElementById("signupBtn").onclick = () => {
      errorBox.textContent = "Signup window not wired yet.";
    };

    document.getElementById("roomsLink").onclick = () => {
      errorBox.textContent = "Point this link to your reading rooms.";
    };

    document.getElementById("homeLink").onclick = () => {
      window.location.href = "index.html";
    };
  </script>
</body>
</html>
