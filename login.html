<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CyberCrowd Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    /* FULL WINDOW VAULT IMAGE */
    .vault-bg {
      position: fixed;
      inset: 0;
      background-image: url('https://pub-081cb3c244be4e09b5e76012567a0b0a.r2.dev/Registry-Image/Register_login_image.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 1;
    }

    /* INVISIBLE OVERLAY GRID */
    .hit-register,
    .hit-about,
    .hit-contents,
    .hit-center {
      position: absolute;
      cursor: pointer;
      z-index: 3;
    }

    /* REGISTER — breathing brass */
    .hit-register {
      top: 10%;
      left: 50%;
      width: 200px;
      height: 60px;
      transform: translateX(-50%);
      animation: registerPulse 6s ease-in-out infinite;
    }

    @keyframes registerPulse {
      0%   { transform: translateX(-50%) scale(1); }
      5%   { transform: translateX(-50%) scale(1.025); }
      10%  { transform: translateX(-50%) scale(1); }
      100% { transform: translateX(-50%) scale(1); }
    }

    /* ABOUT US — static */
    .hit-about {
      bottom: 10%;
      left: 10%;
      width: 180px;
      height: 60px;
    }

    /* CONTENTS — static */
    .hit-contents {
      bottom: 10%;
      right: 10%;
      width: 180px;
      height: 60px;
    }

    /* CENTER TOUCH ZONE */
    .hit-center {
      top: 32%;
      left: 50%;
      width: 260px;
      height: 260px;
      transform: translateX(-50%);
    }
  </style>
</head>

<body>

  <!-- FULL WINDOW VAULT IMAGE -->
  <div class="vault-bg"></div>

  <!-- INVISIBLE TOUCH GRID -->
  <div class="hit-register" onclick="window.location.href='register.html'"></div>
  <div class="hit-about" onclick="window.location.href='about.html'"></div>
  <div class="hit-contents" onclick="window.location.href='contents.html'"></div>
  <div class="hit-center" onclick="window.location.href='teaser.html'"></div>

</body>
</html>
