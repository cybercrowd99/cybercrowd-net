<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CyberCrowd Vault</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      background: #000;
      overflow: hidden;
    }

    .vault-frame {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .vault-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .plaque {
      position: absolute;
      padding: 12px 28px;
      background: linear-gradient(145deg, #b08d3a, #7a5f24);
      border: 2px solid #d4af37;
      color: #f8f3e7;
      font-family: "Segoe UI", sans-serif;
      font-size: 1.1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      box-shadow: 0 0 12px rgba(0,0,0,0.6);
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s ease;
      z-index: 5;
    }

    .plaque:hover {
      transform: scale(1.04);
    }

    @keyframes breathe {
      0% {
        box-shadow: 0 0 8px rgba(212,175,55,0.35);
      }

      50% {
        box-shadow: 0 0 22px rgba(212,175,55,0.75);
      }

      100% {
        box-shadow: 0 0 8px rgba(212,175,55,0.35);
      }
    }

    .register {
      top: 6%;
      left: 50%;
      transform: translateX(-50%);
      animation: breathe 2.3s ease-in-out infinite;
    }

    .register:hover {
      transform: translateX(-50%) scale(1.04);
    }

    .about {
      bottom: 6%;
      left: 8%;
    }

    .contents {
      bottom: 6%;
      right: 8%;
    }

    .teaser-hitbox {
      position: absolute;
      top: 32%;
      left: 38%;
      width: 24%;
      height: 20%;
      cursor: pointer;
      background: transparent;
      z-index: 4;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .teaser-hitbox:focus {
      outline: none;
    }

    #teaserAudio {
      display: none;
    }
  </style>
</head>

<body>
  <div class="vault-frame">
    <img
      src="https://pub-081cb3c244be4e09b5e76012567a0b0a.r2.dev/Registry-Image/Register_login_image.png"
      alt="CyberCrowd Vault Background"
    />

    <a class="plaque register" href="profile_signup.html">Register</a>
    <a class="plaque about" href="readme.md">About</a>
    <a class="plaque contents" href="rules_regulations.html">Contents</a>

    <div
      class="teaser-hitbox"
      role="button"
      tabindex="0"
      aria-label="Play next random CyberCrowd teaser"
      onpointerdown="glassTeaserClick(event)"
      onkeydown="glassTeaserKey(event)"
    ></div>

    <audio id="teaserAudio" preload="auto" playsinline></audio>
  </div>

  <script>
    const PLAYLIST_ENDPOINT = "/api/r2-teaser-playlist";

    let playlist = [];
    let deck = [];
    let playlistPromise = null;
    let currentTrack = "";
    let playRequestNumber = 0;

    function fetchPlaylist() {
      if (playlist.length > 0) {
        return Promise.resolve(playlist);
      }

      if (!playlistPromise) {
        playlistPromise = fetch(PLAYLIST_ENDPOINT, {
          method: "GET",
          cache: "no-store"
        })
          .then(function (response) {
            if (!response.ok) {
              throw new Error("Playlist endpoint failed: HTTP " + response.status);
            }

            return response.json();
          })
          .then(function (data) {
            const tracks = Array.isArray(data) ? data : data.tracks;

            if (!Array.isArray(tracks) || tracks.length === 0) {
              throw new Error("Playlist endpoint returned zero tracks.");
            }

            playlist = tracks.slice();
            deck = shuffleDeck(playlist);

            console.log("CyberCrowd playlist connected:", playlist.length, "tracks");

            return playlist;
          })
          .catch(function (error) {
            playlistPromise = null;
            console.error("CyberCrowd playlist failed:", error);
            throw error;
          });
      }

      return playlistPromise;
    }

    function shuffleDeck(sourceTracks) {
      const shuffled = sourceTracks.slice();

      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = shuffled[i];
        shuffled[i] = shuffled[j];
        shuffled[j] = temp;
      }

      return shuffled;
    }

    function getNextTrack() {
      if (deck.length === 0) {
        deck = shuffleDeck(playlist);
      }

      let nextTrack = deck.shift();

      if (playlist.length > 1 && nextTrack === currentTrack) {
        deck.push(nextTrack);
        nextTrack = deck.shift();
      }

      currentTrack = nextTrack;
      return nextTrack;
    }

    async function playNextTeaserFromGlass() {
      const audio = document.getElementById("teaserAudio");
      const thisRequest = ++playRequestNumber;

      try {
        await fetchPlaylist();

        if (thisRequest !== playRequestNumber) {
          return;
        }

        const selectedTrack = getNextTrack();

        audio.pause();
        audio.currentTime = 0;
        audio.src = selectedTrack;
        audio.volume = 1;
        audio.muted = false;
        audio.load();

        await audio.play();

        console.log("CyberCrowd teaser playing:", selectedTrack);
      } catch (error) {
        console.error("CyberCrowd glass teaser play failed:", error);
      }
    }

    function glassTeaserClick(event) {
      event.preventDefault();
      event.stopPropagation();

      playNextTeaserFromGlass();
    }

    function glassTeaserKey(event) {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        event.stopPropagation();

        playNextTeaserFromGlass();
      }
    }

    window.addEventListener("DOMContentLoaded", function () {
      fetchPlaylist().catch(function (error) {
        console.error("CyberCrowd playlist warmup failed:", error);
      });
    });
  </script>
</body>
</html>
