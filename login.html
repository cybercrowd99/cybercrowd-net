<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CyberCrowd Vault</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      background: #000;
      overflow: hidden;
    }

    .vault-frame {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .vault-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .plaque {
      position: absolute;
      padding: 12px 28px;
      background: linear-gradient(145deg, #b08d3a, #7a5f24);
      border: 2px solid #d4af37;
      color: #f8f3e7;
      font-family: "Segoe UI", sans-serif;
      font-size: 1.1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      box-shadow: 0 0 12px rgba(0,0,0,0.6);
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s ease;
      z-index: 5;
    }

    .plaque:hover {
      transform: scale(1.04);
    }

    @keyframes breathe {
      0% {
        box-shadow: 0 0 8px rgba(212,175,55,0.35);
      }

      50% {
        box-shadow: 0 0 22px rgba(212,175,55,0.75);
      }

      100% {
        box-shadow: 0 0 8px rgba(212,175,55,0.35);
      }
    }

    .register {
      top: 6%;
      left: 50%;
      transform: translateX(-50%);
      animation: breathe 2.3s ease-in-out infinite;
    }

    .register:hover {
      transform: translateX(-50%) scale(1.04);
    }

    .about {
      bottom: 6%;
      left: 8%;
    }

    .contents {
      bottom: 6%;
      right: 8%;
    }

    .teaser-hitbox {
      position: absolute;
      top: 32%;
      left: 38%;
      width: 24%;
      height: 20%;
      cursor: pointer;
      background: transparent;
      z-index: 4;
    }
  </style>
</head>

<body>
  <div class="vault-frame">
    <img
      src="https://pub-081cb3c244be4e09b5e76012567a0b0a.r2.dev/Registry-Image/Register_login_image.png"
      alt="CyberCrowd Vault Background"
    />

    <div class="plaque register" onclick="forcedError('register')">Register</div>
    <div class="plaque about" onclick="forcedError('about')">About</div>
    <div class="plaque contents" onclick="forcedError('contents')">Contents</div>

    <div class="teaser-hitbox" onclick="playRandomTeaser()"></div>
  </div>

  <script>
    function forcedError(source) {
      throw new Error('Forced CyberCrowd vault error from: ' + source);
    }

    const teaserFiles = [
      'https://pub-081cb3c244be4e09b5e76012567a0b0a.r2.dev/cybercrowd-teasers/teaser1.mp3',
      'https://pub-081cb3c244be4e09b5e76012567a0b0a.r2.dev/cybercrowd-teasers/teaser2.mp3',
      'https://pub-081cb3c244be4e09b5e76012567a0b0a.r2.dev/cybercrowd-teasers/teaser3.mp3'
    ];

    function playRandomTeaser() {
      const index = Math.floor(Math.random() * teaserFiles.length);
      const audio = new Audio(teaserFiles[index]);
      audio.play().catch(() => {});
    }
  </script>
</body>
</html>
