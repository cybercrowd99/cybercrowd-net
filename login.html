<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CyberCrowd Vault</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      background: #000;
      overflow: hidden;
    }

    .vault-frame {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .vault-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
      user-select: none;
    }

    .plaque {
      position: absolute;
      padding: 12px 28px;
      background: linear-gradient(145deg, #b08d3a, #7a5f24);
      border: 2px solid #d4af37;
      color: #f8f3e7;
      font-family: "Segoe UI", sans-serif;
      font-size: 1.1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      box-shadow: 0 0 12px rgba(0,0,0,0.6);
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s ease;
      z-index: 20;
    }

    .plaque:hover {
      transform: scale(1.04);
    }

    @keyframes breathe {
      0% {
        box-shadow: 0 0 8px rgba(212,175,55,0.35);
      }

      50% {
        box-shadow: 0 0 22px rgba(212,175,55,0.75);
      }

      100% {
        box-shadow: 0 0 8px rgba(212,175,55,0.35);
      }
    }

    .register {
      top: 6%;
      left: 50%;
      transform: translateX(-50%);
      animation: breathe 2.3s ease-in-out infinite;
    }

    .register:hover {
      transform: translateX(-50%) scale(1.04);
    }

    .about {
      bottom: 6%;
      left: 8%;
    }

    .contents {
      bottom: 6%;
      right: 8%;
    }

    .glass-display {
      position: absolute;
      top: 32%;
      left: 38%;
      width: 24%;
      height: 20%;
      z-index: 10;
      display: block;
      padding: 0;
      margin: 0;
      border: 1px solid rgba(255,255,255,0.42);
      border-radius: 14px;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.22), rgba(255,255,255,0.04) 45%, rgba(255,255,255,0.12)),
        rgba(255,255,255,0.025);
      box-shadow:
        inset 0 0 18px rgba(255,255,255,0.18),
        0 0 18px rgba(255,255,255,0.08);
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
      backdrop-filter: blur(1.5px);
      -webkit-backdrop-filter: blur(1.5px);
    }

    .glass-display::before {
      content: "";
      position: absolute;
      top: -40%;
      left: -45%;
      width: 45%;
      height: 180%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.26), transparent);
      transform: rotate(18deg);
      animation: glassSweep 4.8s ease-in-out infinite;
      pointer-events: none;
    }

    .glass-display::after {
      content: "";
      position: absolute;
      inset: 8px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.12);
      pointer-events: none;
    }

    .glass-display:hover {
      box-shadow:
        inset 0 0 22px rgba(255,255,255,0.22),
        0 0 22px rgba(255,255,255,0.16);
    }

    .glass-display:active,
    .glass-display.is-playing {
      box-shadow:
        inset 0 0 24px rgba(255,255,255,0.30),
        0 0 28px rgba(212,175,55,0.22);
    }

    .glass-display:focus {
      outline: none;
    }

    @keyframes glassSweep {
      0% {
        left: -55%;
        opacity: 0;
      }

      20% {
        opacity: 1;
      }

      50% {
        left: 110%;
        opacity: 0.85;
      }

      100% {
        left: 110%;
        opacity: 0;
      }
    }

    #teaserAudio {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      left: -9999px;
      top: -9999px;
    }
  </style>
</head>

<body>
  <div class="vault-frame">
    <img
      src="https://pub-081cb3c244be4e09b5e76012567a0b0a.r2.dev/Registry-Image/Register_login_image.png"
      alt="CyberCrowd Vault Background"
    />

    <a class="plaque register" href="profile_signup.html">Register</a>
    <a class="plaque about" href="readme.md">About</a>
    <a class="plaque contents" href="rules_regulations.html">Contents</a>

    <button
      class="glass-display"
      type="button"
      aria-label="Play next random CyberCrowd teaser"
      onpointerdown="glassPointerDown(event)"
      onclick="glassClickFallback(event)"
      onkeydown="glassKeyDown(event)"
    ></button>

    <audio id="teaserAudio" preload="auto" playsinline></audio>
  </div>

  <script>
    const PLAYLIST_ENDPOINT = "/api/r2-teaser-playlist";

    let playlist = [];
    let deck = [];
    let playlistPromise = null;
    let currentTrack = "";
    let playRequestId = 0;
    let lastPointerDownTime = 0;

    function loadPlaylist() {
      if (playlist.length > 0) {
        return Promise.resolve(playlist);
      }

      if (!playlistPromise) {
        playlistPromise = fetch(PLAYLIST_ENDPOINT, {
          method: "GET",
          cache: "no-store"
        })
          .then(function (response) {
            if (!response.ok) {
              throw new Error("Playlist endpoint failed: HTTP " + response.status);
            }

            return response.json();
          })
          .then(function (data) {
            const tracks = Array.isArray(data) ? data : data.tracks;

            if (!Array.isArray(tracks) || tracks.length === 0) {
              throw new Error("Playlist endpoint returned zero tracks.");
            }

            playlist = tracks.slice();
            deck = shuffleTracks(playlist);

            console.log("CyberCrowd R2 teaser playlist ready:", playlist.length);

            return playlist;
          })
          .catch(function (error) {
            playlistPromise = null;
            console.error("CyberCrowd playlist load failed:", error);
            throw error;
          });
      }

      return playlistPromise;
    }

    function shuffleTracks(source) {
      const shuffled = source.slice();

      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = shuffled[i];
        shuffled[i] = shuffled[j];
        shuffled[j] = temp;
      }

      return shuffled;
    }

    function getNextTrack() {
      if (deck.length === 0) {
        deck = shuffleTracks(playlist);
      }

      let next = deck.shift();

      if (playlist.length > 1 && next === currentTrack) {
        deck.push(next);
        next = deck.shift();
      }

      currentTrack = next;
      return next;
    }

    async function playNextTeaser() {
      const audio = document.getElementById("teaserAudio");
      const glass = document.querySelector(".glass-display");
      const thisRequest = ++playRequestId;

      try {
        await loadPlaylist();

        if (thisRequest !== playRequestId) {
          return;
        }

        const track = getNextTrack();

        audio.pause();
        audio.currentTime = 0;
        audio.src = track;
        audio.volume = 1;
        audio.muted = false;
        audio.load();

        await audio.play();

        glass.classList.add("is-playing");

        window.setTimeout(function () {
          glass.classList.remove("is-playing");
        }, 700);

        console.log("CyberCrowd teaser playing:", track);
      } catch (error) {
        console.error("CyberCrowd teaser failed:", error);
      }
    }

    function glassPointerDown(event) {
      lastPointerDownTime = Date.now();
      event.preventDefault();
      event.stopPropagation();

      playNextTeaser();
    }

    function glassClickFallback(event) {
      const now = Date.now();

      event.preventDefault();
      event.stopPropagation();

      if (now - lastPointerDownTime < 700) {
        return;
      }

      playNextTeaser();
    }

    function glassKeyDown(event) {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        event.stopPropagation();

        playNextTeaser();
      }
    }

    window.addEventListener("DOMContentLoaded", function () {
      loadPlaylist().catch(function (error) {
        console.error("CyberCrowd playlist warmup failed:", error);
      });
    });
  </script>
</body>
</html>
