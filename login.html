<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CyberCrowd Vault Entry</title>

  <style>
    body {
      margin: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
      height: auto;
    }

    .vault-frame {
      position: relative;
      width: 100%;
      max-width: 1600px;
      height: auto;
      overflow: visible;
    }

    /* FULL IMAGE — RESPONSIVE SCALING */
    .vault-frame img {
      width: 100%;
      height: auto;
      max-height: 100vh;     /* fits desktop */
      object-fit: contain;   /* preserves full image */
      display: block;
    }

    /* ANDROID / MOBILE OVERRIDE */
    @media (max-width: 768px) {
      .vault-frame img {
        max-height: 100vh;   /* fits phone screen */
        width: 100%;
        height: auto;
      }
    }

    .plaque {
      position: absolute;
      padding: 12px 28px;
      background: linear-gradient(145deg, #b08d3a, #7a5f24);
      border: 2px solid #d4af37;
      color: #f8f3e7;
      font-family: "Segoe UI", sans-serif;
      font-size: 1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      box-shadow: 0 0 12px rgba(0,0,0,0.6);
      cursor: pointer;
      user-select: none;
    }

    @keyframes breathe {
      0%   { box-shadow: 0 0 8px rgba(212,175,55,0.35); }
      50%  { box-shadow: 0 0 22px rgba(212,175,55,0.75); }
      100% { box-shadow: 0 0 8px rgba(212,175,55,0.35); }
    }

    .register {
      top: 6%;
      left: 50%;
      transform: translateX(-50%);
      animation: breathe 2.3s ease-in-out infinite;
    }

    .about {
      bottom: 6%;
      left: 8%;
    }

    .contents {
      bottom: 6%;
      right: 8%;
    }

    .teaser-hitbox {
      position: absolute;
      cursor: pointer;
      top: 26%;
      left: 36%;
      width: 28%;
      height: 42%;
      background: rgba(255,0,0,0);
    }
  </style>
</head>

<body>
  <div class="vault-frame">
    <img src="https://pub-081cb3c244be4e09b5e76012567a0b0a.r2.dev/Registry-Image/Register_login_image.png" />

    <div class="plaque register">Register</div>
    <div class="plaque about">About Us</div>
    <div class="plaque contents">Contents</div>

    <div class="teaser-hitbox" onclick="playRandomTeaser()"></div>
  </div>

  <script>
    function playRandomTeaser() {
      const total = 500;
      const index = Math.floor(Math.random() * total) + 1;
      const padded = String(index).padStart(3, '0');
      const url = `https://pub-081cb3c244be4e09b5e76012567a0b0a.r2.dev/Teasers/track${padded}.60s.teaser.mp3`;
      new Audio(url).play();
    }
  </script>
</body>
</html>
