<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CyberCrowd Vault</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      background: #000;
      overflow: hidden;
    }

    .vault-frame {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .vault-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .plaque {
      position: absolute;
      padding: 12px 28px;
      background: linear-gradient(145deg, #b08d3a, #7a5f24);
      border: 2px solid #d4af37;
      color: #f8f3e7;
      font-family: "Segoe UI", sans-serif;
      font-size: 1.1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      box-shadow: 0 0 12px rgba(0,0,0,0.6);
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s ease;
      z-index: 5;
    }

    .plaque:hover {
      transform: scale(1.04);
    }

    @keyframes breathe {
      0% {
        box-shadow: 0 0 8px rgba(212,175,55,0.35);
      }

      50% {
        box-shadow: 0 0 22px rgba(212,175,55,0.75);
      }

      100% {
        box-shadow: 0 0 8px rgba(212,175,55,0.35);
      }
    }

    .register {
      top: 6%;
      left: 50%;
      transform: translateX(-50%);
      animation: breathe 2.3s ease-in-out infinite;
    }

    .register:hover {
      transform: translateX(-50%) scale(1.04);
    }

    .about {
      bottom: 6%;
      left: 8%;
    }

    .contents {
      bottom: 6%;
      right: 8%;
    }

    .teaser-hitbox {
      position: absolute;
      top: 27%;
      left: 50%;
      width: 34%;
      height: 36%;
      transform: translateX(-50%);
      cursor: pointer;
      background: transparent;
      z-index: 4;
      touch-action: manipulation;
    }

    .teaser-hitbox:focus {
      outline: none;
    }
  </style>
</head>

<body>
  <div class="vault-frame">
    <img
      src="https://pub-081cb3c244be4e09b5e76012567a0b0a.r2.dev/Registry-Image/Register_login_image.png"
      alt="CyberCrowd Vault Background"
    />

    <a class="plaque register" href="profile_signup.html">Register</a>
    <a class="plaque about" href="readme.md">About</a>
    <a class="plaque contents" href="rules_regulations.html">Contents</a>

    <div
      class="teaser-hitbox"
      role="button"
      tabindex="0"
      aria-label="Play CyberCrowd teaser"
      onclick="playRandomTeaser()"
      onkeydown="handleTeaserKey(event)"
    ></div>
  </div>

  <script>
    const teaserFiles = [
      'https://pub-081cb3c244be4e09b5e76012567a0b0a.r2.dev/cybercrowd-teasers/teaser1.mp3',
      'https://pub-081cb3c244be4e09b5e76012567a0b0a.r2.dev/cybercrowd-teasers/teaser2.mp3',
      'https://pub-081cb3c244be4e09b5e76012567a0b0a.r2.dev/cybercrowd-teasers/teaser3.mp3'
    ];

    let activeTeaser = null;

    function playRandomTeaser() {
      const index = Math.floor(Math.random() * teaserFiles.length);

      if (activeTeaser) {
        activeTeaser.pause();
        activeTeaser.currentTime = 0;
      }

      activeTeaser = new Audio(teaserFiles[index]);
      activeTeaser.play().catch(function () {});
    }

    function handleTeaserKey(event) {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        playRandomTeaser();
      }
    }
  </script>
</body>
</html>
