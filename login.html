<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CyberCrowd Register</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      touch-action: manipulation;
    }

    .vault-frame {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    .vault-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .glass-case-touch {
      position: absolute;
      left: 50%;
      top: 46%;
      width: 48vw;
      height: 34vh;
      transform: translate(-50%, -50%);
      border: 0;
      outline: 0;
      background: transparent;
      padding: 0;
      margin: 0;
      cursor: pointer;
      z-index: 5;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .vault-menu {
      position: absolute;
      left: 50%;
      bottom: 8%;
      transform: translateX(-50%);
      z-index: 30;
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      width: min(92vw, 760px);
      pointer-events: auto;
    }

    .vault-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 132px;
      min-height: 48px;
      padding: 10px 20px;
      border-radius: 999px;
      border: 1px solid rgba(255, 224, 140, 0.82);
      background: rgba(0, 0, 0, 0.58);
      color: #ffeab0;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 13px;
      font-weight: 800;
      box-shadow:
        0 0 12px rgba(255, 210, 90, 0.28),
        inset 0 0 14px rgba(255, 210, 90, 0.14);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      pointer-events: auto;
    }

    .vault-btn:hover,
    .vault-btn:focus-visible {
      background: rgba(255, 215, 110, 0.18);
      color: #fff6d8;
      outline: none;
      box-shadow:
        0 0 22px rgba(255, 210, 90, 0.62),
        inset 0 0 16px rgba(255, 210, 90, 0.25);
    }

    .vault-btn:active {
      transform: scale(0.96);
    }

    .register-btn {
      color: #fff4c8;
      border-color: rgba(255, 235, 150, 0.98);
      background: rgba(90, 55, 0, 0.68);
      animation: registerBreath 2.3s ease-in-out infinite;
    }

    @keyframes registerBreath {
      0% {
        transform: scale(1);
        box-shadow:
          0 0 12px rgba(255, 210, 90, 0.35),
          inset 0 0 12px rgba(255, 210, 90, 0.16);
      }

      50% {
        transform: scale(1.08);
        box-shadow:
          0 0 34px rgba(255, 225, 120, 0.95),
          0 0 58px rgba(255, 160, 40, 0.45),
          inset 0 0 22px rgba(255, 225, 120, 0.36);
      }

      100% {
        transform: scale(1);
        box-shadow:
          0 0 12px rgba(255, 210, 90, 0.35),
          inset 0 0 12px rgba(255, 210, 90, 0.16);
      }
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 700px) {
      .glass-case-touch {
        top: 44%;
        width: 72vw;
        height: 32vh;
      }

      .vault-menu {
        bottom: 5%;
        gap: 10px;
      }

      .vault-btn {
        min-width: 108px;
        min-height: 44px;
        padding: 8px 14px;
        font-size: 11px;
        letter-spacing: 1.4px;
      }
    }
  </style>
</head>

<body>
  <main class="vault-frame">
    <img
      src="https://pub-081cb3c244be4e09b5e76012567a0b0a.r2.dev/Registry-Image/Register_login_image.png"
      alt="CyberCrowd Register"
    />

    <button
      id="glassCaseTouch"
      class="glass-case-touch"
      type="button"
      aria-label="Play CyberCrowd R2 teaser"
    >
      <span class="sr-only">Play CyberCrowd R2 teaser</span>
    </button>

    <nav class="vault-menu" aria-label="CyberCrowd navigation">
      <a class="vault-btn register-btn" href="profile_signup.html">Register</a>
      <a class="vault-btn" href="readme.md">About</a>
      <a class="vault-btn" href="rules_regulations.html">Context</a>
    </nav>

    <audio
      id="teaserAudio"
      preload="auto"
      playsinline
      src="PASTE-YOUR-R2-TEASER-AUDIO-URL-HERE"
    ></audio>
  </main>

  <script>
    const glassCaseTouch = document.getElementById("glassCaseTouch");
    const teaserAudio = document.getElementById("teaserAudio");

    let teaserStarted = false;

    async function triggerR2Teaser(event) {
      event.preventDefault();
      event.stopPropagation();

      try {
        teaserAudio.muted = false;
        teaserAudio.volume = 1;

        if (!teaserStarted) {
          teaserStarted = true;
          teaserAudio.currentTime = 0;
        }

        await teaserAudio.play();
      } catch (error) {
        teaserStarted = false;
        console.error("CyberCrowd R2 teaser trigger failed:", error);
      }
    }

    glassCaseTouch.addEventListener("pointerdown", triggerR2Teaser, { passive: false });
    glassCaseTouch.addEventListener("touchstart", triggerR2Teaser, { passive: false });
    glassCaseTouch.addEventListener("click", triggerR2Teaser, { passive: false });
  </script>
</body>
</html>
