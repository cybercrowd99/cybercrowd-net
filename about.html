<script>

function launchDistrict(name){

const existing =
document.getElementById(
'about_window'
);

if(existing){

existing.remove();

}

const win =
document.createElement('div');

win.id = 'about_window';

win.style.position = 'fixed';

win.style.top = '120px';

win.style.left = '50%';

win.style.transform =
'translateX(-50%)';

win.style.width = '420px';

win.style.padding = '24px';

win.style.borderRadius = '22px';

win.style.background =
'rgba(5,10,18,.96)';

win.style.border =
'1px solid rgba(0,255,255,.35)';

win.style.boxShadow =
'0 0 24px rgba(0,255,255,.22)';

win.style.zIndex = '99999';

win.innerHTML = `

<div style="
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:18px;
">

<div style="
color:#00ffff;
font-size:20px;
letter-spacing:2px;
">
${name.toUpperCase()}
</div>

<button
onclick="
document.getElementById(
'about_window'
).remove()
"
style="
background:none;
border:none;
color:#00ffaa;
font-size:20px;
cursor:pointer;
">
✕
</button>

</div>

<div style="
line-height:1.8;
opacity:.88;
">

${name.toUpperCase()} routing surface active.

<br><br>

CyberCrowd operational environment responding.

</div>

`;

document.body.appendChild(win);

}

</script>
